<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1220" viewBox="0 0 1500 1220">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z"/></marker>
  </defs>
  <style>
    svg { background: #f7f4ee; font-family: Inter, Arial, sans-serif; }
    .title { font-size: 28px; font-weight: 700; fill: #161616; }
    .subtitle { font-size: 15px; fill: #555; }
    .card { fill: #fff; stroke: #c8c2b8; stroke-width: 2; }
    .card-title, .node-title { font-size: 20px; font-weight: 700; fill: #222; }
    .small { font-size: 13px; fill: #555; }
    .pattern { fill: #e7ddd0; fill-opacity: .72; stroke: #171717; stroke-width: 2.3; vector-effect: non-scaling-stroke; }
    .reference { stroke: #777; stroke-width: 1.2; stroke-dasharray: 7 5; vector-effect: non-scaling-stroke; }
    .grain { stroke: #111; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .dart { fill: none; stroke: #8a3f2e; stroke-width: 1.8; vector-effect: non-scaling-stroke; }
    .node { fill: #fff; stroke: #272727; stroke-width: 2; }
    .seam { stroke: #3f5a76; stroke-width: 4; }
    .seam-label { font-size: 14px; font-weight: 700; fill: #23384e; paint-order: stroke; stroke: #f7f4ee; stroke-width: 6; }
  </style>
  <text x="60" y="54" class="title">Grafo lógico da calça · quatro instâncias</text>
     <text x="60" y="82" class="subtitle">Duas pernas tubulares, gancho contínuo, cintura e barras abertas</text>
     <g>
      <line x1="288" y1="330" x2="288" y2="730" class="seam"/>
      <text x="218" y="520" text-anchor="middle" class="seam-label">left-outseam</text>
    </g>
<g>
      <line x1="492" y1="330" x2="492" y2="730" class="seam"/>
      <text x="562" y="520" text-anchor="middle" class="seam-label">left-inseam</text>
    </g>
<g>
      <line x1="1028" y1="330" x2="1028" y2="730" class="seam"/>
      <text x="958" y="520" text-anchor="middle" class="seam-label">right-outseam</text>
    </g>
<g>
      <line x1="1232" y1="330" x2="1232" y2="730" class="seam"/>
      <text x="1302" y="520" text-anchor="middle" class="seam-label">right-inseam</text>
    </g>
<g>
      <line x1="390" y1="330" x2="1130" y2="330" class="seam"/>
      <text x="760" y="320" text-anchor="middle" class="seam-label">front-rise</text>
    </g>
<g>
      <line x1="390" y1="730" x2="1130" y2="730" class="seam"/>
      <text x="760" y="720" text-anchor="middle" class="seam-label">back-rise</text>
    </g>
     <g>
      <rect x="240" y="260" width="300" height="140" rx="18" class="node"/>
      <text x="258" y="294" class="node-title">front · left</text>
      <text x="258" y="322" class="small">straight-pants-front:panel:1</text>
      <text x="258" y="348" class="small">origem: straight-pants-front</text>
      <text x="258" y="374" class="small">espelhado: não</text>
    </g>
<g>
      <rect x="980" y="260" width="300" height="140" rx="18" class="node"/>
      <text x="998" y="294" class="node-title">front · right</text>
      <text x="998" y="322" class="small">straight-pants-front:panel:2</text>
      <text x="998" y="348" class="small">origem: straight-pants-front</text>
      <text x="998" y="374" class="small">espelhado: sim</text>
    </g>
<g>
      <rect x="240" y="660" width="300" height="140" rx="18" class="node"/>
      <text x="258" y="694" class="node-title">back · left</text>
      <text x="258" y="722" class="small">straight-pants-back:panel:1</text>
      <text x="258" y="748" class="small">origem: straight-pants-back</text>
      <text x="258" y="774" class="small">espelhado: não</text>
    </g>
<g>
      <rect x="980" y="660" width="300" height="140" rx="18" class="node"/>
      <text x="998" y="694" class="node-title">back · right</text>
      <text x="998" y="722" class="small">straight-pants-back:panel:2</text>
      <text x="998" y="748" class="small">origem: straight-pants-back</text>
      <text x="998" y="774" class="small">espelhado: sim</text>
    </g>
     <text x="60" y="940" class="card-title">Conectores deliberadamente abertos</text>
     <text x="70" y="980" class="small">aberto · straight-pants-back:panel:1:connector:hem</text>
<text x="70" y="1004" class="small">aberto · straight-pants-back:panel:1:connector:waist</text>
<text x="70" y="1028" class="small">aberto · straight-pants-back:panel:2:connector:hem</text>
<text x="70" y="1052" class="small">aberto · straight-pants-back:panel:2:connector:waist</text>
<text x="70" y="1076" class="small">aberto · straight-pants-front:panel:1:connector:hem</text>
<text x="70" y="1100" class="small">aberto · straight-pants-front:panel:1:connector:waist</text>
<text x="70" y="1124" class="small">aberto · straight-pants-front:panel:2:connector:hem</text>
<text x="70" y="1148" class="small">aberto · straight-pants-front:panel:2:connector:waist</text>
</svg>