name: Recovery 9.5-05 Preview Artifact

on:
  push:
    branches:
      - "recovery/9.5-05-modeling-operations"
    paths:
      - ".github/workflows/recovery-modeling-preview-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: recovery-9-5-05-preview-${{ github.sha }}
          path: apps/web/dist
          retention-days: 2
          if-no-files-found: error
