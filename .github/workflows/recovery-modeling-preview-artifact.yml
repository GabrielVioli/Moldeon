name: Moldeon Mobile Vercel Build

on:
  push:
    branches:
      - "deploy/test-mobile-20260828"
    paths:
      - ".github/workflows/recovery-modeling-preview-artifact.yml"
      - "apps/web/src/avatar/ApprovedAvatarAsset.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: moldeon-mobile-vercel-dist
          path: apps/web/dist
          retention-days: 1
          if-no-files-found: error
