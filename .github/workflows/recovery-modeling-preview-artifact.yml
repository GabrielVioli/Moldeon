name: Moldeon Mobile Vercel Build

on:
  push:
    branches:
      - "deploy/test-mobile-20260828"
    paths:
      - ".github/workflows/recovery-modeling-preview-artifact.yml"
      - "apps/web/src/avatar/ApprovedAvatarAsset.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Patch CDN-hosted module paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('apps/web/dist')
          cdn = 'https://cdn.jsdelivr.net/gh/GabrielVioli/Moldeon@mobile-preview-static/'
          main = next((dist / 'assets').glob('index-*.js'))
          text = main.read_text()
          old = 'Tn=function(e){return`/`+e}'
          new = f'Tn=function(e){{return`{cdn}`+e}}'
          if old not in text:
              raise SystemExit('Vite preload base marker not found')
          main.write_text(text.replace(old, new, 1))

          garment = next((dist / 'assets').glob('GarmentViewport-*.js'))
          text = garment.read_text()
          old = 'sourceUrl:`/models/human/canonical-female.glb`'
          new = f'sourceUrl:`{cdn}models/human/canonical-female.glb`'
          if old not in text:
              raise SystemExit('Avatar source marker not found')
          garment.write_text(text.replace(old, new, 1))
          PY
      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: moldeon-mobile-vercel-dist
          path: apps/web/dist
          retention-days: 1
          if-no-files-found: error
      - name: Publish CDN snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          cp -R apps/web/dist /tmp/moldeon-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan mobile-preview-static
          git rm -rf .
          cp -R /tmp/moldeon-dist/. .
          git add --all
          git commit -m "chore: publish mobile preview ${GITHUB_SHA::7}"
          git push --force origin HEAD:mobile-preview-static
