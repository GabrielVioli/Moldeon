name: Build Test 10.1 Preview

on:
  push:
    branches:
      - "deploy/test-10-1-95a35d9"
    paths:
      - ".github/workflows/deploy-test-10-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: moldeon-10-1-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1
