name: Prompt 7 Final Follow-up

on:
  push:
    paths:
      - apps/web/src/patterns/trouserVisualEvidence.ts
      - apps/web/src/patterns/trouserVisualAudit.test.ts
      - scripts/prompt07-generate.ts
      - .github/workflows/prompt07-final-followup.yml

permissions:
  contents: write

concurrency:
  group: prompt07-final-followup-main
  cancel-in-progress: true

jobs:
  audit-document-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PROMPT07_ARTIFACT_DIR: artifacts/prompt07-trousers
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check source tree
        run: git diff --check
      - name: Typecheck
        run: npm run typecheck
      - name: Generate golden datasets
        run: npm run test --workspace @moldeon/web -- --update
      - name: Run immutable full suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Generate SVG evidence
        run: npx vite-node scripts/prompt07-generate.ts
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect SVGs and capture screenshots
        run: node scripts/prompt07-audit.mjs
      - name: Commit visual evidence
        run: |
          mkdir -p docs/evidence/prompt07-trousers
          cp -f artifacts/prompt07-trousers/* docs/evidence/prompt07-trousers/
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/patterns/__snapshots__ docs/evidence/prompt07-trousers
          git commit -m "test: add prompt 7 trouser visual evidence"
      - name: Document research, formulas and limitations
        run: |
          python scripts/prompt07-docs.py
          git add README.md docs/PATTERN_LIBRARY.md docs/progress/PROMPT_07_TROUSERS.md
          git commit -m "docs: document prompt 7 trouser construction"
      - name: Remove temporary delivery automation and push
        run: |
          git rm -f scripts/prompt07-apply.py scripts/prompt07-followup.py scripts/prompt07-generate.ts scripts/prompt07-audit.mjs scripts/prompt07-docs.py .github/workflows/prompt07-trousers.yml .github/workflows/prompt07-trousers-followup.yml .github/workflows/prompt07-final.yml .github/workflows/prompt07-final-followup.yml
          git commit -m "chore: remove prompt 7 delivery automation"
          git push origin main
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt07-trousers-${{ github.sha }}
          path: artifacts/prompt07-trousers
          retention-days: 21
          if-no-files-found: warn
