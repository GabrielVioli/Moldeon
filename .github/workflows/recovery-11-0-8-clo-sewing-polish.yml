name: Recovery 11.0.8 CLO sewing polish

on:
  workflow_dispatch:
  push:
    branches:
      - "recovery/11.0.8-sewing-2d-3d-authoring"
    paths:
      - "scripts/polish-11-0-8-clo-sewing.py"
      - ".github/workflows/recovery-11-0-8-clo-sewing-polish.yml"

permissions:
  contents: write

concurrency:
  group: recovery-11-0-8-clo-sewing-polish
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: "recovery/11.0.8-sewing-2d-3d-authoring"
          fetch-depth: 0

      - name: Verify triggering commit is branch head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Apply CLO-like sewing polish
        run: python3 scripts/polish-11-0-8-clo-sewing.py

      - name: Diff check
        run: git diff --check

      - name: Guard architecture
        shell: bash
        run: |
          if git diff --name-only | grep -q '^apps/web/src/physics/'; then
            echo 'physics/** must remain untouched' >&2
            exit 1
          fi
          if git diff --name-only | grep -q '^apps/web/src/garment3d/.*Xpbd'; then
            echo 'XPBD path must remain untouched' >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused 11.0.8 tests
        run: npm run test --workspace @moldeon/web -- src/garment3d/ResolvedAssemblyInput.test.ts src/domain/sewingArcLengthAuthoring.test.ts src/state/assemblyHistory.test.ts src/viewport/SewingInteraction.test.ts src/viewport/SewingVisualPairing.test.ts src/viewport/ArrangementWorkspace.test.ts --reporter=verbose

      - name: Production build
        run: npm run build

      - name: Commit validated product polish and remove temporary helpers
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/viewport/SewingViewportOverlay.ts \
            apps/web/src/components/AssemblyPanel.tsx \
            apps/web/src/state/editorStore.ts \
            apps/web/src/state/assemblyHistory.test.ts \
            apps/web/src/viewport/SewingVisualPairing.test.ts \
            apps/web/src/styles.css \
            docs/modifications-11.0.8.md
          git rm -f \
            scripts/polish-11-0-8-clo-sewing.py \
            scripts/refine-11-0-8-sewing.py \
            scripts/refine-11-0-8-sewing-pass2.py \
            .github/workflows/recovery-11-0-8-clo-sewing-polish.yml \
            .github/workflows/recovery-11-0-8-sewing-refine.yml \
            .github/workflows/recovery-11-0-8-sewing-refine-pass2.yml || true
          git commit -m "refactor(sewing): polish CLO-like authoring feedback"
          git push origin HEAD:recovery/11.0.8-sewing-2d-3d-authoring
