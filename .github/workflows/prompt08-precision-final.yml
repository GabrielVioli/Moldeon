name: Prompt 8 Continuous Arc Final

on:
  push:
    paths:
      - scripts/prompt08-precision-fix.py
      - .github/workflows/prompt08-precision-final.yml

permissions:
  contents: write

concurrency:
  group: prompt08-final-main
  cancel-in-progress: true

jobs:
  validate-audit-document-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROMPT08_ARTIFACT_DIR: artifacts/prompt08-sleeves
      PROMPT08_BASE_URL: http://127.0.0.1:4178
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply complete Prompt 8 implementation
        run: |
          python scripts/prompt08-finalize.py
          python scripts/prompt08-arc-fix.py
          python scripts/prompt08-precision-fix.py
      - name: Patch mobile audit prerequisite
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/prompt08-browser-audit.mjs")
          source = path.read_text(encoding="utf-8")
          old = '''  const card = page.locator("button.template-card").filter({ hasText: "Corpo básico" }).first();
            await card.scrollIntoViewIfNeeded();
            await card.click();
            await dialog.waitFor({ state: "hidden", timeout: 20_000 });
          '''
          new = '''  const card = page.locator("button.template-card").filter({ hasText: "Corpo básico" }).first();
            await card.waitFor({ state: "visible" });
            await card.focus();
            await page.keyboard.press("Enter");
            await dialog.waitFor({ state: "hidden", timeout: 20_000 });
          '''
          if source.count(old) != 1:
              raise SystemExit(f"library selection block not found exactly once: {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install dependencies
        run: npm install
      - name: Check patch
        run: git diff --check
      - name: Typecheck
        run: npm run typecheck
      - name: Refresh golden snapshot
        run: npm run test --workspace @moldeon/web -- --update
      - name: Run immutable full suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser controller
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Audit real desktop and mobile flows
        run: |
          mkdir -p "$PROMPT08_ARTIFACT_DIR"
          (
            cd apps/web
            npx vite --mode fallback --host 127.0.0.1 --port 4178 --strictPort
          ) > "$PROMPT08_ARTIFACT_DIR/server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if curl --silent --fail "$PROMPT08_BASE_URL" >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$PROMPT08_ARTIFACT_DIR/server.log"
              exit 1
            fi
            sleep 0.25
          done
          curl --silent --fail "$PROMPT08_BASE_URL" >/dev/null
          node scripts/prompt08-browser-audit.mjs
          cleanup
          trap - EXIT
      - name: Commit continuous mapping and evidence
        run: |
          mkdir -p docs/evidence/prompt08-sleeves
          cp -f artifacts/prompt08-sleeves/* docs/evidence/prompt08-sleeves/
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src docs/evidence/prompt08-sleeves
          git commit -m "test: validate continuous sleeve arcs on desktop and mobile"
      - name: Document formulas, tolerances and limits
        run: |
          python scripts/prompt08-docs.py
          git add README.md docs/PATTERN_LIBRARY.md docs/SLEEVE_SYSTEM.md docs/progress/PROMPT_08_SLEEVES.md
          git commit -m "docs: document guided sleeve system"
      - name: Remove delivery automation and push
        run: |
          git rm -f \
            scripts/prompt08-apply.py \
            scripts/prompt08-followup.py \
            scripts/prompt08-finalize.py \
            scripts/prompt08-arc-fix.py \
            scripts/prompt08-precision-fix.py \
            scripts/prompt08-browser-audit.mjs \
            scripts/prompt08-docs.py \
            scripts/prompt08-diagnose.ts \
            .github/workflows/prompt08-integration.yml \
            .github/workflows/prompt08-integration-followup.yml \
            .github/workflows/prompt08-final.yml \
            .github/workflows/prompt08-final-followup.yml \
            .github/workflows/prompt08-diagnose.yml \
            .github/workflows/prompt08-precision-final.yml
          git commit -m "chore: remove prompt 8 delivery automation"
          git push origin main
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt08-sleeves-${{ github.sha }}
          path: artifacts/prompt08-sleeves
          retention-days: 21
          if-no-files-found: warn
