name: Prompt 8 Sleeve Integration Follow-up

on:
  push:
    paths:
      - scripts/prompt08-followup.py
      - .github/workflows/prompt08-integration-followup.yml

permissions:
  contents: write

concurrency:
  group: prompt08-sleeves-main
  cancel-in-progress: true

jobs:
  integrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply integration patches
        run: |
          python scripts/prompt08-apply.py
          python scripts/prompt08-followup.py
      - name: Install dependencies
        run: npm install
      - name: Check patch
        run: git diff --check
      - name: Typecheck
        run: npm run typecheck
      - name: Generate sleeve golden snapshot
        run: npm run test --workspace @moldeon/web -- --update
      - name: Run immutable full suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit integrated sleeve system
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src
          git commit -m "feat: integrate guided armhole-derived sleeve system"
          git push origin main
