name: Build Recovery 9.5-07 Preview Artifact

on:
  push:
    branches:
      - "deploy/9.5-07-latest-preview"
    paths:
      - ".github/workflows/deploy-9507-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: moldeon-9507-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1
