name: Publish Recovery 9.5-07 Preview Assets

on:
  push:
    branches:
      - "deploy/9.5-07-latest-preview"
    paths:
      - ".github/workflows/deploy-9507-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Publish dist to isolated static branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/moldeon-static
          mkdir -p /tmp/moldeon-static
          cp -a apps/web/dist/. /tmp/moldeon-static/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy-static-9507
          git rm -rf .
          cp -a /tmp/moldeon-static/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: recovery 9.5-07 static build"
          git push origin HEAD:deploy-static-9507 --force
