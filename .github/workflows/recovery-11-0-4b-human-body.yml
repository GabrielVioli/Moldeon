name: recovery-11.0.4b-human-body

on:
  push:
    branches:
      - recovery/11.0.4b-canonical-female-human-body

permissions:
  contents: write

jobs:
  human-body:
    if: github.event.head_commit.message != 'fix(body): materialize canonical anatomy'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply canonical anatomy refinements
        run: |
          python3 scripts/recovery11_0_4b_cross_sections.py
          python3 scripts/recovery11_0_4b_reference_shape.py
          python3 scripts/recovery11_0_4b_integrate_human_body.py
      - name: Diff check
        run: git diff --check
      - name: Typecheck
        run: npm run typecheck
      - name: HumanBody geometry and measurements
        run: npm run test --workspace @moldeon/web -- src/avatar/HumanBodyModel.test.ts
      - name: Avatar compatibility and visual bridge
        run: npm run test --workspace @moldeon/web -- src/avatar/AvatarParametricModel.test.ts src/viewport/AvatarVisual.test.ts
      - name: Build
        run: npm run build
      - name: Materialize validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/avatar/HumanBodyModel.ts apps/web/src/avatar/AvatarParametricModel.ts apps/web/src/viewport/GlobalThreeViewport.ts
          git diff --cached --check
          git commit -m "fix(body): materialize canonical anatomy"
          git push origin HEAD:recovery/11.0.4b-canonical-female-human-body
