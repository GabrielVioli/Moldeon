name: recovery-11.0.4b-human-body

on:
  push:
    branches:
      - recovery/11.0.4b-canonical-female-human-body

permissions:
  contents: write

jobs:
  materialize-human-body:
    if: github.event.head_commit.message != 'fix(body): materialize validated canonical geometry'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply validated P0 geometry recovery
        run: |
          python3 scripts/recovery11_0_4b_p0_geometry.py
          python3 scripts/recovery11_0_4b_p0_geometry_round2.py
          python3 scripts/recovery11_0_4b_p0_geometry_spatial_weld.py
          python3 scripts/recovery11_0_4b_p0_geometry_boundary_fill.py
          python3 scripts/recovery11_0_4b_p0_geometry_calibration_only.py
      - run: git diff --check
      - run: npm run typecheck
      - run: npm run test --workspace @moldeon/web -- src/avatar/HumanBodyModel.metrics.test.ts src/avatar/HumanBodyModel.test.ts --reporter=verbose
      - run: npm run test --workspace @moldeon/web -- src/avatar/AvatarParametricModel.test.ts src/viewport/AvatarVisual.test.ts
      - run: npm run build
      - name: Materialize validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/avatar/HumanBodyModel.ts
          git diff --cached --check
          git commit -m "fix(body): materialize validated canonical geometry"
          git push origin HEAD:recovery/11.0.4b-canonical-female-human-body
