name: recovery-11.0.4b-human-body

on:
  push:
    branches:
      - recovery/11.0.4b-canonical-female-human-body

permissions:
  contents: read

jobs:
  human-body:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Diff check
        run: git diff --check HEAD^
      - name: Typecheck
        run: npm run typecheck
      - name: HumanBody geometry and measurements
        run: npm run test --workspace @moldeon/web -- src/avatar/HumanBodyModel.test.ts
      - name: Avatar compatibility and visual bridge
        run: npm run test --workspace @moldeon/web -- src/avatar/AvatarParametricModel.test.ts src/viewport/AvatarVisual.test.ts
      - name: Build
        run: npm run build
