name: recovery-11.0.4b-human-body

on:
  push:
    branches:
      - recovery/11.0.4b-canonical-female-human-body
  pull_request:
    branches:
      - recovery/11.0.4a-waistband-zero-energy

permissions:
  contents: read

jobs:
  human-body:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply P0 geometry recovery prototypes
        run: |
          python3 scripts/recovery11_0_4b_p0_geometry.py
          python3 scripts/recovery11_0_4b_p0_geometry_round2.py
          python3 scripts/recovery11_0_4b_p0_geometry_round3.py
          python3 scripts/recovery11_0_4b_p0_geometry_round4.py
          python3 scripts/recovery11_0_4b_p0_geometry_round5.py
          python3 scripts/recovery11_0_4b_p0_geometry_round6.py
      - name: Diff check
        run: git diff --check
      - name: Typecheck
        run: npm run typecheck
      - name: Geometry metrics probe
        run: npm run test --workspace @moldeon/web -- src/avatar/HumanBodyModel.metrics.test.ts --reporter=verbose
      - name: HumanBody geometry and measurements
        run: npm run test --workspace @moldeon/web -- src/avatar/HumanBodyModel.test.ts --reporter=verbose
      - name: Avatar compatibility and visual bridge
        run: npm run test --workspace @moldeon/web -- src/avatar/AvatarParametricModel.test.ts src/viewport/AvatarVisual.test.ts
      - name: Build
        run: npm run build