name: recovery-11.0.4a-persist-band

on:
  pull_request:
    branches:
      - recovery/11.0.4-human-body-placement-scale
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  persist-band-source:
    if: ${{ github.head_ref == 'recovery/11.0.4a-waistband-zero-energy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: recovery/11.0.4a-waistband-zero-energy

      - name: Detect persistence commit
        id: gate
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -Fq '[persist-band-source]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Materialize proven band topology and developable mapping
        if: steps.gate.outputs.skip != 'true'
        run: |
          python3 scripts/recovery11_0_4_attachment_topology.py
          python3 scripts/recovery11_0_4_developable_attachment.py

      - name: Diff check
        if: steps.gate.outputs.skip != 'true'
        run: git diff --check

      - name: Typecheck
        if: steps.gate.outputs.skip != 'true'
        run: npm run typecheck

      - name: Focused skirt and tube band invariance gate
        if: steps.gate.outputs.skip != 'true'
        run: npm run test --workspace @moldeon/web -- src/physics/phase0BandAttachmentInvariant.test.ts -t 'spatial-four-panel-tube|straight-skirt-standard'

      - name: Four-panel waistband zero-energy gate
        if: steps.gate.outputs.skip != 'true'
        env:
          MOLDEON_PHASE_A_REPORT: "1"
        run: npm run test --workspace @moldeon/web -- src/physics/zeroEnergyInitialDressPose.test.ts -t phase-a-four-panel-waistband

      - name: Persist implementation only
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/garment3d/PanelRefinement.ts \
            apps/web/src/garment3d/GarmentAssembly.ts \
            apps/web/src/garment3d/CoarseAssemblyMesh.ts \
            apps/web/src/garment3d/IsometricSurfaceAssembly.ts
          git diff --cached --check
          git commit -m "[persist-band-source] feat(phase0): develop attached narrow bands from seam anchors"
          git push origin HEAD:recovery/11.0.4a-waistband-zero-energy
