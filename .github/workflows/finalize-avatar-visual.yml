name: Finalize Avatar Visual

on:
  push:
    paths:
      - scripts/finalize-avatar-visual.py
      - scripts/audit-avatar-visual.mjs
      - .github/workflows/finalize-avatar-visual.yml

permissions:
  contents: write

concurrency:
  group: finalize-avatar-visual-main
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AVATAR_AUDIT_URL: http://127.0.0.1:4179
      AVATAR_AUDIT_DIR: artifacts/avatar-visual-final
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply remaining visual corrections
        run: python scripts/finalize-avatar-visual.py
      - name: Install dependencies
        run: npm ci
      - name: Check patch
        run: git diff --check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install temporary browser audit dependencies
        run: npm install --no-save --package-lock=false playwright-core@1.55.0 pngjs@7.0.0
      - name: Inspect rendered pixels on desktop and mobile
        run: |
          mkdir -p "$AVATAR_AUDIT_DIR"
          (
            cd apps/web
            npx vite --mode fallback --host 127.0.0.1 --port 4179 --strictPort
          ) > "$AVATAR_AUDIT_DIR/server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if curl --silent --fail "$AVATAR_AUDIT_URL" >/dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat "$AVATAR_AUDIT_DIR/server.log"; exit 1; fi
            sleep 0.25
          done
          curl --silent --fail "$AVATAR_AUDIT_URL" >/dev/null
          node scripts/audit-avatar-visual.mjs
          cleanup
          trap - EXIT
      - name: Commit visual fixes
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add \
            apps/web/src/viewport/GlobalThreeViewport.ts \
            apps/web/src/viewport/GarmentViewport.tsx \
            apps/web/src/garment3d/SemanticAvatarArrangement.ts \
            apps/web/src/garment3d/SemanticAvatarArrangement.test.ts
          git commit -m "fix: render a continuous dressed avatar"
      - name: Commit visual evidence
        run: |
          mkdir -p docs/evidence/avatar-visual-final
          cp -f "$AVATAR_AUDIT_DIR"/* docs/evidence/avatar-visual-final/
          git add docs/evidence/avatar-visual-final
          git commit -m "test: record rendered avatar pixels"
      - name: Remove temporary delivery files and push
        run: |
          git rm -f \
            scripts/finalize-avatar-visual.py \
            scripts/audit-avatar-visual.mjs \
            .github/workflows/finalize-avatar-visual.yml
          git commit -m "chore: remove avatar visual delivery workflow"
          git push origin main
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-visual-final-${{ github.sha }}
          path: artifacts/avatar-visual-final
          retention-days: 21
          if-no-files-found: warn
