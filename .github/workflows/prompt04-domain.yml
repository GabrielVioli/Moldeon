name: Prompt 04 Domain

on:
  push:
    paths:
      - scripts/prompt04-domain/**
      - .github/workflows/prompt04-domain.yml

permissions:
  contents: write

concurrency:
  group: prompt04-domain-main
  cancel-in-progress: true

jobs:
  domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Apply internal path domain patch
        run: |
          cat \
            scripts/prompt04-domain/chunk-00a.txt \
            scripts/prompt04-domain/chunk-00b.txt \
            scripts/prompt04-domain/chunk-01.txt \
            scripts/prompt04-domain/chunk-02.txt \
            scripts/prompt04-domain/chunk-03.txt \
            scripts/prompt04-domain/chunk-04.txt \
            scripts/prompt04-domain/chunk-05.txt \
            > /tmp/prompt04-domain.b64
          base64 -d /tmp/prompt04-domain.b64 | gzip -d > /tmp/prompt04-domain-apply.mjs
          node /tmp/prompt04-domain-apply.mjs

      - name: Correct geometric sampling and tangency diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(source: str, before: str, after: str, label: str) -> str:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return source.replace(before, after)

          path = Path("apps/web/src/domain/internalPaths.ts")
          source = path.read_text(encoding="utf-8")

          source = replace_required(source, '''function samplePathWithMetadata(path: InternalPath): SampledPathPoint[] {
            const nodes = new Map(path.nodes.map((node) => [node.id, node]));
            const result: SampledPathPoint[] = [];
            let walked = 0;
            for (const segment of path.segments) {
              const start = nodes.get(segment.startNodeId);
              const end = nodes.get(segment.endNodeId);
              if (!start || !end) continue;
              const steps = segment.kind === "cubic" ? PATH_CURVE_STEPS : 1;
              let previous: PatternVector | null = null;
              for (let step = 0; step <= steps; step += 1) {
                const t = step / steps;
                const point = pointOnInternalSegment(segment, start, end, t);
                if (previous) walked += distance(previous, point);
                if (result.length === 0 || distance(result.at(-1)!, point) > 1e-8) {
                  result.push({ ...point, segmentId: segment.id, segmentT: t, distanceMm: walked });
                } else {
                  result[result.length - 1] = { ...point, segmentId: segment.id, segmentT: t, distanceMm: walked };
                }
                previous = point;
              }
            }
            return result;
          }''', '''function samplePathWithMetadata(path: InternalPath): SampledPathPoint[] {
            const nodes = new Map(path.nodes.map((node) => [node.id, node]));
            const result: SampledPathPoint[] = [];
            let walked = 0;
            for (const segment of path.segments) {
              const start = nodes.get(segment.startNodeId);
              const end = nodes.get(segment.endNodeId);
              if (!start || !end) continue;
              const steps = segment.kind === "cubic" ? PATH_CURVE_STEPS : 1;
              let previous: PatternVector | null = null;
              for (let step = 0; step <= steps; step += 1) {
                const t = step / steps;
                const point = pointOnInternalSegment(segment, start, end, t);
                if (previous) walked += distance(previous, point);
                result.push({ ...point, segmentId: segment.id, segmentT: t, distanceMm: walked });
                previous = point;
              }
            }
            return result;
          }''', "path metadata sampling")

          source = replace_required(source, '''function sampleContourWithMetadata(pieceValue: PatternPiece): SampledContourPoint[] {
            const piece = migrateLegacyPieceToSegments(structuredClone(pieceValue));
            const nodes = new Map((piece.nodes ?? []).map((node) => [node.id, node]));
            const segments = new Map((piece.segments ?? []).map((segment) => [segment.id, segment]));
            const ordered = piece.contours?.find((contour) => contour.closed)?.segmentIds ?? [];
            const result: SampledContourPoint[] = [];
            let walked = 0;
            for (const id of ordered) {
              const segment = segments.get(id);
              const start = segment && nodes.get(segment.startNodeId);
              const end = segment && nodes.get(segment.endNodeId);
              if (!segment || !start || !end) continue;
              const steps = segment.kind === "cubic" ? CONTOUR_CURVE_STEPS : 1;
              let previous: PatternVector | null = null;
              for (let step = 0; step <= steps; step += 1) {
                const t = step / steps;
                const point = pointOnPatternSegment(segment, start, end, t);
                if (previous) walked += distance(previous, point);
                if (result.length === 0 || distance(result.at(-1)!, point) > 1e-8) {
                  result.push({ ...point, edgeId: segment.id, edgeT: t, distanceMm: walked });
                } else {
                  result[result.length - 1] = { ...point, edgeId: segment.id, edgeT: t, distanceMm: walked };
                }
                previous = point;
              }
            }
            if (result.length > 0 && distance(result[0], result.at(-1)!) > 1e-8) {
              const first = result[0];
              walked += distance(result.at(-1)!, first);
              result.push({ ...first, distanceMm: walked });
            }
            return result;
          }''', '''function sampleContourWithMetadata(pieceValue: PatternPiece): SampledContourPoint[] {
            const piece = migrateLegacyPieceToSegments(structuredClone(pieceValue));
            const nodes = new Map((piece.nodes ?? []).map((node) => [node.id, node]));
            const segments = new Map((piece.segments ?? []).map((segment) => [segment.id, segment]));
            const ordered = piece.contours?.find((contour) => contour.closed)?.segmentIds ?? [];
            const result: SampledContourPoint[] = [];
            let walked = 0;
            for (const id of ordered) {
              const segment = segments.get(id);
              const start = segment && nodes.get(segment.startNodeId);
              const end = segment && nodes.get(segment.endNodeId);
              if (!segment || !start || !end) continue;
              const steps = segment.kind === "cubic" ? CONTOUR_CURVE_STEPS : 1;
              let previous: PatternVector | null = null;
              for (let step = 0; step <= steps; step += 1) {
                const t = step / steps;
                const point = pointOnPatternSegment(segment, start, end, t);
                if (previous) walked += distance(previous, point);
                result.push({ ...point, edgeId: segment.id, edgeT: t, distanceMm: walked });
                previous = point;
              }
            }
            return result;
          }''', "contour metadata sampling")

          source = replace_required(source, '''  const nearBoundaryWithoutCrossing =
            intersections.length < 2 &&
            sampledPath.some((point) => nearestContourDistance(sampledContour, point) <= INTERSECTION_EPSILON_MM * 3);
          if (intersections.some((intersection) => intersection.tangent) || nearBoundaryWithoutCrossing) {
            diagnostics.push(errorDiagnostic("tangent-intersection", "O caminho apenas tangencia ou acompanha a borda. Faça-o atravessar o contorno com um ângulo perceptível.", intersections.find((intersection) => intersection.tangent) ?? sampledPath.find((point) => nearestContourDistance(sampledContour, point) <= INTERSECTION_EPSILON_MM * 3)));
          }''', '''  const boundaryTangency = findBoundaryTangency(sampledPath, sampledContour);
          const nearBoundaryWithoutCrossing =
            intersections.length < 2 &&
            sampledPath.some((point) => nearestContourDistance(sampledContour, point) <= INTERSECTION_EPSILON_MM * 3);
          if (intersections.some((intersection) => intersection.tangent) || boundaryTangency || nearBoundaryWithoutCrossing) {
            diagnostics.push(errorDiagnostic("tangent-intersection", "O caminho apenas tangencia ou acompanha a borda. Faça-o atravessar o contorno com um ângulo perceptível.", intersections.find((intersection) => intersection.tangent) ?? boundaryTangency ?? sampledPath.find((point) => nearestContourDistance(sampledContour, point) <= INTERSECTION_EPSILON_MM * 3)));
          }''', "tangency analysis")

          source = replace_required(source, '''  const nearestIndex = nearestContourIndex(contour, center);
            const centerDistance = contour[nearestIndex]?.distanceMm ?? 0;''', '''  const centerProjection = nearestContourProjection(contour, center);
            const centerDistance = centerProjection.distanceAlongMm;''', "dart contour projection")

          source = replace_required(source, '''function nearestContourDistance(contour: SampledContourPoint[], point: PatternVector): number {
            return contour.reduce((best, candidate) => Math.min(best, distance(candidate, point)), Number.POSITIVE_INFINITY);
          }

          function nearestContourIndex(contour: SampledContourPoint[], point: PatternVector): number {
            let bestIndex = 0;
            let bestDistance = Number.POSITIVE_INFINITY;
            contour.forEach((candidate, index) => {
              const candidateDistance = distance(candidate, point);
              if (candidateDistance < bestDistance) { bestDistance = candidateDistance; bestIndex = index; }
            });
            return bestIndex;
          }''', '''function nearestContourDistance(contour: SampledContourPoint[], point: PatternVector): number {
            return nearestContourProjection(contour, point).distanceMm;
          }

          function nearestContourProjection(
            contour: SampledContourPoint[],
            point: PatternVector,
          ): { distanceMm: number; distanceAlongMm: number; point: PatternVector } {
            let best = {
              distanceMm: Number.POSITIVE_INFINITY,
              distanceAlongMm: 0,
              point: vector(contour[0] ?? point),
            };
            for (let index = 0; index < contour.length - 1; index += 1) {
              const start = contour[index];
              const end = contour[index + 1];
              if (start.edgeId !== end.edgeId) continue;
              const projection = projectPointOnSegment(point, start, end);
              if (projection.distanceMm >= best.distanceMm) continue;
              best = {
                distanceMm: projection.distanceMm,
                distanceAlongMm: start.distanceMm + (end.distanceMm - start.distanceMm) * projection.t,
                point: lerp(start, end, projection.t),
              };
            }
            return best;
          }

          function findBoundaryTangency(
            path: SampledPathPoint[],
            contour: SampledContourPoint[],
          ): PatternVector | undefined {
            for (let pathIndex = 0; pathIndex < path.length - 1; pathIndex += 1) {
              const pathStart = path[pathIndex];
              const pathEnd = path[pathIndex + 1];
              if (pathStart.segmentId !== pathEnd.segmentId || distance(pathStart, pathEnd) <= 1e-9) continue;
              for (let contourIndex = 0; contourIndex < contour.length - 1; contourIndex += 1) {
                const contourStart = contour[contourIndex];
                const contourEnd = contour[contourIndex + 1];
                if (contourStart.edgeId !== contourEnd.edgeId || distance(contourStart, contourEnd) <= 1e-9) continue;
                const pathVector = subtract(pathEnd, pathStart);
                const contourVector = subtract(contourEnd, contourStart);
                const sine = Math.abs(cross(pathVector, contourVector)) / Math.max(1e-9, length(pathVector) * length(contourVector));
                if (sine >= TANGENCY_SINE) continue;
                const overlapX = Math.max(Math.min(pathStart.xMm, pathEnd.xMm), Math.min(contourStart.xMm, contourEnd.xMm)) <= Math.min(Math.max(pathStart.xMm, pathEnd.xMm), Math.max(contourStart.xMm, contourEnd.xMm)) + INTERSECTION_EPSILON_MM * 3;
                const overlapY = Math.max(Math.min(pathStart.yMm, pathEnd.yMm), Math.min(contourStart.yMm, contourEnd.yMm)) <= Math.min(Math.max(pathStart.yMm, pathEnd.yMm), Math.max(contourStart.yMm, contourEnd.yMm)) + INTERSECTION_EPSILON_MM * 3;
                if (!overlapX || !overlapY) continue;
                const candidates = [
                  { point: pathStart, distance: projectPointOnSegment(pathStart, contourStart, contourEnd).distanceMm },
                  { point: pathEnd, distance: projectPointOnSegment(pathEnd, contourStart, contourEnd).distanceMm },
                  { point: contourStart, distance: projectPointOnSegment(contourStart, pathStart, pathEnd).distanceMm },
                  { point: contourEnd, distance: projectPointOnSegment(contourEnd, pathStart, pathEnd).distanceMm },
                ].sort((left, right) => left.distance - right.distance);
                if (candidates[0].distance <= INTERSECTION_EPSILON_MM * 3) return vector(candidates[0].point);
              }
            }
            return undefined;
          }''', "nearest contour helpers")

          path.write_text(source, encoding="utf-8")

          document_path = Path("apps/web/src/domain/patternDocumentV3.ts")
          document_source = document_path.read_text(encoding="utf-8")
          document_source = document_source.replace(
              "possui lados com quantidades diferentes de intervalos.",
              "possui múltiplos intervalos com quantidades diferentes entre os lados.",
          )
          document_path.write_text(document_source, encoding="utf-8")
          PY

      - name: Adapt canvas internal path renderer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/editor/PatternCanvas.tsx")
          source = path.read_text(encoding="utf-8")
          old = '''    for (const line of piece.internalLines ?? []) {
                const points = line.points.map((point) => pieceLocalToWorld(point, transform));
                context.beginPath(); points.forEach((point, index) => index ? context.lineTo(point.xMm, point.yMm) : context.moveTo(point.xMm, point.yMm));
                context.setLineDash(line.purpose === "fold" ? [8 / camera.zoom, 5 / camera.zoom] : [3 / camera.zoom, 3 / camera.zoom]);
                context.strokeStyle = "#59636c"; context.lineWidth = 1.5 / camera.zoom; context.stroke(); context.setLineDash([]);
              }'''
          new = '''    for (const line of piece.internalLines ?? []) {
                const internal = line as unknown as {
                  purpose: string;
                  visible?: boolean;
                  points?: Array<{ xMm: number; yMm: number }>;
                  nodes?: Array<{ id: string; xMm: number; yMm: number }>;
                  segments?: Array<{
                    kind: "line" | "cubic";
                    startNodeId: string;
                    endNodeId: string;
                    control1?: { xMm: number; yMm: number };
                    control2?: { xMm: number; yMm: number };
                  }>;
                };
                if (internal.visible === false) continue;
                const nodeById = new Map((internal.nodes ?? []).map((node) => [node.id, node]));
                const localPoints = internal.points ?? (internal.segments ?? []).flatMap((segment, segmentIndex) => {
                  const start = nodeById.get(segment.startNodeId);
                  const end = nodeById.get(segment.endNodeId);
                  if (!start || !end) return [];
                  const steps = segment.kind === "cubic" ? 16 : 1;
                  const sampled = Array.from({ length: steps + 1 }, (_, index) => {
                    const t = index / steps;
                    if (segment.kind === "line") {
                      return { xMm: start.xMm + (end.xMm - start.xMm) * t, yMm: start.yMm + (end.yMm - start.yMm) * t };
                    }
                    const c1 = segment.control1 ?? start;
                    const c2 = segment.control2 ?? end;
                    const u = 1 - t;
                    return {
                      xMm: u * u * u * start.xMm + 3 * u * u * t * c1.xMm + 3 * u * t * t * c2.xMm + t * t * t * end.xMm,
                      yMm: u * u * u * start.yMm + 3 * u * u * t * c1.yMm + 3 * u * t * t * c2.yMm + t * t * t * end.yMm,
                    };
                  });
                  return segmentIndex === 0 ? sampled : sampled.slice(1);
                });
                const points = localPoints.map((point) => pieceLocalToWorld(point, transform));
                if (points.length < 2) continue;
                context.beginPath(); points.forEach((point, index) => index ? context.lineTo(point.xMm, point.yMm) : context.moveTo(point.xMm, point.yMm));
                context.setLineDash(internal.purpose === "fold" ? [8 / camera.zoom, 5 / camera.zoom] : internal.purpose === "reference" ? [3 / camera.zoom, 3 / camera.zoom] : []);
                context.strokeStyle = internal.purpose === "dart" ? "#b06084" : internal.purpose === "cut" || internal.purpose === "cut-and-sew" ? "#b3442e" : "#59636c";
                context.lineWidth = 1.5 / camera.zoom; context.stroke(); context.setLineDash([]);
              }'''
          if source.count(old) != 1:
              raise SystemExit(f"internal line renderer not found exactly once: {source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit domain implementation
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/domain/internalPaths.ts apps/web/src/domain/internalPaths.test.ts apps/web/src/domain/pattern.ts apps/web/src/domain/patternDocumentV3.ts apps/web/src/editor/PatternCanvas.tsx
          git rm -r scripts/prompt04-domain .github/workflows/prompt04-domain.yml
          git commit -m "feat: add canonical internal path geometry operations"
          git push origin main
