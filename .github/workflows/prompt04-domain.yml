name: Prompt 04 Domain

on:
  push:
    paths:
      - scripts/prompt04-domain/**
      - .github/workflows/prompt04-domain.yml

permissions:
  contents: write

concurrency:
  group: prompt04-domain-main
  cancel-in-progress: true

jobs:
  domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Apply internal path domain patch
        run: |
          cat scripts/prompt04-domain/chunk-*.txt > /tmp/prompt04-domain.b64
          base64 -d /tmp/prompt04-domain.b64 | gzip -d > /tmp/prompt04-domain-apply.mjs
          node /tmp/prompt04-domain-apply.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit domain implementation
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/domain/internalPaths.ts apps/web/src/domain/internalPaths.test.ts apps/web/src/domain/pattern.ts apps/web/src/domain/patternDocumentV3.ts
          git rm -r scripts/prompt04-domain .github/workflows/prompt04-domain.yml
          git commit -m "feat: add canonical internal path geometry operations"
          git push origin main
