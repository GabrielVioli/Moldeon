name: Apply Prompt 11 Body Collision

on:
  push:
    paths:
      - "scripts/.prompt11-payload/**"
      - "scripts/run-prompt11.py"
      - ".github/workflows/apply-prompt11.yml"

permissions:
  contents: write

concurrency:
  group: apply-prompt11-main
  cancel-in-progress: true

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROMPT11_BASE_URL: http://127.0.0.1:4181
      PROMPT11_ARTIFACT_DIR: artifacts/prompt11-body-collision

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Verify and apply body collision implementation
        run: python scripts/run-prompt11.py

      - name: Install dependencies
        run: npm ci

      - name: Check patch
        run: git diff --check

      - name: Enforce collision separation
        shell: bash
        run: |
          grep -R -n 'solveBodyCollisions' apps/web/src/physics
          grep -R -n 'buildCollisionBuffers' apps/web/src/garment3d
          if grep -R -n 'three' apps/web/src/physics/clothCollision.ts; then
            echo "Collision core must not depend on Three.js"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser controller
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Start fallback application
        shell: bash
        run: |
          mkdir -p "$PROMPT11_ARTIFACT_DIR"
          (cd apps/web && npx vite --mode fallback --host 127.0.0.1 --port 4181 --strictPort) > "$PROMPT11_ARTIFACT_DIR/server.log" 2>&1 &
          echo $! > "$PROMPT11_ARTIFACT_DIR/server.pid"
          for attempt in $(seq 1 120); do
            if curl --silent --fail "$PROMPT11_BASE_URL" >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat "$PROMPT11_ARTIFACT_DIR/server.log"
          exit 1

      - name: Audit body collision on desktop and mobile
        run: node scripts/prompt11-body-collision-browser-regression.mjs | tee "$PROMPT11_ARTIFACT_DIR/audit.json"

      - name: Stop fallback application
        if: always()
        shell: bash
        run: |
          if test -f "$PROMPT11_ARTIFACT_DIR/server.pid"; then kill "$(cat "$PROMPT11_ARTIFACT_DIR/server.pid")" 2>/dev/null || true; fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt11-body-collision-${{ github.sha }}
          path: artifacts/prompt11-body-collision
          retention-days: 21
          if-no-files-found: warn

      - name: Commit collision engine
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add \
            apps/web/src/physics/clothCollision.ts \
            apps/web/src/physics/clothXpbd.ts \
            apps/web/src/physics/ClothWorkerProtocol.ts \
            apps/web/src/garment3d/ClothSimulationInput.ts \
            apps/web/src/domain/fabric.ts \
            apps/web/src/avatar/AvatarCollisionModel.ts \
            apps/web/src/viewport/GlobalThreeViewport.ts \
            apps/web/src/components/FittingRoomDialog.tsx \
            apps/web/src/styles.css
          git commit -m "feat: add body collision and fabric contact physics"

      - name: Commit tests
        run: |
          git add \
            apps/web/src/physics/clothCollision.test.ts \
            apps/web/src/garment3d/ClothSimulationCollisionInput.test.ts \
            apps/web/src/domain/fabricPhysics.test.ts \
            scripts/prompt11-body-collision-browser-regression.mjs
          git commit -m "test: cover body contact and fabric physics"

      - name: Commit documentation
        run: |
          git add docs/BODY_COLLISION.md docs/PHYSICS_PLAN.md docs/progress/PROMPT_11_BODY_COLLISION.md
          git commit -m "docs: record body collision architecture"

      - name: Push validated commits
        run: git push origin main
