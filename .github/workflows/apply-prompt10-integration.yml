name: Apply Prompt 10 Worker Integration

on:
  push:
    paths:
      - "scripts/.prompt10-payload/**"
      - "scripts/run-prompt10-integration.py"
      - ".github/workflows/apply-prompt10-integration.yml"

permissions:
  contents: write

concurrency:
  group: apply-prompt10-integration-main
  cancel-in-progress: true

jobs:
  apply-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROMPT10_BASE_URL: http://127.0.0.1:4180
      PROMPT10_ARTIFACT_DIR: artifacts/prompt10-xpbd-regression

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Verify and apply Worker integration
        run: python scripts/run-prompt10-integration.py

      - name: Make the intentional SharedArrayBuffer mismatch explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/physics/ClothWorkerProtocol.test.ts")
          source = path.read_text(encoding="utf-8")
          old = "stitchBuffer.aIndices = new Uint32Array(new SharedArrayBuffer(0));"
          new = "stitchBuffer.aIndices = new Uint32Array(new SharedArrayBuffer(0)) as unknown as Uint32Array<ArrayBuffer>;"
          if old not in source:
              raise SystemExit("SharedArrayBuffer test marker not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Check patch
        run: git diff --check

      - name: Enforce Worker ownership
        shell: bash
        run: |
          if grep -R -n -E 'from "react"|from '\''react'\''' apps/web/src/physics apps/web/src/workers; then
            echo "React entered the per-particle physics path"
            exit 1
          fi
          if grep -R -n -E 'JSON\.stringify\([^)]*(position|particle)' apps/web/src/physics apps/web/src/workers; then
            echo "Particle buffers must not be serialized as JSON"
            exit 1
          fi
          grep -R -n 'new Worker' apps/web/src/physics/ClothWorkerBridge.ts
          grep -R -n 'refreshMeshFromAssembly' apps/web/src/viewport/GlobalThreeViewport.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser controller
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Start fallback application
        shell: bash
        run: |
          mkdir -p "$PROMPT10_ARTIFACT_DIR"
          (cd apps/web && npx vite --mode fallback --host 127.0.0.1 --port 4180 --strictPort) > "$PROMPT10_ARTIFACT_DIR/server.log" 2>&1 &
          echo $! > "$PROMPT10_ARTIFACT_DIR/server.pid"
          for attempt in $(seq 1 120); do
            if curl --silent --fail "$PROMPT10_BASE_URL" >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat "$PROMPT10_ARTIFACT_DIR/server.log"
          exit 1

      - name: Audit Worker simulation on desktop and mobile
        run: node scripts/prompt10-xpbd-browser-regression.mjs | tee "$PROMPT10_ARTIFACT_DIR/audit.json"

      - name: Stop fallback application
        if: always()
        shell: bash
        run: |
          if test -f "$PROMPT10_ARTIFACT_DIR/server.pid"; then kill "$(cat "$PROMPT10_ARTIFACT_DIR/server.pid")" 2>/dev/null || true; fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt10-xpbd-integration-${{ github.sha }}
          path: artifacts/prompt10-xpbd-regression
          retention-days: 21
          if-no-files-found: warn

      - name: Commit Worker integration
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add \
            apps/web/src/garment3d/ClothSimulationInput.ts \
            apps/web/src/physics/ClothWorkerProtocol.ts \
            apps/web/src/physics/ClothWorkerBridge.ts \
            apps/web/src/workers/cloth.worker.ts \
            apps/web/src/viewport/GlobalThreeViewport.ts \
            apps/web/src/styles.css
          git commit -m "feat: run garment XPBD in a Web Worker"

      - name: Commit tests
        run: |
          git add \
            apps/web/src/garment3d/ClothSimulationInput.test.ts \
            apps/web/src/physics/ClothWorkerProtocol.test.ts \
            apps/web/src/physics/clothXpbd.scenes.test.ts \
            scripts/prompt10-xpbd-browser-regression.mjs
          git commit -m "test: cover XPBD Worker lifecycle and scenes"

      - name: Commit documentation
        run: |
          git add docs/XPBD_IMPLEMENTATION.md docs/PHYSICS_PLAN.md docs/progress/PROMPT_10_XPBD_WORKER.md
          git commit -m "docs: record XPBD Worker architecture"

      - name: Push validated application commits
        run: |
          rm -f .github/workflows/prompt10-xpbd-regression.yml
          git push origin main
