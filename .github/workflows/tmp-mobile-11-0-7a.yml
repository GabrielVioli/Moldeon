name: Temporary mobile 11.0.7a touch workspace

on:
  push:
    branches:
      - feat/11.0.7a-mobile-touch-portrait-landscape

permissions:
  contents: write

jobs:
  mobile:
    if: github.event.head_commit.message == 'chore(mobile): run 11.0.7a touch workspace patch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import reviewed mobile layers from PR 14
        run: |
          git fetch origin feat/mobile-clean-workspace-v2 --depth=1
          git show FETCH_HEAD:apps/web/src/mobile-touch-workspace.css > apps/web/src/mobile-touch-workspace.css
          git show FETCH_HEAD:apps/web/src/mobile-touch-workspace-v2.css > apps/web/src/mobile-touch-workspace-v2.css

      - name: Apply 11.0.7a mobile patch
        run: python scripts/tmp-mobile-11-0-7a.py

      - name: Diff check
        run: git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused mobile and arrangement tests
        run: npm run test --workspace @moldeon/web -- src/viewport/GlobalThreeViewport.mobile.test.ts src/mobileWorkspaceCss.test.ts src/viewport/ArrangementWorkspace.adjustConform.test.ts src/viewport/ArrangementWorkspace.test.ts --reporter=verbose

      - name: Typecheck
        run: npm run typecheck --workspace @moldeon/web

      - name: Build
        run: npm run build

      - name: Capture portrait and landscape smoke screenshots
        shell: bash
        run: |
          mkdir -p mobile-smoke
          npm run preview --workspace @moldeon/web -- --host 127.0.0.1 --port 4173 > /tmp/moldeon-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --screenshot=mobile-smoke/portrait-390x844.png http://127.0.0.1:4173/
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=844,390 --screenshot=mobile-smoke/landscape-844x390.png http://127.0.0.1:4173/
          else
            echo "Chrome not available on runner" > mobile-smoke/chrome-unavailable.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-11-0-7a-smoke
          path: mobile-smoke
          if-no-files-found: error
          retention-days: 2

      - name: Commit validated mobile branch
        run: |
          git config user.name "Moldeon mobile validation"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/tmp-mobile-11-0-7a.py .github/workflows/tmp-mobile-11-0-7a.yml
          git add apps/web/index.html apps/web/public/manifest.webmanifest apps/web/src/main.tsx apps/web/src/mobile-touch-workspace.css apps/web/src/mobile-touch-workspace-v2.css apps/web/src/mobile-touch-workspace-11-0-7a.css apps/web/src/mobileWorkspaceCss.test.ts apps/web/src/editor/PatternCanvasLegacy.tsx apps/web/src/viewport/GarmentViewport.tsx apps/web/src/viewport/GlobalThreeViewport.ts apps/web/src/viewport/GlobalThreeViewport.mobile.test.ts
          git commit -m "feat(mobile): optimize touch workspace for portrait and landscape"
          git push origin HEAD:feat/11.0.7a-mobile-touch-portrait-landscape
