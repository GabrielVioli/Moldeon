name: Prompt 04 UI

on:
  push:
    paths:
      - scripts/prompt04-ui.py
      - scripts/prompt04-context-fix.py
      - apps/web/src/state/internalPathEditorStore.ts
      - apps/web/src/components/ContextBar.tsx
      - .github/workflows/prompt04-ui.yml

permissions:
  contents: write

concurrency:
  group: prompt04-ui-main
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm install
      - name: Apply canvas and keyboard integration
        run: |
          sed -i "s/'mouse internal path dispatch', count=1)/'mouse internal path dispatch', count=2)/" scripts/prompt04-ui.py
          python scripts/prompt04-ui.py
          python scripts/prompt04-context-fix.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit editor integration
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/editor/PatternCanvas.tsx apps/web/src/App.tsx apps/web/src/styles.css apps/web/src/components/ContextBar.tsx
          git rm scripts/prompt04-ui.py scripts/prompt04-context-fix.py .github/workflows/prompt04-ui.yml
          git commit -m "feat: edit and apply internal paths in the canvas"
          git push origin main
