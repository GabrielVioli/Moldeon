name: Recovery 11.0.8 placement-safe STEP-0 repair

on:
  workflow_dispatch:
  push:
    branches:
      - "recovery/11.0.8-sewing-2d-3d-authoring"
    paths:
      - "scripts/fix-11-0-8-step0-placement-safe.py"
      - ".github/workflows/recovery-11-0-8-step0-placement-safe.yml"

permissions:
  contents: write

concurrency:
  group: recovery-11-0-8-step0-placement-safe
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: "recovery/11.0.8-sewing-2d-3d-authoring"
          fetch-depth: 0

      - name: Verify triggering commit is branch head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Apply placement-safe local STEP-0 repair
        run: python3 scripts/fix-11-0-8-step0-placement-safe.py

      - name: Fix strict test fixture cast
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/viewport/SewingStep0Placement.test.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace("  } as GarmentAssemblyMeshData;", "  } as unknown as GarmentAssemblyMeshData;", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Make material metric authoritative during local seam pull
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/viewport/SewingStep0.ts")
          text = path.read_text(encoding="utf-8")
          start = text.find("  for (let iteration = 0; iteration < iterations; iteration += 1) {")
          end = text.find("\n\n  const afterResidual = measureResidualInWorld", start)
          if start < 0 or end < 0:
              raise SystemExit("local STEP-0 iteration range not found")
          block = '''  for (let iteration = 0; iteration < iterations; iteration += 1) {
            const reverse = iteration % 2 === 1;
            // Material metric is the hard geometric contract. Multiple alternating
            // sweeps make each seam pull behave as bending/rigid reorientation rather
            // than stretching a boundary toward its mate.
            for (let pass = 0; pass < 3; pass += 1) {
              projectStructuralMetric(world, structural, structuralTargets, (pass % 2 === 0) ? reverse : !reverse, 0.985);
            }
            projectSeamRelations(world, seams, reverse, seamRelaxation * 0.42);
            for (let pass = 0; pass < 5; pass += 1) {
              projectStructuralMetric(world, structural, structuralTargets, (pass % 2 === 0) ? !reverse : reverse, 0.992);
            }
            projectSeamRelations(world, seams, !reverse, seamRelaxation * 0.14);
            for (let pass = 0; pass < 3; pass += 1) {
              projectStructuralMetric(world, structural, structuralTargets, (pass % 2 === 0) ? reverse : !reverse, 0.995);
            }

            // Keep every panel in the neighbourhood explicitly chosen by the user.
            // A tiny spring removes accumulated numerical drift; the hard cage below
            // is the actual safety contract.
            for (const instanceId of target.instanceIds) {
              const instance = state.instances.find((candidate) => candidate.id === instanceId)!;
              const originalCentroid = initialCentroids.get(instanceId)!;
              const centroid = instanceParticleCentroid(world, instance.particleStart, instance.vertexCount);
              const drift = centroid.sub(originalCentroid);
              translateInstanceParticles(world, instance.particleStart, instance.vertexCount, drift.multiplyScalar(-0.012));
              cageInstanceCentroid(
                world,
                instance.particleStart,
                instance.vertexCount,
                originalCentroid,
                maximumCentroidDisplacementM,
              );
            }
            cageParticleDisplacements(world, initial, filled, maximumVertexDisplacementM);
          }

          // Final material polish is repeated inside the displacement cage so the
          // last safety clamp cannot leave the panel visibly stretched.
          for (let pass = 0; pass < 36; pass += 1) {
            projectStructuralMetric(world, structural, structuralTargets, pass % 2 === 1, 0.997);
            cageParticleDisplacements(world, initial, filled, maximumVertexDisplacementM);
          }
          for (const instanceId of target.instanceIds) {
            const instance = state.instances.find((candidate) => candidate.id === instanceId)!;
            cageInstanceCentroid(
              world,
              instance.particleStart,
              instance.vertexCount,
              initialCentroids.get(instanceId)!,
              maximumCentroidDisplacementM,
            );
          }'''
          text = text[:start] + block + text[end:]
          old_seam = 'const magnitude = Math.min(0.006, (current - target) * 0.5 * relaxation);'
          old_metric = 'const magnitude = Math.max(-0.0025, Math.min(0.0025, (current - target) * 0.5 * relaxation));'
          if old_seam not in text or old_metric not in text:
              raise SystemExit("STEP-0 projection constants not found")
          text = text.replace(old_seam, 'const magnitude = Math.min(0.0015, (current - target) * 0.5 * relaxation);', 1)
          text = text.replace(old_metric, 'const magnitude = Math.max(-0.008, Math.min(0.008, (current - target) * 0.5 * relaxation));', 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Diff check
        run: git diff --check

      - name: Guard architecture and authored placement authority
        shell: bash
        run: |
          if git diff --name-only | grep -q '^apps/web/src/physics/'; then
            echo 'physics/** must remain untouched' >&2
            exit 1
          fi
          if git diff -- apps/web/src/viewport/GlobalThreeViewport.ts | grep -E '^\+.*this\.assembly\.solve\('; then
            echo 'STEP-0 repair must not delegate placement to coarse worker solve' >&2
            exit 1
          fi
          if git diff -- apps/web/src/viewport/GlobalThreeViewport.ts | grep -E '^\+.*\.(dress|start|resume)\('; then
            echo 'STEP-0 must not start XPBD/dress' >&2
            exit 1
          fi
          grep -q 'solvePlacementAnchoredSewingStep0' apps/web/src/viewport/GlobalThreeViewport.ts
          grep -q 'maximumCentroidDisplacementM: 0.018' apps/web/src/viewport/GlobalThreeViewport.ts
          grep -q 'surfaceNormalDot' apps/web/src/viewport/GlobalThreeViewport.ts
          grep -q 'restoreSnapshots' apps/web/src/viewport/GlobalThreeViewport.ts
          grep -q 'simulation.pause()' apps/web/src/viewport/GlobalThreeViewport.ts
          grep -q 'Math.min(0.0015' apps/web/src/viewport/SewingStep0.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused STEP-0 and sewing tests
        run: npm run test --workspace @moldeon/web -- src/viewport/SewingStep0Placement.test.ts src/viewport/SewingStep0.test.ts src/viewport/SewingInteraction.test.ts src/viewport/SewingVisualPairing.test.ts src/viewport/ArrangementWorkspace.test.ts src/state/assemblyHistory.test.ts src/garment3d/AssemblyWorkerClient.test.ts --reporter=verbose

      - name: Production build
        run: npm run build

      - name: Commit validated repair and remove temporary helpers
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/viewport/SewingStep0.ts \
            apps/web/src/viewport/SewingStep0Placement.test.ts \
            apps/web/src/viewport/GlobalThreeViewport.ts \
            apps/web/src/viewport/GarmentViewport.tsx \
            docs/modifications-11.0.8.md
          git rm -f scripts/fix-11-0-8-step0-placement-safe.py .github/workflows/recovery-11-0-8-step0-placement-safe.yml
          git commit -m "fix(sewing): keep STEP-0 anchored to manual placement"
          git push origin HEAD:recovery/11.0.8-sewing-2d-3d-authoring
