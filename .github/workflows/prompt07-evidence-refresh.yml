name: Prompt 7 Evidence Refresh

on:
  push:
    paths:
      - scripts/prompt07-evidence-fix.py
      - scripts/prompt07-evidence-generate.ts
      - scripts/prompt07-evidence-audit.mjs
      - .github/workflows/prompt07-evidence-refresh.yml

permissions:
  contents: write

concurrency:
  group: prompt07-evidence-refresh-main
  cancel-in-progress: true

jobs:
  validate-refresh-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROMPT07_ARTIFACT_DIR: artifacts/prompt07-trousers
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply evidence correction
        run: python scripts/prompt07-evidence-fix.py
      - name: Install dependencies
        run: npm install
      - name: Check patch
        run: git diff --check
      - name: Typecheck
        run: npm run typecheck
      - name: Generate golden snapshots
        run: npm run test --workspace @moldeon/web -- --update
      - name: Run immutable full suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Generate corrected SVG evidence
        run: npx vite-node scripts/prompt07-evidence-generate.ts
      - name: Install browser controller
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Inspect and capture corrected evidence
        run: node scripts/prompt07-evidence-audit.mjs
      - name: Commit corrected evidence
        run: |
          mkdir -p docs/evidence/prompt07-trousers
          cp -f artifacts/prompt07-trousers/* docs/evidence/prompt07-trousers/
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/patterns/trouserVisualEvidence.ts apps/web/src/patterns/trouserVisualAudit.test.ts apps/web/src/patterns/__snapshots__ docs/evidence/prompt07-trousers
          git commit -m "test: distinguish all trouser assembly seams in evidence"
      - name: Remove refresh automation and push
        run: |
          git rm -f scripts/prompt07-evidence-fix.py scripts/prompt07-evidence-generate.ts scripts/prompt07-evidence-audit.mjs .github/workflows/prompt07-evidence-refresh.yml
          git commit -m "chore: remove prompt 7 evidence refresh automation"
          git push origin main
      - name: Upload refreshed artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt07-trousers-refreshed-${{ github.sha }}
          path: artifacts/prompt07-trousers
          retention-days: 21
          if-no-files-found: warn
