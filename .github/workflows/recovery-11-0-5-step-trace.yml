name: recovery-11-0-5 step trace

on:
  push:
    branches:
      - recovery/11.0.5-exact-human-surface-contact

permissions:
  contents: write

jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.5-exact-human-surface-contact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - run: npm ci
      - name: Instrument real garment gate in runner only
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/src/physics/exactBodyGarmentGate.test.ts')
          text = path.read_text(encoding='utf-8')
          old = '''      for (let step = 0; step < 8 && !state.invalid; step += 1) stepXpbd(state);\n      const diagnostics = measureXpbdDiagnostics(state);\n'''
          new = '''      for (let step = 0; step < 8 && !state.invalid; step += 1) {\n        stepXpbd(state);\n        const stepDiagnostics = measureXpbdDiagnostics(state);\n        console.log("P1105_STEP_TRACE", JSON.stringify({\n          template,\n          step: step + 1,\n          invalid: stepDiagnostics.invalid,\n          contacts: stepDiagnostics.bodyContactCount,\n          vertex: stepDiagnostics.bodyVertexContacts,\n          edge: stepDiagnostics.bodyEdgeContacts,\n          triangle: stepDiagnostics.bodyTriangleContacts,\n          contactSolveMs: stepDiagnostics.bodyContactSolveMs,\n          maxBodyCorrectionM: stepDiagnostics.maximumBodyCorrectionM,\n          residualIntersections: stepDiagnostics.bodyResidualIntersections,\n          residualCrossings: stepDiagnostics.bodyResidualCrossings,\n          stretchMax: stepDiagnostics.structuralStretchMaxRatio,\n          compressionMin: stepDiagnostics.structuralCompressionMinRatio,\n          areaMin: stepDiagnostics.triangleAreaMinRatio,\n          areaMax: stepDiagnostics.triangleAreaMaxRatio,\n          dressingRemaining: stepDiagnostics.bodyDressingStepsRemaining,\n          dressingInitial: stepDiagnostics.bodyInitialDressingSteps,\n          initialOverlapStatus: stepDiagnostics.initialOverlapRecoveryStatus,\n          initialDepenetrationPasses: state.body.initialDepenetrationPasses,\n          initialDepenetrationMaximumTranslationM: state.body.initialDepenetrationMaximumTranslationM,\n        }));\n      }\n      const diagnostics = measureXpbdDiagnostics(state);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one gate loop, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
      - name: Run straight-skirt diagnostic gate
        continue-on-error: true
        run: npm run test --workspace @moldeon/web -- exactBodyGarmentGate.test.ts
      - name: Remove temporary workflow
        if: always()
        run: |
          git restore -- apps/web/src/physics/exactBodyGarmentGate.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/recovery-11-0-5-step-trace.yml
          git commit -m "chore(11.0.5): clean step trace"
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
