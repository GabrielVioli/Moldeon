name: Prompt 04 Audit

on:
  push:
    paths:
      - scripts/prompt04-internal-path-audit.mjs
      - scripts/prompt04-interaction-fix.py
      - .github/workflows/prompt04-audit.yml

permissions:
  contents: write

concurrency:
  group: prompt04-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROMPT04_ARTIFACT_DIR: artifacts/prompt04-internal-paths
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm install
      - name: Apply interaction correction
        run: python scripts/prompt04-interaction-fix.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run editor audit
        run: |
          npm run dev:fallback --workspace @moldeon/web -- --host 127.0.0.1 --port 5184 --strictPort > /tmp/moldeon-prompt04.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 120); do
            curl --fail --silent http://127.0.0.1:5184/ >/dev/null && break
            sleep 0.5
          done
          PROMPT04_BASE_URL=http://127.0.0.1:5184 node scripts/prompt04-internal-path-audit.mjs
      - name: Publish evidence
        run: |
          mkdir -p docs/evidence/prompt04
          cp -f artifacts/prompt04-internal-paths/* docs/evidence/prompt04/
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/editor/PatternCanvas.tsx docs/evidence/prompt04
          git rm -f scripts/prompt04-internal-path-audit.mjs scripts/prompt04-interaction-fix.py .github/workflows/prompt04-audit.yml
          git commit -m "test: validate curved cuts and structural darts visually"
          git push origin main
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt04-audit-${{ github.sha }}
          path: artifacts/prompt04-internal-paths
          retention-days: 21
          if-no-files-found: warn
