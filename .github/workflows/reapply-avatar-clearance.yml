name: Reapply Avatar Clearance

on:
  push:
    paths:
      - .github/workflows/reapply-avatar-clearance.yml

permissions:
  contents: write

jobs:
  validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Apply validated regional clearance
        run: |
          python - <<'PY'
          from pathlib import Path
          model = Path('apps/web/src/avatar/AvatarParametricModel.ts')
          text = model.read_text(encoding='utf-8')
          replacements = {
            'horizontal, 0.014),\n    make("torso-back"': 'horizontal, 0.028),\n    make("torso-back"',
            '[-1, 0, 0], 0.014),\n    make("shoulder-left"': '[-1, 0, 0], 0.028),\n    make("shoulder-left"',
            'leftArmAxis, front, 0.012),\n    make("shoulder-right"': 'leftArmAxis, front, 0.02),\n    make("shoulder-right"',
            'rightArmAxis, front, 0.012),\n    make("arm-left"': 'rightArmAxis, front, 0.02),\n    make("arm-left"',
            'leftArmAxis, front, 0.012),\n    make("arm-right"': 'leftArmAxis, front, 0.022),\n    make("arm-right"',
            'rightArmAxis, front, 0.012),\n    make("waist-front"': 'rightArmAxis, front, 0.022),\n    make("waist-front"',
            'horizontal, 0.012),\n    make("waist-back"': 'horizontal, 0.024),\n    make("waist-back"',
            '[-1, 0, 0], 0.012),\n    make("hip-front"': '[-1, 0, 0], 0.024),\n    make("hip-front"',
            'horizontal, 0.014),\n    make("hip-back"': 'horizontal, 0.028),\n    make("hip-back"',
            '[-1, 0, 0], 0.014),\n    make("leg-left"': '[-1, 0, 0], 0.028),\n    make("leg-left"',
            'leftLegAxis, front, 0.012),\n    make("leg-right"': 'leftLegAxis, front, 0.026),\n    make("leg-right"',
            'rightLegAxis, front, 0.012),\n    make("neck"': 'rightLegAxis, front, 0.026),\n    make("neck"',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Anchor state not recognized: {old}')
          model.write_text(text, encoding='utf-8')

          test = Path('apps/web/src/avatar/AvatarParametricModel.test.ts')
          test_text = test.read_text(encoding='utf-8')
          needle = '    expect(collision.proxies.length).toBeGreaterThanOrEqual(12);\n'
          addition = '''    const garmentAnchors = model.anchors.filter((anchor) => ["torso", "arm", "waist", "hip", "leg"].includes(anchor.region));\n    expect(Math.min(...garmentAnchors.map((anchor) => anchor.initialMarginM))).toBeGreaterThanOrEqual(0.022);\n'''
          if addition not in test_text:
              if needle not in test_text:
                  raise SystemExit('Avatar clearance test insertion point not found')
              test.write_text(test_text.replace(needle, needle + addition, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/avatar/AvatarParametricModel.ts apps/web/src/avatar/AvatarParametricModel.test.ts
          git commit -m "fix: keep arranged garments clear of avatar surface"

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

      - name: Remove temporary workflows and publish
        run: |
          git rm -f \
            .github/workflows/avatar-clearance-final.yml \
            .github/workflows/reapply-avatar-clearance.yml
          git commit -m "chore: remove avatar clearance delivery workflows"
          git fetch origin main
          git rebase origin/main
          git push origin main
