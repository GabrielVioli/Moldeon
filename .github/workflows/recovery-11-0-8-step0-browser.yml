name: Recovery 11.0.8 STEP-0 Browser Gate

on:
  push:
    branches:
      - recovery/11.0.8-sewing-2d-3d-authoring
    paths:
      - "apps/web/src/viewport/SewingStep0.ts"
      - "apps/web/src/viewport/GlobalThreeViewport.ts"
      - "apps/web/src/viewport/GarmentViewport.tsx"
      - "apps/web/src/viewport/ArrangementWorkspace.ts"
      - "apps/web/src/editor/PatternCanvasLegacy.tsx"
      - "apps/web/src/garment3d/**"
      - "scripts/step0-browser-audit.mjs"
      - "scripts/step0-browser-scenarios.mjs"
      - "docs/step0-e2e-coverage.md"
      - ".github/workflows/recovery-11-0-8-step0-browser.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: STEP-0 browser suite
        required: true
        default: full
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install project
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace @moldeon/web
      - name: Focused STEP-0 tests
        run: npm run test --workspace @moldeon/web -- src/viewport/SewingStep0.test.ts src/viewport/SewingStep0Placement.test.ts src/viewport/AssemblyModeTransition.test.ts
      - name: Install Chromium gate tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start fallback server
        run: |
          npm run dev:fallback --workspace @moldeon/web -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/moldeon-step0-server.log 2>&1 &
          echo $! > /tmp/moldeon-step0-server.pid
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/moldeon-step0-server.log
          exit 1
      - name: Run real browser STEP-0 audit
        env:
          STEP0_BASE_URL: http://127.0.0.1:5173
          STEP0_ARTIFACT_DIR: artifacts/step0-browser
          STEP0_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'quick' }}
        run: node scripts/step0-browser-audit.mjs
      - name: Production build
        run: npm run build --workspace @moldeon/web
      - name: Upload STEP-0 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step0-browser-${{ github.sha }}
          path: |
            artifacts/step0-browser
            /tmp/moldeon-step0-server.log
          retention-days: 14
          if-no-files-found: warn
