name: Recovery 11.0.8 STEP-0 Rigid Solved Shape Gate

on:
  push:
    branches:
      - automation/step0-body-wrap-candidate
    paths:
      - "apps/web/src/viewport/SewingStep0.ts"
      - "apps/web/src/viewport/GlobalThreeViewport.ts"
      - "apps/web/src/viewport/GarmentViewport.tsx"
      - "apps/web/src/garment3d/**"
      - "scripts/step0-browser-audit.mjs"
      - "scripts/apply-step0-rigid-solved-shape-registration.py"
      - ".github/workflows/recovery-11-0-8-step0-browser.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install project
        run: npm ci
      - name: Apply rigid solved-shape registration candidate
        run: |
          python scripts/apply-step0-rigid-solved-shape-registration.py
          mkdir -p artifacts/step0-browser
          git diff > artifacts/step0-browser/source.patch
          git diff --check
          git status --short
      - name: Typecheck
        run: npm run typecheck --workspace @moldeon/web
      - name: Focused STEP-0 tests
        run: npm run test --workspace @moldeon/web -- src/viewport/SewingStep0.test.ts src/viewport/SewingStep0Placement.test.ts src/viewport/AssemblyModeTransition.test.ts
      - name: Install Chromium gate tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start fallback server
        run: |
          npm run dev:fallback --workspace @moldeon/web -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/moldeon-step0-server.log 2>&1 &
          echo $! > /tmp/moldeon-step0-server.pid
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/moldeon-step0-server.log
          exit 1
      - name: Run real browser STEP-0 audit
        env:
          STEP0_BASE_URL: http://127.0.0.1:5173
          STEP0_ARTIFACT_DIR: artifacts/step0-browser
        run: node scripts/step0-browser-audit.mjs
      - name: Production build
        run: npm run build --workspace @moldeon/web
      - name: Publish validated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/viewport/SewingStep0.ts
          git commit -m "fix(step0): register proven sewn shape on authored body placement"
          git push --force origin HEAD:refs/heads/automation/step0-body-wrap-validated
      - name: Upload STEP-0 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step0-rigid-registration-${{ github.sha }}
          path: |
            artifacts/step0-browser
            /tmp/moldeon-step0-server.log
          retention-days: 14
          if-no-files-found: warn
