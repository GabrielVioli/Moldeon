name: Recovery 11.0.7 Gate

on:
  push:
    branches:
      - recovery/11.0.7-canonical-3d-arrangement-workspace
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-11-0-7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Focused tests, typecheck and browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused 11.0.7 tests
        working-directory: apps/web
        run: >-
          npm test -- --run
          src/avatar/BodySurfaceQuery.test.ts
          src/viewport/ArrangementWorkspace.test.ts
          src/garment3d/ResolvedAssemblyInput.test.ts
          src/state/assemblyHistory.test.ts
          src/domain/patternDocumentV3.test.ts
          src/avatar/HumanBodyModel.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Start fallback dev server
        working-directory: apps/web
        shell: bash
        run: |
          npm run dev:fallback -- --host 127.0.0.1 > /tmp/moldeon-vite.log 2>&1 &
          echo $! > /tmp/moldeon-vite.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/moldeon-vite.log
          exit 1

      - name: Browser interaction gate
        env:
          MOLDEON_URL: http://127.0.0.1:5173
        run: |
          export MOLDEON_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          node scripts/verify-11-0-7.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-11-0-7-browser-evidence
          if-no-files-found: ignore
          path: |
            docs/progress/RECOVERY_11_0_7_DESKTOP.png
            docs/progress/RECOVERY_11_0_7_DESKTOP_ADJUSTED.png
            docs/progress/RECOVERY_11_0_7_MOBILE.png
            docs/progress/RECOVERY_11_0_7_BROWSER_FAILURE.png
