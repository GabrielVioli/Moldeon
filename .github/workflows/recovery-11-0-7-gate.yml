name: Recovery 11.0.7 Gate

on:
  push:
    branches:
      - recovery/11.0.7-canonical-3d-arrangement-workspace
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-11-0-7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Focused tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused 11.0.7 tests
        working-directory: apps/web
        run: >-
          npm test -- --run
          src/avatar/BodySurfaceQuery.test.ts
          src/viewport/ArrangementWorkspace.test.ts
          src/garment3d/ResolvedAssemblyInput.test.ts
          src/state/assemblyHistory.test.ts
          src/domain/patternDocumentV3.test.ts
          src/avatar/HumanBodyModel.test.ts

      - name: Typecheck
        run: npm run typecheck
