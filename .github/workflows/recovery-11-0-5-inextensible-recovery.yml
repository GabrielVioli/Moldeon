name: recovery-11-0-5 inextensible recovery

on:
  push:
    branches:
      - recovery/11.0.5-exact-human-surface-contact

permissions:
  contents: write

jobs:
  focused-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.5-exact-human-surface-contact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - run: npm ci

      - name: Build seam-safe inextensible recovery candidate
        shell: python
        run: |
          from pathlib import Path

          body_path = Path('apps/web/src/physics/bodyCollision.ts')
          body = body_path.read_text(encoding='utf-8')
          old = '''  clothTriangles?: Uint32Array,\n  inverseMasses?: Float32Array,\n): void {'''
          new = '''  clothTriangles?: Uint32Array,\n  inverseMasses?: Float32Array,\n  clothSeamIndices?: Uint32Array,\n): void {'''
          assert body.count(old) == 1
          body = body.replace(old, new)
          old = '''        clothTriangles,\n        inverseMasses,\n      );'''
          new = '''        clothTriangles,\n        inverseMasses,\n        clothSeamIndices,\n      );'''
          assert body.count(old) == 1
          body = body.replace(old, new)
          old = '''      if (!recovered) {\n        body.structuralContactDeferred = true;\n        return;\n      }'''
          new = '''      if (!recovered) {\n        // The rigid attempt restored STEP-0 on failure. A sewn component may\n        // need isometric bending rather than one common translation, so enter\n        // the bounded inextensible XPBD recovery with every seam still intact.\n        if (clothSeamIndices && clothSeamIndices.length > 0) {\n          body.initialOverlapUnresolved = false;\n        } else {\n          body.structuralContactDeferred = true;\n          return;\n        }\n      }'''
          assert body.count(old) == 1
          body = body.replace(old, new)
          old = '''  clothTriangles: Uint32Array | undefined,\n  inverseMasses: Float32Array | undefined,\n): boolean {\n  const components = buildClothConnectedComponents(positions.length / 3, clothTriangles);'''
          new = '''  clothTriangles: Uint32Array | undefined,\n  inverseMasses: Float32Array | undefined,\n  clothSeamIndices: Uint32Array | undefined,\n): boolean {\n  const components = buildClothConnectedComponents(positions.length / 3, clothTriangles, clothSeamIndices);'''
          assert body.count(old) == 1
          body = body.replace(old, new)
          old = 'function buildClothConnectedComponents(particleCount: number, triangles: Uint32Array | undefined): number[][] {'
          new = '''function buildClothConnectedComponents(\n  particleCount: number,\n  triangles: Uint32Array | undefined,\n  seamIndices: Uint32Array | undefined,\n): number[][] {'''
          assert body.count(old) == 1
          body = body.replace(old, new)
          old = '''  if (triangles) {\n    for (let offset = 0; offset < triangles.length; offset += 3) {\n      const a = triangles[offset];\n      const b = triangles[offset + 1];\n      const c = triangles[offset + 2];\n      if (a >= particleCount || b >= particleCount || c >= particleCount) continue;\n      union(a, b);\n      union(b, c);\n    }\n  }\n  const byRoot = new Map<number, number[]>();'''
          new = '''  if (triangles) {\n    for (let offset = 0; offset < triangles.length; offset += 3) {\n      const a = triangles[offset];\n      const b = triangles[offset + 1];\n      const c = triangles[offset + 2];\n      if (a >= particleCount || b >= particleCount || c >= particleCount) continue;\n      union(a, b);\n      union(b, c);\n    }\n  }\n  if (seamIndices) {\n    for (let offset = 0; offset < seamIndices.length; offset += 4) {\n      let firstParticle = -1;\n      for (let slot = 0; slot < 4 && offset + slot < seamIndices.length; slot += 1) {\n        const particle = seamIndices[offset + slot];\n        if (particle >= particleCount) continue;\n        if (firstParticle < 0) firstParticle = particle;\n        else union(firstParticle, particle);\n      }\n    }\n  }\n  const byRoot = new Map<number, number[]>();'''
          assert body.count(old) == 1
          body = body.replace(old, new)
          body_path.write_text(body, encoding='utf-8', newline='\n')

          xpbd_path = Path('apps/web/src/physics/xpbd.ts')
          xpbd = xpbd_path.read_text(encoding='utf-8')
          create_call = 'initializeBodyDressing(body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses);'
          reset_call = 'initializeBodyDressing(state.body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses);'
          assert xpbd.count(create_call) == 1 and xpbd.count(reset_call) == 1
          xpbd = xpbd.replace(create_call, 'initializeBodyDressing(body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses, state.seams.indices);')
          xpbd = xpbd.replace(reset_call, 'initializeBodyDressing(state.body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses, state.seams.indices);')

          old = '''  const effectiveIterations = dressingActive\n    ? Math.max(state.config.iterations, state.config.iterations * 2)\n    : state.config.iterations;'''
          new = '''  const effectiveIterations = dressingActive\n    ? Math.max(state.config.iterations, state.config.iterations * 4)\n    : state.config.iterations;'''
          assert xpbd.count(old) == 1
          xpbd = xpbd.replace(old, new)

          xpbd = xpbd.replace('solveSeamSet(state, dt); profile.seamMs', 'solveSeamSet(state, dt, dressingActive); profile.seamMs')
          xpbd = xpbd.replace('solveDistanceSet(state, dt, 0); profile.stretchMs', 'solveDistanceSet(state, dt, 0, dressingActive); profile.stretchMs')
          xpbd = xpbd.replace('solveShearSet(state, dt); profile.shearMs', 'solveShearSet(state, dt, dressingActive); profile.shearMs')
          old = '''    if (state.body.exactSurface && (\n      iteration === 0\n      || iteration === Math.floor(effectiveIterations / 2)\n      || iteration === effectiveIterations - 1\n    )) {'''
          new = '''    if (state.body.exactSurface && (dressingActive || (\n      iteration === 0\n      || iteration === Math.floor(effectiveIterations / 2)\n      || iteration === effectiveIterations - 1\n    ))) {'''
          assert xpbd.count(old) == 1
          xpbd = xpbd.replace(old, new)

          old = 'function solveDistanceSet(state: XpbdState, dt: number, kind: 0 | 1): void {'
          new = 'function solveDistanceSet(state: XpbdState, dt: number, kind: 0 | 1, hard = false): void {'
          assert xpbd.count(old) == 1
          xpbd = xpbd.replace(old, new)
          old = 'const len=Math.sqrt(ls),wa=inv[a],wb=inv[b],c=set.compliances[i],alpha=(c>0?c:0)*alphaScale,den=wa+wb+alpha;'
          new = 'const len=Math.sqrt(ls),wa=inv[a],wb=inv[b],c=hard?0:set.compliances[i],alpha=(c>0?c:0)*alphaScale,den=wa+wb+alpha;'
          assert xpbd.count(old) == 1
          xpbd = xpbd.replace(old, new)

          old = 'function solveShearSet(state: XpbdState, dt: number): void {'
          new = 'function solveShearSet(state: XpbdState, dt: number, hard = false): void {'
          assert xpbd.count(old) == 1
          xpbd = xpbd.replace(old, new)
          old = 'w0=inv[p0],w1=inv[p1],w2=inv[p2],c=set.compliances[i],alpha=(c>0?c:0)*alphaScale,den=w0*q0+w1*q1+w2*q2+alpha;'
          new = 'w0=inv[p0],w1=inv[p1],w2=inv[p2],c=hard?0:set.compliances[i],alpha=(c>0?c:0)*alphaScale,den=w0*q0+w1*q1+w2*q2+alpha;'
          assert xpbd.count(old) == 1
          xpbd = xpbd.replace(old, new)

          old = 'function solveSeamSet(state: XpbdState, dt: number): void {'
          new = 'function solveSeamSet(state: XpbdState, dt: number, hard = false): void {'
          assert xpbd.count(old) == 1
          xpbd = xpbd.replace(old, new)
          old = 'const cp=seams.compliances[i],alpha=(cp>0?cp:0)*alphaScale,den=mass+alpha;'
          new = 'const cp=hard?0:seams.compliances[i],alpha=(cp>0?cp:0)*alphaScale,den=mass+alpha;'
          assert xpbd.count(old) == 1
          xpbd = xpbd.replace(old, new)
          xpbd_path.write_text(xpbd, encoding='utf-8', newline='\n')

          test_path = Path('apps/web/src/physics/bodyCollisionExact.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '  it("does not propagate a deep STEP-0 overlap into a connected six-ring collision hole", () => {'
          regression = '''  it("preserves sewn-panel metric during the rigid STEP-0 attempt", () => {\n    const body = runtime(6, 0, 0.00005);\n    const positions = Float32Array.from([\n      0, 0.98, -0.1, 0.1, 0.98, -0.1, 0, 0.98, 0.1,\n      0, 1.05, -0.1, 0.1, 1.05, -0.1, 0, 1.05, 0.1,\n    ]);\n    const triangles = Uint32Array.from([0, 2, 1, 3, 4, 5]);\n    const seams = Uint32Array.from([0, 1, 3, 4]);\n    const inverseMasses = new Float32Array(6).fill(1);\n    const before = Math.hypot(positions[9] - positions[0], positions[10] - positions[1], positions[11] - positions[2]);\n    initializeBodyDressing(body, positions, 0.035, triangles, inverseMasses, seams);\n    const after = Math.hypot(positions[9] - positions[0], positions[10] - positions[1], positions[11] - positions[2]);\n    expect(body.initialOverlapUnresolved).toBe(false);\n    expect(Math.abs(after - before)).toBeLessThan(2e-6);\n    expect([...body.initialOverlapGuardMask].every((value) => value === 0)).toBe(true);\n  });\n\n'''
          assert test.count(marker) == 1
          test = test.replace(marker, regression + marker)
          test_path.write_text(test, encoding='utf-8', newline='\n')

      - name: Diff check
        run: |
          git diff --check
          git diff --stat

      - name: Focused tests
        id: focused
        continue-on-error: true
        run: npm run test --workspace @moldeon/web -- bodyCollisionExact.test.ts XpbdWorkerState.test.ts exactBodyGarmentGate.test.ts

      - name: Typecheck passing candidate
        id: typecheck
        if: steps.focused.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Publish passing fix or clean up failed experiment
        if: always()
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$FOCUSED_OUTCOME" = "success" ] && [ "$TYPECHECK_OUTCOME" = "success" ]; then
            git add -- apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/physics/bodyCollisionExact.test.ts
            git rm -- .github/workflows/recovery-11-0-5-inextensible-recovery.yml
            git commit -m "fix(11.0.5): recover sewn overlap without material stretch"
          else
            git restore -- apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/physics/bodyCollisionExact.test.ts
            git rm -- .github/workflows/recovery-11-0-5-inextensible-recovery.yml
            git commit -m "chore(11.0.5): clean failed inextensible experiment"
          fi
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
          if [ "$FOCUSED_OUTCOME" != "success" ] || [ "$TYPECHECK_OUTCOME" != "success" ]; then exit 1; fi
