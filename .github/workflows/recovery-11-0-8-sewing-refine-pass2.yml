name: Recovery 11.0.8 sewing refinement pass 2

on:
  workflow_dispatch:
  push:
    branches:
      - "recovery/11.0.8-sewing-2d-3d-authoring"
    paths:
      - "scripts/refine-11-0-8-sewing-pass2.py"
      - ".github/workflows/recovery-11-0-8-sewing-refine-pass2.yml"

permissions:
  contents: write

concurrency:
  group: recovery-11-0-8-sewing-refine-pass2
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: "recovery/11.0.8-sewing-2d-3d-authoring"
          fetch-depth: 0

      - name: Verify triggering commit is branch head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Apply refinement pass 2
        run: python3 scripts/refine-11-0-8-sewing-pass2.py

      - name: Make overlay assertion capacity-aware
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/state/assemblyHistory.test.ts")
          text = path.read_text(encoding="utf-8")
          old = '''    expect(overlay.threadLines.geometry.getAttribute("position").count)
              .toBe(overlay.visualThreadCount * 2);'''
          new = '''    expect(overlay.threadLines.geometry.drawRange.count)
              .toBe(overlay.visualThreadCount * 2);'''
          if old not in text:
              raise SystemExit("thread draw-count assertion not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Diff check
        run: git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused 11.0.8 tests
        run: npm run test --workspace @moldeon/web -- src/garment3d/ResolvedAssemblyInput.test.ts src/domain/sewingArcLengthAuthoring.test.ts src/state/assemblyHistory.test.ts src/viewport/SewingInteraction.test.ts src/viewport/ArrangementWorkspace.test.ts --reporter=verbose

      - name: Production build
        run: npm run build

      - name: Commit validated refinement pass 2
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/state/editorStore.ts \
            apps/web/src/components/AssemblyPanel.tsx \
            apps/web/src/viewport/SewingViewportOverlay.ts \
            apps/web/src/state/assemblyHistory.test.ts \
            docs/modifications-11.0.8.md
          git commit -m "perf(sewing): stabilize editing and overlay resources"
          git push origin HEAD:recovery/11.0.8-sewing-2d-3d-authoring
