name: Continue 11.0.7 Blockers

on:
  push:
    branches:
      - automation/11-0-7-blockers-runner

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact 11.0.7 target
        uses: actions/checkout@v4
        with:
          ref: recovery/11.0.7-canonical-3d-arrangement-workspace
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Verify base HEAD
        shell: bash
        run: test "$(git rev-parse HEAD)" = "1fc8f09301c712d8ea37f20afe94e491686f48f3"

      - name: Apply scoped blocker patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              file.write_text(next_text)

          history = "apps/web/src/state/documentCommandHistory.ts"
          sub_once(
              history,
              r'  undo\(\): EditorDocumentState \| null \{',
              '''  recordImmutable(
    type: DocumentCommandType,
    label: string,
    before: EditorDocumentState,
    after: EditorDocumentState,
  ): boolean {
    if (this.transaction
      || (before.garment === after.garment && before.activePieceId === after.activePieceId)) return false;
    const command = createImmutableCommand(type, label, before, after);
    this.past.push(command);
    if (this.past.length > this.limit) this.past.shift();
    this.future.length = 0;
    return true;
  }

  undo(): EditorDocumentState | null {''',
          )
          sub_once(
              history,
              r'function cloneState\(state: EditorDocumentState\): EditorDocumentState \{',
              '''function createImmutableCommand(
  type: DocumentCommandType,
  label: string,
  before: EditorDocumentState,
  after: EditorDocumentState,
): DocumentCommand {
  return {
    type,
    label,
    before,
    after,
    undo: () => before,
    redo: () => after,
  };
}

function cloneState(state: EditorDocumentState): EditorDocumentState {''',
          )

          store = "apps/web/src/state/editorStore.ts"
          sub_once(
              store,
              r'  setPanelInstanceArrangements: \(updates\) => \{.*?\n  \},\n  confirmPanelInstanceArrangement:',
              '''  setPanelInstanceArrangements: (updates) => {
    if (updates.length === 0) return;
    const state = get();
    const validPieceIds = new Set(state.garment.pieces.map((piece) => piece.id));
    const byPiece = new Map<string, Map<string, PatternPreviewPlacement>>();
    for (const update of updates) {
      if (!validPieceIds.has(update.pieceId)) continue;
      const instanceId = createPanelInstanceId(update.pieceId, update.copyIndex);
      const placements = byPiece.get(update.pieceId) ?? new Map<string, PatternPreviewPlacement>();
      placements.set(instanceId, {
        ...structuredClone(update.placement),
        id: instanceId,
        pieceId: update.pieceId,
        scale: 1,
        presentationMode: "authored",
      });
      byPiece.set(update.pieceId, placements);
    }
    if (byPiece.size === 0) return;

    const pieces = state.garment.pieces.map((piece) => {
      const updatesForPiece = byPiece.get(piece.id);
      if (!updatesForPiece) return piece;
      const placements = (piece.previewPlacements ?? [])
        .filter((candidate) => !updatesForPiece.has(candidate.id));
      placements.push(...updatesForPiece.values());
      placements.sort((left, right) => left.id.localeCompare(right.id));
      return { ...piece, previewPlacements: placements };
    });
    const garment = { ...state.garment, pieces };
    history.recordImmutable(
      "placement",
      "Posicionar instância(s) no 3D",
      { garment: state.garment, activePieceId: state.activePieceId },
      { garment, activePieceId: state.activePieceId },
    );
    const previousActivePiece = state.garment.pieces.find((piece) => piece.id === state.activePieceId);
    const nextActivePiece = pieces.find((piece) => piece.id === state.activePieceId);
    set({
      garment,
      ...(previousActivePiece && nextActivePiece && previousActivePiece !== nextActivePiece
        ? { snapshot: { ...state.snapshot, piece: { ...state.snapshot.piece, previewPlacements: nextActivePiece.previewPlacements } } }
        : {}),
      ...historyAvailability(),
    });
  },
  confirmPanelInstanceArrangement:''',
          )

          viewport = "apps/web/src/viewport/GlobalThreeViewport.ts"
          sub_once(
              viewport,
              r'  updateWorkspaceArrangement\(input: ResolvedAssemblyInput\): void \{\n    this\.currentInput = input;\n    if \(this\.viewportMode !== "assembly"\) return;',
              '''  updateWorkspaceArrangement(
    input: ResolvedAssemblyInput,
    options: { transformOnly?: boolean } = {},
  ): void {
    this.currentInput = input;
    if (this.viewportMode !== "assembly") return;
    if (options.transformOnly) {
      this.host.dataset.arrangementRevision = input.arrangementRevision;
      this.host.dataset.arrangementXpbdInitializations = "0";
      this.host.dataset.arrangementCommitPath = "transform-only";
      this.requestRender();
      return;
    }
    delete this.host.dataset.arrangementCommitPath;''',
          )

          component = "apps/web/src/viewport/GarmentViewport.tsx"
          sub_once(
              component,
              r'  const arrangementCommitRef = useRef\(onArrangementCommit\);',
              '''  const arrangementCommitRef = useRef(onArrangementCommit);
  const pendingArrangementCommitsRef = useRef<ArrangementCommit[] | null>(null);''',
          )
          sub_once(
              component,
              r'        viewport\.setArrangementInteractionHandlers\(\n          \(commits\) => arrangementCommitRef\.current\?\.\(commits\),',
              '''        viewport.setArrangementInteractionHandlers(
          (commits) => {
            const handler = arrangementCommitRef.current;
            if (!handler || commits.length === 0) return;
            pendingArrangementCommitsRef.current = commits;
            handler(commits);
          },''',
          )
          sub_once(
              component,
              r'  useEffect\(\(\) => \{\n    if \(!active \|\| displayMode !== "side-preview"\) return;\n    viewportRef\.current\?\.updateWorkspaceArrangement\(assemblyInput\);\n  \}, \[active, assemblyInput\.arrangementRevision, displayMode\]\);',
              '''  useEffect(() => {
    if (!active || displayMode !== "side-preview") return;
    const viewport = viewportRef.current;
    if (!viewport) return;
    const pending = pendingArrangementCommitsRef.current;
    pendingArrangementCommitsRef.current = null;
    viewport.updateWorkspaceArrangement(assemblyInput, {
      transformOnly: Boolean(pending && arrangementCommitsMatchInput(assemblyInput, pending)),
    });
  }, [active, assemblyInput.arrangementRevision, displayMode]);''',
          )
          sub_once(
              component,
              r'  useEffect\(\(\) => \{\n    if \(!active\) return;\n    const frame = window\.requestAnimationFrame\(\(\) => viewportRef\.current\?\.refresh\(\)\);\n    return \(\) => window\.cancelAnimationFrame\(frame\);\n  \}, \[active, displayMode\]\);',
              '''  useEffect(() => {
    if (!active) return;
    const frame = window.requestAnimationFrame(() => viewportRef.current?.refresh());
    return () => window.cancelAnimationFrame(frame);
  }, [active, displayMode]);

  useEffect(() => {
    const host = hostRef.current;
    const workspace = host?.closest(".workspace") as HTMLElement | null;
    if (!host || !workspace || !active) return;
    let frame: number | null = null;
    const syncWorkspaceLayout = () => {
      if (frame !== null) window.cancelAnimationFrame(frame);
      frame = window.requestAnimationFrame(() => {
        frame = null;
        const primary3D = workspace.classList.contains("mode-assembly")
          || workspace.classList.contains("mode-fitting");
        host.dataset.viewportWorkspaceRole = primary3D ? "primary-3d" : "side-preview";
        viewportRef.current?.refresh();
      });
    };
    syncWorkspaceLayout();
    const observer = new MutationObserver(syncWorkspaceLayout);
    observer.observe(workspace, { attributes: true, attributeFilter: ["class"] });
    return () => {
      observer.disconnect();
      if (frame !== null) window.cancelAnimationFrame(frame);
    };
  }, [active]);''',
          )
          sub_once(
              component,
              r'function formatMetric\(value: number \| undefined\): string \{',
              '''function arrangementCommitsMatchInput(
  input: ResolvedAssemblyInput,
  commits: readonly ArrangementCommit[],
): boolean {
  const instances = new Map(input.panelInstances.map((instance) => [instance.id, instance] as const));
  return commits.every((commit) => {
    const anchor = instances.get(commit.instanceId)?.arrangementAnchor;
    return tupleClose(anchor?.positionMm, commit.positionMm)
      && tupleClose(anchor?.orientationDeg, commit.orientationDeg);
  });
}

function tupleClose(
  left: readonly number[] | undefined,
  right: readonly number[],
  epsilon = 1e-4,
): boolean {
  return Boolean(left
    && left.length === right.length
    && left.every((value, index) => Math.abs(value - right[index]) <= epsilon));
}

function formatMetric(value: number | undefined): string {''',
          )

          allowed = {
              "apps/web/src/state/documentCommandHistory.ts",
              "apps/web/src/state/editorStore.ts",
              "apps/web/src/viewport/GlobalThreeViewport.ts",
              "apps/web/src/viewport/GarmentViewport.tsx",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f"unexpected changed files: {sorted(changed)}")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Focused 11.0.7 tests
        working-directory: apps/web
        run: >-
          npm test -- --run
          src/avatar/BodySurfaceQuery.test.ts
          src/viewport/ArrangementWorkspace.test.ts
          src/garment3d/ResolvedAssemblyInput.test.ts
          src/state/assemblyHistory.test.ts
          src/domain/patternDocumentV3.test.ts
          src/avatar/HumanBodyModel.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare Chromium smoke harness
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core

      - name: Start fallback dev server
        working-directory: apps/web
        shell: bash
        run: |
          npm run dev:fallback -- --host 127.0.0.1 > /tmp/moldeon-11-0-7.log 2>&1 &
          echo $! > /tmp/moldeon-11-0-7.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/moldeon-11-0-7.log
          exit 1

      - name: Chromium blocker smoke
        shell: bash
        run: |
          cat > scripts/.verify-11-0-7-blockers.mjs <<'JS'
          import { chromium } from "playwright-core";

          const executablePath = process.env.MOLDEON_CHROME;
          if (!executablePath) throw new Error("CHROME_NOT_FOUND");
          const browser = await chromium.launch({ executablePath, headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 960 } });
          const page = await context.newPage();
          const errors = [];
          page.on("pageerror", (error) => errors.push(error.stack ?? error.message));
          page.on("console", (message) => { if (message.type() === "error") errors.push(message.text()); });
          page.on("dialog", (dialog) => dialog.accept());
          await page.goto("http://127.0.0.1:5173", { waitUntil: "networkidle" });
          await page.evaluate(() => { localStorage.clear(); sessionStorage.clear(); });
          await page.reload({ waitUntil: "networkidle" });
          await page.evaluate(async () => {
            const [{ useEditorStore }, { createBlankGarment }, { createDefaultFabricSource }] = await Promise.all([
              import("/src/state/editorStore.ts"),
              import("/src/domain/blankGarment.ts"),
              import("/src/domain/fabric.ts"),
            ]);
            const blank = createBlankGarment();
            const fabric = createDefaultFabricSource();
            useEditorStore.getState().loadGarment({
              ...blank,
              name: "11.0.7 blocker smoke",
              fabrics: [fabric],
              pieces: [{
                id: "smoke-panel",
                name: "Smoke panel",
                seamAllowanceMm: 0,
                cutQuantity: 1,
                cutOnFold: false,
                fabricId: fabric.id,
                points: [
                  { id: "a", xMm: 0, yMm: 0 },
                  { id: "b", xMm: 220, yMm: 0 },
                  { id: "c", xMm: 220, yMm: 320 },
                  { id: "d", xMm: 0, yMm: 320 },
                ],
              }],
            });
          });
          await page.waitForTimeout(100);
          await page.getByRole("button", { name: "Montar", exact: true }).click();
          const viewport = page.locator('[data-testid="dressed-avatar-viewport"]');
          await viewport.waitFor({ state: "visible", timeout: 10_000 });
          await page.waitForFunction(() => document.querySelector('[data-testid="dressed-avatar-viewport"]')?.dataset.assemblyStatus === "ready", undefined, { timeout: 30_000 });

          async function layout(label) {
            const metrics = await page.evaluate(() => {
              const host = document.querySelector('[data-testid="dressed-avatar-viewport"]');
              const workspace = document.querySelector(".workspace");
              const canvas = host?.querySelector("canvas.three-canvas");
              if (!host || !workspace || !canvas) return null;
              const h = host.getBoundingClientRect();
              const w = workspace.getBoundingClientRect();
              const c = canvas.getBoundingClientRect();
              return {
                host: [h.width, h.height],
                workspace: [w.width, w.height],
                canvas: [c.width, c.height],
                role: host.dataset.viewportWorkspaceRole,
                horizontalOverflow: document.documentElement.scrollWidth - window.innerWidth,
              };
            });
            if (!metrics) throw new Error(`${label}_LAYOUT_MISSING`);
            if (metrics.role !== "primary-3d") throw new Error(`${label}_NOT_PRIMARY ${JSON.stringify(metrics)}`);
            if (metrics.host[0] < metrics.workspace[0] * 0.9 || metrics.host[1] < metrics.workspace[1] * 0.9) throw new Error(`${label}_VIEWPORT_SMALL ${JSON.stringify(metrics)}`);
            if (metrics.canvas[0] < metrics.host[0] * 0.98 || metrics.canvas[1] < metrics.host[1] * 0.98) throw new Error(`${label}_CANVAS_SMALL ${JSON.stringify(metrics)}`);
            if (metrics.horizontalOverflow > 2) throw new Error(`${label}_HORIZONTAL_OVERFLOW ${JSON.stringify(metrics)}`);
            return metrics;
          }

          const desktop = await layout("DESKTOP");
          const before = await viewport.evaluate((host) => ({
            solves: Number(host.dataset.arrangementAssemblySolves ?? 0),
            commits: Number(host.dataset.arrangementGestureCommits ?? 0),
            revision: host.dataset.arrangementRevision ?? "",
          }));
          const panelPoint = await page.evaluate(() => window.__MOLDEON_VIEWPORT_DEV__?.instanceScreenPosition("smoke-panel:panel:1") ?? null);
          if (!panelPoint) throw new Error("PANEL_POINT_MISSING");
          await page.mouse.move(panelPoint[0], panelPoint[1]);
          await page.mouse.down();
          await page.mouse.move(panelPoint[0] + 70, panelPoint[1] + 35, { steps: 10 });
          const releasedAt = Date.now();
          await page.mouse.up();
          await page.waitForFunction((previous) => {
            const host = document.querySelector('[data-testid="dressed-avatar-viewport"]');
            return Number(host?.dataset.arrangementGestureCommits ?? 0) === previous + 1
              && host?.dataset.arrangementCommitPath === "transform-only";
          }, before.commits, { timeout: 3_000 });
          const releaseLatencyMs = Date.now() - releasedAt;
          if (releaseLatencyMs > 1500) throw new Error(`POST_DRAG_FREEZE ${releaseLatencyMs}ms`);
          await page.evaluate(() => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve))));
          const after = await viewport.evaluate((host) => ({
            solves: Number(host.dataset.arrangementAssemblySolves ?? 0),
            commits: Number(host.dataset.arrangementGestureCommits ?? 0),
            xpbd: Number(host.dataset.arrangementXpbdInitializations ?? 0),
            path: host.dataset.arrangementCommitPath,
            revision: host.dataset.arrangementRevision ?? "",
          }));
          if (after.solves !== before.solves) throw new Error(`ASSEMBLY_SOLVE_ON_DROP ${before.solves}->${after.solves}`);
          if (after.xpbd !== 0) throw new Error(`XPBD_ON_DROP ${after.xpbd}`);
          if (after.commits !== before.commits + 1) throw new Error(`COMMIT_COUNT ${before.commits}->${after.commits}`);
          if (!after.revision || after.revision === before.revision) throw new Error(`ARRANGEMENT_REVISION_NOT_COMMITTED ${JSON.stringify({ before, after })}`);
          await page.getByRole("button", { name: "Girar", exact: true }).click();
          await page.getByRole("button", { name: "Mover", exact: true }).click();

          await page.setViewportSize({ width: 390, height: 844 });
          await page.waitForTimeout(300);
          const mobile = await layout("MOBILE");
          const targetSizes = await viewport.locator(".viewport-arrangement-actions button").evaluateAll((buttons) => buttons.map((button) => {
            const rect = button.getBoundingClientRect();
            return [rect.width, rect.height];
          }));
          if (targetSizes.some(([width, height]) => width < 44 || height < 44)) throw new Error(`MOBILE_TARGET_TOO_SMALL ${JSON.stringify(targetSizes)}`);
          if (errors.length) throw new Error(`BROWSER_ERRORS ${JSON.stringify(errors)}`);
          console.log(JSON.stringify({ desktop, mobile, before, after, releaseLatencyMs, targetSizes }, null, 2));
          await browser.close();
          JS
          export MOLDEON_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          node scripts/.verify-11-0-7-blockers.mjs
          rm -f scripts/.verify-11-0-7-blockers.mjs

      - name: Commit and push WIP checkpoint
        shell: bash
        run: |
          test "$(git status --short | wc -l)" -eq 4
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add \
            apps/web/src/state/documentCommandHistory.ts \
            apps/web/src/state/editorStore.ts \
            apps/web/src/viewport/GlobalThreeViewport.ts \
            apps/web/src/viewport/GarmentViewport.tsx
          git diff --cached --check
          git commit -m "fix(11.0.7): keep arrangement commits lightweight"
          git push origin HEAD:recovery/11.0.7-canonical-3d-arrangement-workspace
