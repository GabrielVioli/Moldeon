name: Prompt 8 Diagnose Coverage

on:
  push:
    paths:
      - scripts/prompt08-diagnose.ts
      - .github/workflows/prompt08-diagnose.yml

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm install
      - run: |
          python scripts/prompt08-finalize.py
          python scripts/prompt08-arc-fix.py
      - run: npx vite-node scripts/prompt08-diagnose.ts
