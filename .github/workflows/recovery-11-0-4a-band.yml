name: recovery-11.0.4a-band

on:
  pull_request:
    branches:
      - recovery/11.0.4-human-body-placement-scale

permissions:
  contents: read

jobs:
  band-source-only:
    if: ${{ github.head_ref == 'recovery/11.0.4a-waistband-zero-energy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: recovery/11.0.4a-waistband-zero-energy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diff check
        run: git diff --check origin/recovery/11.0.4-human-body-placement-scale...HEAD

      - name: Typecheck
        run: npm run typecheck

      - name: 11.0.4A band recovery gates
        env:
          MOLDEON_PHASE_A_REPORT: "1"
        run: >-
          npm run test --workspace @moldeon/web --
          src/physics/waistbandZeroEnergyRecovery.test.ts
          src/physics/waistbandAttachmentRegression.test.ts
          src/physics/phase0BandAttachmentInvariant.test.ts
          -t 'self-seam-tube|spatial-four-panel-tube|straight-skirt-standard|sewn local flap'

      - name: Existing four-panel zero-energy band gate
        env:
          MOLDEON_PHASE_A_REPORT: "1"
        run: >-
          npm run test --workspace @moldeon/web --
          src/physics/zeroEnergyInitialDressPose.test.ts
          -t phase-a-four-panel-waistband

  inherited-phase0-regressions:
    if: ${{ github.head_ref == 'recovery/11.0.4a-waistband-zero-energy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: recovery/11.0.4a-waistband-zero-energy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply inherited non-band Phase 0 WIP only
        run: |
          python3 scripts/recovery11_0_4_dart_candidate.py
          python3 scripts/recovery11_0_4_rigid_structural_polish.py
          python3 scripts/recovery11_0_4_freeflight_diagnostics.py

      - name: Diff check
        run: git diff --check

      - name: Typecheck inherited stack
        run: npm run typecheck

      - name: Previously green zero-energy regressions
        env:
          MOLDEON_PHASE_A_REPORT: "1"
        run: >-
          npm run test --workspace @moldeon/web --
          src/physics/zeroEnergyInitialDressPose.test.ts
          -t 'self-seam-tube|phase-a-three-panel-cylinder|spatial-four-panel-tube|dart-piece|phase-a-four-panel-waistband'

      - name: Straight-skirt baseline sanity regression
        run: npm run test --workspace @moldeon/web -- src/physics/canonicalStraightSkirtGate.test.ts

      - name: Pants band invariance under inherited stack
        run: npm run test --workspace @moldeon/web -- src/physics/phase0BandAttachmentInvariant.test.ts -t straight-pants-standard
