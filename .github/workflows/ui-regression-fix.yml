name: UI Regression Fix

on:
  push:
    paths:
      - scripts/ui-regression-fix.py
      - scripts/ui-regression-followup.py
      - scripts/ui-regression-audit.mjs
      - scripts/ui-regression-progress.py
      - .github/workflows/ui-regression-fix.yml

permissions:
  contents: write

concurrency:
  group: ui-regression-fix-main
  cancel-in-progress: true

jobs:
  fix-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UI_REGRESSION_ARTIFACT_DIR: artifacts/ui-regression-fix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply source correction
        run: |
          python scripts/ui-regression-fix.py
          python scripts/ui-regression-followup.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Functional and visual audit
        run: |
          npm run dev:fallback --workspace @moldeon/web -- --host 127.0.0.1 --port 5187 --strictPort > /tmp/moldeon-ui-regression.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 120); do
            curl --fail --silent http://127.0.0.1:5187/ >/dev/null && break
            sleep 0.5
          done
          UI_REGRESSION_BASE_URL=http://127.0.0.1:5187 node scripts/ui-regression-audit.mjs
      - name: Publish source and evidence commit
        run: |
          mkdir -p docs/evidence/ui-regression-fix
          cp -f artifacts/ui-regression-fix/* docs/evidence/ui-regression-fix/
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/editor/PatternCanvas.tsx apps/web/src/App.tsx apps/web/src/viewport/GarmentViewport.tsx apps/web/src/styles.css docs/evidence/ui-regression-fix
          git commit -m "fix: restore canvas gesture and panel ownership"
          echo "IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Write progress report and remove temporary audit files
        run: |
          python scripts/ui-regression-progress.py
          git add docs/progress/UI_REGRESSION_FIX_POST_PROMPT_04.md
          git rm -f \
            scripts/ui-regression-baseline.mjs \
            scripts/ui-regression-fix.py \
            scripts/ui-regression-followup.py \
            scripts/ui-regression-audit.mjs \
            scripts/ui-regression-progress.py \
            .github/workflows/ui-regression-baseline.yml \
            .github/workflows/ui-regression-fix.yml
          git commit -m "docs: record post prompt 4 ui regression fix"
          git push origin main
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-fix-${{ github.sha }}
          path: artifacts/ui-regression-fix
          retention-days: 21
          if-no-files-found: warn
