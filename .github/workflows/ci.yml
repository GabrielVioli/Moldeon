# Temporary execution on PR #5; restored before the functional commit.
name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web checks and scoped recovery
    if: github.head_ref == 'ci/recovery-9.5-03-ghost-geometry'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout temporary recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact temporary branch
        shell: bash
        run: |
          test "$(git branch --show-current)" = "ci/recovery-9.5-03-ghost-geometry"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Apply scoped Canvas correction
        id: patch
        shell: bash
        run: |
          if test -f apps/web/src/editor/canvasRenderState.ts \
            && grep -q 'drawLatestRef.current' apps/web/src/editor/PatternCanvas.tsx; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/apply-recovery-ghost-geometry.py

          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("apps/web/src/editor/canvasRenderState.test.ts")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace("  } as GarmentDraft;", "  } as unknown as GarmentDraft;")
          test = test.replace(
              '  };\n}\n\ndescribe("canvas render state"',
              '  } as Seam;\n}\n\ndescribe("canvas render state"',
          )
          test_path.write_text(test, encoding="utf-8")

          visual_path = Path("scripts/recovery-empty-workspace-visual.mjs")
          visual = visual_path.read_text(encoding="utf-8")
          visual = visual.replace(
              'getByRole("button", { name: "Moldes" })',
              'getByRole("button", { name: "Moldes", exact: true })',
          )
          visual_path.write_text(visual, encoding="utf-8")
          PY

          echo "applied=true" >> "$GITHUB_OUTPUT"
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build fallback application
        run: npm run build

      - name: Install browser controller
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start recovery application
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        env:
          RECOVERY_BASE_URL: http://127.0.0.1:4179
          RECOVERY_ARTIFACT_DIR: artifacts/recovery-empty-workspace
        run: |
          mkdir -p "$RECOVERY_ARTIFACT_DIR"
          (
            cd apps/web
            npx vite --mode fallback --host 127.0.0.1 --port 4179 --strictPort
          ) > "$GITHUB_WORKSPACE/$RECOVERY_ARTIFACT_DIR/server.log" 2>&1 &
          echo $! > "$RECOVERY_ARTIFACT_DIR/server.pid"
          for attempt in $(seq 1 120); do
            if curl --silent --fail "$RECOVERY_BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$RECOVERY_ARTIFACT_DIR/server.log"
          exit 1

      - name: Run strict desktop and mobile zoom journey
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        env:
          RECOVERY_BASE_URL: http://127.0.0.1:4179
          RECOVERY_ARTIFACT_DIR: artifacts/recovery-empty-workspace
        run: |
          set -o pipefail
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node scripts/recovery-empty-workspace-visual.mjs | tee "$RECOVERY_ARTIFACT_DIR/audit.json"

      - name: Stop recovery application
        if: always() && steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          if test -f artifacts/recovery-empty-workspace/server.pid; then
            kill "$(cat artifacts/recovery-empty-workspace/server.pid)" 2>/dev/null || true
          fi

      - name: Restore permanent CI and commit functional correction
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          git show "origin/${{ github.base_ref }}:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            apps/web/src/App.tsx \
            apps/web/src/editor/PatternCanvas.tsx \
            apps/web/src/editor/canvasRenderState.ts \
            apps/web/src/editor/canvasRenderState.test.ts \
            scripts/recovery-empty-workspace-visual.mjs \
            docs/progress/RECOVERY_9_5_DEFERRED_ISSUES.md
          git commit -m "fix: remove ghost canvas geometry after zoom"
          git push origin HEAD:${{ github.head_ref }}

  rust:
    name: Rust checks
    if: github.head_ref == 'ci/recovery-9.5-03-ghost-geometry'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace
