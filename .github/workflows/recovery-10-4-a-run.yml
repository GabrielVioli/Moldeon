name: Recovery 10.4 A XPBD baseline

on:
  push:
    branches:
      - recovery/10.4-a-xpbd-hotloop-performance

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/10.4-a-xpbd-hotloop-performance
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply baseline profiler
        run: |
          python scripts/recovery-10-4-a-baseline.py
          python scripts/recovery-10-4-a-baseline-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Baseline benchmark
        env:
          MOLDEON_PERF_BENCH: "1"
        run: npx vitest run apps/web/src/physics/xpbdHotloopPerformance.test.ts --reporter=verbose
