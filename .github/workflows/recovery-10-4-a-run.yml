name: Recovery 10.4 A XPBD optimized

on:
  push:
    branches:
      - recovery/10.4-a-xpbd-hotloop-performance

permissions:
  contents: read

jobs:
  optimized:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/10.4-a-xpbd-hotloop-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply profiler and optimizations
        run: |
          python scripts/recovery-10-4-a-baseline.py
          python scripts/recovery-10-4-a-baseline-fix.py
          python scripts/recovery-10-4-a-opt-distance.py
          python scripts/recovery-10-4-a-opt-shear.py
          python scripts/recovery-10-4-a-opt-seam.py
      - run: npm ci
      - run: npm run typecheck
      - name: Optimized benchmark
        env:
          MOLDEON_PERF_BENCH: "1"
        run: npx vitest run apps/web/src/physics/xpbdHotloopPerformance.test.ts --reporter=verbose
      - name: Focused regressions
        run: npx vitest run apps/web/src/physics/xpbd.test.ts apps/web/src/physics/xpbdCanonicalScenes.test.ts apps/web/src/physics/xpbdGarmentIntegration.test.ts apps/web/src/physics/initialSeamResidual.test.ts --reporter=verbose
