name: Prompt 5 Parametric Engine

on:
  push:
    paths:
      - scripts/prompt05-apply.py
      - scripts/prompt05-followup.py
      - scripts/prompt05-responsive.py
      - scripts/prompt05-audit.mjs
      - scripts/prompt05-progress.py
      - .github/workflows/prompt05-parametric.yml

permissions:
  contents: write

concurrency:
  group: prompt05-parametric-main
  cancel-in-progress: true

jobs:
  implement-test-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROMPT05_ARTIFACT_DIR: artifacts/prompt05-parametric
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply integration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/prompt05-apply.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              '    if count != 1:\n        raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:120]!r}")\n    file.write_text(source.replace(old, new), encoding="utf-8")',
              '    if count < 1:\n        raise SystemExit(f"{path}: expected at least one occurrence, found {count}: {old[:120]!r}")\n    file.write_text(source.replace(old, new, 1), encoding="utf-8")',
          )
          path.write_text(source, encoding="utf-8")
          PY
          python scripts/prompt05-apply.py
          python scripts/prompt05-followup.py
          python scripts/prompt05-responsive.py
      - name: Install dependencies
        run: npm install
      - name: Check diff
        run: git diff --check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium for visual audit
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Functional and visual audit
        run: |
          npm run dev:fallback --workspace @moldeon/web -- --host 127.0.0.1 --port 5190 --strictPort > /tmp/moldeon-prompt05.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 120); do
            curl --fail --silent http://127.0.0.1:5190/ >/dev/null && break
            sleep 0.5
          done
          PROMPT05_BASE_URL=http://127.0.0.1:5190 node scripts/prompt05-audit.mjs
      - name: Commit implementation and evidence
        run: |
          mkdir -p docs/evidence/prompt05-parametric
          cp -f artifacts/prompt05-parametric/* docs/evidence/prompt05-parametric/
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src docs/evidence/prompt05-parametric
          git commit -m "feat: integrate versioned parametric measurement engine"
          echo "IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Document delivery and clean temporary automation
        run: |
          python scripts/prompt05-progress.py
          git add docs/PATTERN_DOCUMENT_V3.md docs/DEPENDENCY_AUDIT.md docs/progress/PROMPT_05_PARAMETRIC_ENGINE.md
          git rm -f scripts/prompt05-apply.py scripts/prompt05-followup.py scripts/prompt05-responsive.py scripts/prompt05-audit.mjs scripts/prompt05-progress.py .github/workflows/prompt05-parametric.yml
          git commit -m "docs: record prompt 5 parametric engine delivery"
          git push origin main
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt05-parametric-${{ github.sha }}
          path: artifacts/prompt05-parametric
          retention-days: 21
          if-no-files-found: warn
