name: Recovery 9.5-05 Pages Preview

on:
  push:
    branches:
      - "recovery/9.5-05-modeling-operations"
    paths:
      - ".github/workflows/recovery-modeling-pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: recovery-9-5-05-pages
  cancel-in-progress: true

jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build Pages preview
        run: npm run build --workspace @moldeon/web -- --base=/Moldeon/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy Pages preview
        id: deployment
        uses: actions/deploy-pages@v4
