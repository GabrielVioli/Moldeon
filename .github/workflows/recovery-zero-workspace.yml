name: Recovery 11.0.1 Broad Validation Resume

on:
  push:
    branches:
      - recovery/11.0.1-body-collision-stabilization
    paths:
      - .github/workflows/recovery-zero-workspace.yml
      - artifacts/recovery-11-0-1-trigger.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.1-body-collision-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci

      # Focused physics/typecheck already passed at 335ef298... and is not repeated.
      - name: Apply already-validated final candidate
        run: |
          python3 scripts/apply-prompt11-0-1-final.py
          python3 scripts/apply-prompt11-0-1-final-tests.py
          echo pass > /tmp/gate-apply

      - name: Full web test suite
        run: |
          npm test | tee /tmp/full-tests.log
          echo pass > /tmp/gate-full-tests

      - name: Fallback production build
        run: |
          npm run build | tee /tmp/build.log
          echo pass > /tmp/gate-build

      - name: Rust fmt
        run: |
          cargo fmt --all --check | tee /tmp/rust-fmt.log
          echo pass > /tmp/gate-rust-fmt

      - name: Rust clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings | tee /tmp/rust-clippy.log
          echo pass > /tmp/gate-rust-clippy

      - name: Rust tests
        run: |
          cargo test --workspace | tee /tmp/rust-tests.log
          echo pass > /tmp/gate-rust-tests

      - name: Install browser smoke dependency
        run: |
          npm install --no-save playwright@1.55.0 | tee /tmp/playwright-npm.log
          npx playwright install --with-deps chromium | tee /tmp/playwright-install.log
          echo pass > /tmp/gate-browser-install

      - name: Browser smoke and collider-visibility invariance
        shell: bash
        run: |
          cat > /tmp/browser-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const metricKeys = [
            'physicsStep',
            'Body contacts',
            'Max penetration mm',
            'Max body correction mm',
            'Friction contacts',
            'seamMeanErrorMm',
            'seamMaxErrorMm',
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', error => pageErrors.push(String(error)));
            await page.goto('http://127.0.0.1:5173', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2500);
            const physics = page.locator('aside[aria-label="Diagnóstico físico DEV"]');
            await physics.waitFor({ state: 'visible', timeout: 30000 });
            const pause = page.getByRole('button', { name: 'Pausar' });
            if (await pause.count()) {
              await pause.click();
              await page.waitForTimeout(350);
            }
            async function readMetrics() {
              return await physics.evaluate((root, keys) => {
                const result = {};
                for (const dt of [...root.querySelectorAll('dt')]) {
                  const name = (dt.textContent || '').trim();
                  if (!keys.includes(name)) continue;
                  result[name] = (dt.nextElementSibling?.textContent || '').trim();
                }
                return result;
              }, metricKeys);
            }
            const before = await readMetrics();
            const toggle = physics.getByLabel('Show body colliders');
            if (await toggle.count() !== 1) throw new Error('Show body colliders control missing');
            const checked = await toggle.isChecked();
            await toggle.setChecked(!checked);
            await page.waitForTimeout(500);
            const after = await readMetrics();
            if (JSON.stringify(before) !== JSON.stringify(after)) {
              throw new Error(`Show body colliders changed paused physics: before=${JSON.stringify(before)} after=${JSON.stringify(after)}`);
            }
            if (consoleErrors.length || pageErrors.length) {
              throw new Error(`browser errors: ${JSON.stringify({ consoleErrors, pageErrors })}`);
            }
            console.log(JSON.stringify({ browserSmoke: 'ok', colliderVisibilityPhysicsInvariant: true, metrics: before }));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          npm run dev:fallback -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = "1"
          node /tmp/browser-smoke.cjs | tee /tmp/browser-smoke.log
          kill $VITE_PID 2>/dev/null || true
          wait $VITE_PID 2>/dev/null || true
          git restore package-lock.json package.json 2>/dev/null || true
          echo pass > /tmp/gate-browser-smoke

      - name: Diff check
        run: |
          git diff --check
          echo pass > /tmp/gate-diff

      - name: Persist result and tested runtime
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          gate() { if [ -f "/tmp/gate-$1" ]; then echo pass; else echo not-completed; fi; }
          {
            echo "HEAD_BEFORE_RESULT=$(git rev-parse HEAD)"
            echo "FOCUSED_GATE=previously-passed-at-335ef298db6caf79a0e613b0d8babec901b86c5c"
            echo "APPLY=$(gate apply)"
            echo "FULL_TESTS=$(gate full-tests)"
            echo "BUILD=$(gate build)"
            echo "RUST_FMT=$(gate rust-fmt)"
            echo "RUST_CLIPPY=$(gate rust-clippy)"
            echo "RUST_TESTS=$(gate rust-tests)"
            echo "BROWSER_INSTALL=$(gate browser-install)"
            echo "BROWSER_SMOKE=$(gate browser-smoke)"
            echo "DIFF_CHECK=$(gate diff)"
          } > artifacts/recovery-11-0-1-full-resume.txt
          cat artifacts/recovery-11-0-1-full-resume.txt

          ALL_PASS=1
          for marker in apply full-tests build rust-fmt rust-clippy rust-tests browser-install browser-smoke diff; do
            [ -f "/tmp/gate-$marker" ] || ALL_PASS=0
          done

          git config user.name "Moldeon Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin recovery/11.0.1-body-collision-stabilization

          # If the older opaque Full Validation finished successfully in parallel,
          # do not race or overwrite its tested runtime.
          if git cat-file -e origin/recovery/11.0.1-body-collision-stabilization:artifacts/recovery-11-0-1-full-validation.txt 2>/dev/null; then
            echo "Older full validation already persisted; leaving remote untouched."
            exit 0
          fi

          git add artifacts/recovery-11-0-1-full-resume.txt
          if [ "$ALL_PASS" = "1" ]; then
            git add \
              apps/web/src/physics/BodyCollisionRegistration.ts \
              apps/web/src/physics/GarmentXpbdAdapter.ts \
              apps/web/src/physics/bodyCollision.ts \
              apps/web/src/physics/xpbd.ts \
              apps/web/src/physics/bodyCollision.test.ts \
              apps/web/src/physics/bodyCollisionRegistration.test.ts \
              apps/web/src/viewport/GlobalThreeViewport.ts \
              apps/web/src/viewport/GarmentViewport.tsx
            git commit -m "fix(physics): stabilize body collision lifecycle"
          else
            git commit -m "chore: record Prompt 11.0.1 broad validation failure"
          fi
          git push origin HEAD:recovery/11.0.1-body-collision-stabilization
          test "$ALL_PASS" = "1"
