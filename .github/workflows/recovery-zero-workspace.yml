name: Recovery 11.0.1 Browser Smoke Final Result

on:
  push:
    branches:
      - recovery/11.0.1-body-collision-stabilization
    paths:
      - .github/workflows/recovery-zero-workspace.yml
      - artifacts/recovery-11-0-1-trigger.txt

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.1-body-collision-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply already-validated final candidate
        run: |
          python3 scripts/apply-prompt11-0-1-final.py
          python3 scripts/apply-prompt11-0-1-final-tests.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser smoke and diff check
        shell: bash
        run: |
          set +e
          cat > /tmp/browser-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const metricKeys = ['physicsStep','Body contacts','Max penetration mm','Max body correction mm','Friction contacts','seamMeanErrorMm','seamMaxErrorMm'];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', error => pageErrors.push(String(error)));
            await page.goto('http://127.0.0.1:5173', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(2500);
            const physics = page.locator('aside[aria-label="Diagnóstico físico DEV"]');
            await physics.waitFor({ state: 'visible', timeout: 30000 });
            const pause = page.getByRole('button', { name: 'Pausar' });
            if (await pause.count()) {
              await pause.first().click();
              await page.getByRole('button', { name: 'Continuar' }).waitFor({ state: 'visible', timeout: 5000 });
              await page.waitForTimeout(500);
            }
            async function readMetrics() {
              return await physics.evaluate((root, keys) => {
                const result = {};
                for (const dt of [...root.querySelectorAll('dt')]) {
                  const name = (dt.textContent || '').trim();
                  if (!keys.includes(name)) continue;
                  result[name] = (dt.nextElementSibling?.textContent || '').trim();
                }
                return result;
              }, metricKeys);
            }
            const before = await readMetrics();
            const toggle = physics.getByLabel('Show body colliders');
            const toggleCount = await toggle.count();
            if (toggleCount !== 1) throw new Error(`Show body colliders control count=${toggleCount}`);
            const checked = await toggle.isChecked();
            await toggle.setChecked(!checked);
            await page.waitForTimeout(500);
            const after = await readMetrics();
            const invariant = JSON.stringify(before) === JSON.stringify(after);
            const result = {
              browserSmoke: invariant && consoleErrors.length === 0 && pageErrors.length === 0 ? 'ok' : 'failed',
              colliderVisibilityPhysicsInvariant: invariant,
              metricsBefore: before,
              metricsAfter: after,
              consoleErrors,
              pageErrors,
              bodyTextLength: (await page.locator('body').innerText()).length,
            };
            console.log('P1101_BROWSER_SMOKE ' + JSON.stringify(result));
            await browser.close();
            if (!invariant || consoleErrors.length || pageErrors.length) process.exit(4);
          })().catch(error => { console.error('P1101_BROWSER_SMOKE_ERROR', error); process.exit(5); });
          NODE

          (cd apps/web && npx vite --mode fallback --host 127.0.0.1) > /tmp/vite.log 2>&1 &
          VITE_PID=$!
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" = "1" ]; then
            node /tmp/browser-smoke.cjs > /tmp/browser-smoke.log 2>&1
            BROWSER=$?
          else
            BROWSER=3
            echo "vite-not-ready" > /tmp/browser-smoke.log
          fi
          kill $VITE_PID 2>/dev/null || true
          wait $VITE_PID 2>/dev/null || true
          git restore package-lock.json package.json 2>/dev/null || true
          git diff --check > /tmp/diff.log 2>&1
          DIFF=$?
          set -e

          mkdir -p artifacts
          {
            echo "HEAD=$(git rev-parse HEAD) READY=$READY BROWSER_EXIT=$BROWSER DIFF_EXIT=$DIFF"
            echo "FOCUSED_GATE=pass@335ef298db6caf79a0e613b0d8babec901b86c5c"
            echo "FULL_TESTS=pass"
            echo "BUILD=pass"
            echo "RUST_FMT=pass"
            echo "RUST_CLIPPY=pass"
            echo "RUST_TESTS=pass"
            echo "--- browser ---"; cat /tmp/browser-smoke.log
            echo "--- vite ---"; tail -n 80 /tmp/vite.log
            echo "--- diff ---"; cat /tmp/diff.log
          } > artifacts/recovery-11-0-1-browser-final.txt
          cat artifacts/recovery-11-0-1-browser-final.txt

          git config user.name "Moldeon Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin recovery/11.0.1-body-collision-stabilization
          REMOTE_SHA=$(git rev-parse origin/recovery/11.0.1-body-collision-stabilization)
          LOCAL_SHA=$(git rev-parse HEAD)
          if git cat-file -e origin/recovery/11.0.1-body-collision-stabilization:artifacts/recovery-11-0-1-validation-complete.txt 2>/dev/null; then
            echo "Parallel browser gate already succeeded; leaving remote untouched."
            exit 0
          fi
          if [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "Remote advanced during browser gate; leaving remote untouched for next inspection."
            exit 0
          fi

          git add artifacts/recovery-11-0-1-browser-final.txt
          if [ "$BROWSER" = "0" ] && [ "$DIFF" = "0" ]; then
            cp artifacts/recovery-11-0-1-browser-final.txt artifacts/recovery-11-0-1-validation-complete.txt
            git add \
              apps/web/src/physics/BodyCollisionRegistration.ts \
              apps/web/src/physics/GarmentXpbdAdapter.ts \
              apps/web/src/physics/bodyCollision.ts \
              apps/web/src/physics/xpbd.ts \
              apps/web/src/physics/bodyCollision.test.ts \
              apps/web/src/physics/bodyCollisionRegistration.test.ts \
              apps/web/src/viewport/GlobalThreeViewport.ts \
              apps/web/src/viewport/GarmentViewport.tsx \
              artifacts/recovery-11-0-1-validation-complete.txt
            git commit -m "fix(physics): stabilize body collision lifecycle"
          else
            git commit -m "chore: record Prompt 11.0.1 browser smoke failure"
          fi
          git push origin HEAD:recovery/11.0.1-body-collision-stabilization
          test "$BROWSER" = "0"
          test "$DIFF" = "0"
