name: Recovery 11.0.1 Body Collision Stabilization Runner

on:
  push:
    branches:
      - recovery/11.0.1-body-collision-stabilization
    paths:
      - artifacts/recovery-11-0-1-trigger.txt
      - .github/workflows/recovery-zero-workspace.yml

permissions:
  contents: write

concurrency:
  group: recovery-11-0-1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.1-body-collision-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Registration and stabilization audit
        shell: bash
        run: |
          set +e
          npx vitest run apps/web/src/physics/bodyCollisionStabilization.test.ts apps/web/src/physics/bodyRegistrationReferenceAudit.test.ts --reporter=verbose > /tmp/audit.log 2>&1
          STATUS=$?
          set -e
          mkdir -p artifacts
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "STATUS=$STATUS"
            cat /tmp/audit.log
          } > artifacts/recovery-11-0-1-registration-audit.txt
          cat artifacts/recovery-11-0-1-registration-audit.txt
          git config user.name "Moldeon Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/recovery-11-0-1-registration-audit.txt
          git commit -m "chore: record Prompt 11.0.1 registration audit" || true
          git push origin HEAD:recovery/11.0.1-body-collision-stabilization
          exit "$STATUS"
