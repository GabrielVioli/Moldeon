name: Recovery 11.0.1 Final Browser Smoke

on:
  push:
    branches:
      - recovery/11.0.1-body-collision-stabilization
    paths:
      - .github/workflows/recovery-zero-workspace.yml
      - artifacts/recovery-11-0-1-trigger.txt

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.1-body-collision-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply already-validated final candidate
        run: |
          python3 scripts/apply-prompt11-0-1-final.py
          python3 scripts/apply-prompt11-0-1-final-tests.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Corrected browser smoke
        shell: bash
        run: |
          cat > /tmp/browser-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const metricKeys = ['physicsStep','Body contacts','Max penetration mm','Max body correction mm','Friction contacts','seamMeanErrorMm','seamMaxErrorMm'];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', error => pageErrors.push(String(error)));
            await page.goto('http://127.0.0.1:5173', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(2500);
            const physics = page.locator('aside[aria-label="Diagnóstico físico DEV"]');
            await physics.waitFor({ state: 'visible', timeout: 30000 });
            const pause = page.getByRole('button', { name: 'Pausar' });
            if (await pause.count()) {
              await pause.first().click();
              await page.getByRole('button', { name: 'Continuar' }).waitFor({ state: 'visible', timeout: 5000 });
              await page.waitForTimeout(500);
            }
            async function readMetrics() {
              return await physics.evaluate((root, keys) => {
                const result = {};
                for (const dt of [...root.querySelectorAll('dt')]) {
                  const name = (dt.textContent || '').trim();
                  if (!keys.includes(name)) continue;
                  result[name] = (dt.nextElementSibling?.textContent || '').trim();
                }
                return result;
              }, metricKeys);
            }
            const before = await readMetrics();
            const toggle = physics.getByLabel('Show body colliders');
            if (await toggle.count() !== 1) throw new Error('Show body colliders control missing');
            const checked = await toggle.isChecked();
            await toggle.setChecked(!checked);
            await page.waitForTimeout(500);
            const after = await readMetrics();
            if (JSON.stringify(before) !== JSON.stringify(after)) {
              throw new Error(`Show body colliders changed paused physics: before=${JSON.stringify(before)} after=${JSON.stringify(after)}`);
            }
            if (consoleErrors.length || pageErrors.length) {
              throw new Error(`browser errors: ${JSON.stringify({ consoleErrors, pageErrors })}`);
            }
            console.log('P1101_BROWSER_SMOKE ' + JSON.stringify({
              browserSmoke: 'ok',
              colliderVisibilityPhysicsInvariant: true,
              metrics: before,
              bodyTextLength: (await page.locator('body').innerText()).length,
            }));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          (cd apps/web && npx vite --mode fallback --host 127.0.0.1) > /tmp/vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/vite.log
            exit 1
          fi
          node /tmp/browser-smoke.cjs | tee /tmp/browser-smoke.log
          git restore package-lock.json package.json 2>/dev/null || true
          git diff --check
      - name: Persist final browser result and tested runtime
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "HEAD_BEFORE_COMMIT=$(git rev-parse HEAD)"
            echo "FOCUSED_GATE=pass@335ef298db6caf79a0e613b0d8babec901b86c5c"
            echo "FULL_TESTS=pass"
            echo "BUILD=pass"
            echo "RUST_FMT=pass"
            echo "RUST_CLIPPY=pass"
            echo "RUST_TESTS=pass"
            echo "BROWSER_SMOKE=pass"
            echo "DIFF_CHECK=pass"
            cat /tmp/browser-smoke.log
          } > artifacts/recovery-11-0-1-validation-complete.txt
          git config user.name "Moldeon Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/physics/BodyCollisionRegistration.ts \
            apps/web/src/physics/GarmentXpbdAdapter.ts \
            apps/web/src/physics/bodyCollision.ts \
            apps/web/src/physics/xpbd.ts \
            apps/web/src/physics/bodyCollision.test.ts \
            apps/web/src/physics/bodyCollisionRegistration.test.ts \
            apps/web/src/viewport/GlobalThreeViewport.ts \
            apps/web/src/viewport/GarmentViewport.tsx \
            artifacts/recovery-11-0-1-validation-complete.txt
          git commit -m "fix(physics): stabilize body collision lifecycle"
          git push origin HEAD:recovery/11.0.1-body-collision-stabilization
