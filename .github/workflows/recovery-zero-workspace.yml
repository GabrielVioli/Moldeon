name: Recovery 9.5 Empty Workspace

on:
  push:
    branches:
      - "recovery/9.5-03-empty-workspace"
    paths:
      - "scripts/apply-recovery-zero-workspace.py"
      - "scripts/apply-recovery-zero-workspace-references.py"
      - "scripts/recovery-empty-workspace-visual.mjs"
      - ".github/workflows/recovery-zero-workspace.yml"

permissions:
  contents: write

concurrency:
  group: recovery-9-5-empty-workspace-v4
  cancel-in-progress: true

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RECOVERY_BASE_URL: http://127.0.0.1:4179
      RECOVERY_ARTIFACT_DIR: artifacts/recovery-empty-workspace
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: "recovery/9.5-03-empty-workspace"
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Apply scoped recovery patch
        run: |
          python scripts/apply-recovery-zero-workspace.py
          python scripts/apply-recovery-zero-workspace-references.py

      - name: Install dependencies
        run: npm ci

      - name: Validate diff
        run: git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install browser controller
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Start recovery application
        shell: bash
        run: |
          mkdir -p "$RECOVERY_ARTIFACT_DIR"
          (
            cd apps/web
            npx vite --mode fallback --host 127.0.0.1 --port 4179 --strictPort
          ) > "$GITHUB_WORKSPACE/$RECOVERY_ARTIFACT_DIR/server.log" 2>&1 &
          echo $! > "$RECOVERY_ARTIFACT_DIR/server.pid"
          for attempt in $(seq 1 120); do
            if curl --silent --fail "$RECOVERY_BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$RECOVERY_ARTIFACT_DIR/server.log"
          exit 1

      - name: Run visual journey
        shell: bash
        run: |
          set -o pipefail
          node scripts/recovery-empty-workspace-visual.mjs | tee "$RECOVERY_ARTIFACT_DIR/audit.json"

      - name: Stop recovery application
        if: always()
        shell: bash
        run: |
          if test -f "$RECOVERY_ARTIFACT_DIR/server.pid"; then
            kill "$(cat "$RECOVERY_ARTIFACT_DIR/server.pid")" 2>/dev/null || true
          fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-9-5-empty-workspace-${{ github.sha }}
          path: artifacts/recovery-empty-workspace
          retention-days: 21
          if-no-files-found: warn

      - name: Commit validated implementation only to recovery branch
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add \
            apps/web/src/domain/pattern.ts \
            apps/web/src/domain/patternDocumentV3.ts \
            apps/web/src/storage/opfs.ts \
            apps/web/src/state/editorStore.ts \
            apps/web/src/editor/PatternCanvas.tsx \
            apps/web/src/components/PatternLibraryDialog.tsx \
            apps/web/src/App.tsx \
            apps/web/src/recovery.css \
            apps/web/src/state/emptyWorkspace.test.ts \
            apps/web/src/storage/emptyAutosave.test.ts \
            scripts/recovery-empty-workspace-visual.mjs \
            docs/progress/RECOVERY_GATE_BEFORE_PROMPT_10.md
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow an empty editable workspace"
          git push origin HEAD:"recovery/9.5-03-empty-workspace"
