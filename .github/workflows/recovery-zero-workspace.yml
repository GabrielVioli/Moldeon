name: Recovery 9.5 Empty Workspace

on:
  push:
    branches:
      - "recovery/9.5-03-empty-workspace"
    paths:
      - "scripts/apply-recovery-zero-workspace.py"
      - ".github/workflows/recovery-zero-workspace.yml"

permissions:
  contents: write

concurrency:
  group: recovery-9-5-empty-workspace
  cancel-in-progress: true

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: "recovery/9.5-03-empty-workspace"
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Apply scoped recovery patch
        run: python scripts/apply-recovery-zero-workspace.py

      - name: Install dependencies
        run: npm ci

      - name: Validate diff
        run: git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit only to recovery branch
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/state/editorStore.ts apps/web/src/App.tsx apps/web/src/recovery.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow an empty editable workspace"
          git push origin HEAD:"recovery/9.5-03-empty-workspace"
