name: Recovery 11.0.1 Focused Final Gate

on:
  push:
    branches:
      - recovery/11.0.1-body-collision-stabilization
    paths:
      - .github/workflows/recovery-zero-workspace.yml
      - artifacts/recovery-11-0-1-trigger.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.1-body-collision-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply final candidate
        run: |
          python3 scripts/apply-prompt11-0-1-final.py
          python3 scripts/apply-prompt11-0-1-final-tests.py
      - name: Typecheck
        run: npm run typecheck
      - name: Focused physics tests
        shell: bash
        run: |
          set +e
          npx vitest run \
            apps/web/src/physics/bodyCollision.test.ts \
            apps/web/src/physics/bodyCollisionRegistration.test.ts \
            apps/web/src/physics/XpbdWorkerState.test.ts \
            apps/web/src/physics/xpbdBodyCollisionCanonical.test.ts \
            apps/web/src/physics/bodyCollisionStabilizationFinal.test.ts \
            --reporter=verbose > /tmp/tests.log 2>&1
          STATUS=$?
          set -e
          mkdir -p artifacts
          {
            echo "HEAD=$(git rev-parse HEAD) STATUS=$STATUS"
            cat /tmp/tests.log
          } > artifacts/recovery-11-0-1-focused-final.txt
          cat artifacts/recovery-11-0-1-focused-final.txt
          git restore \
            apps/web/src/physics/BodyCollisionRegistration.ts \
            apps/web/src/physics/GarmentXpbdAdapter.ts \
            apps/web/src/physics/bodyCollision.ts \
            apps/web/src/physics/xpbd.ts \
            apps/web/src/physics/bodyCollision.test.ts \
            apps/web/src/physics/bodyCollisionRegistration.test.ts \
            apps/web/src/viewport/GlobalThreeViewport.ts \
            apps/web/src/viewport/GarmentViewport.tsx \
            scripts/apply-prompt11-0-1-stabilization.py \
            scripts/apply-prompt11-0-1-auto-dressing.py
          git config user.name "Moldeon Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/recovery-11-0-1-focused-final.txt
          git commit -m "chore: record Prompt 11.0.1 focused final gate" || true
          git push origin HEAD:recovery/11.0.1-body-collision-stabilization
          exit "$STATUS"
