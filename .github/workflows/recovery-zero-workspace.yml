name: Recovery 9.5 Empty Workspace

on:
  push:
    branches:
      - "recovery/9.5-03-empty-workspace"
    paths:
      - "scripts/recovery-empty-workspace-visual.mjs"
      - ".github/workflows/recovery-zero-workspace.yml"

permissions:
  contents: read

concurrency:
  group: recovery-9-5-empty-workspace-final-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      RECOVERY_BASE_URL: http://127.0.0.1:4179
      RECOVERY_ARTIFACT_DIR: artifacts/recovery-empty-workspace
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0

      - name: Record and verify exact commit
        shell: bash
        run: |
          mkdir -p "$RECOVERY_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD | tee "$RECOVERY_ARTIFACT_DIR/commit.txt"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install browser controller
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Start recovery application
        shell: bash
        run: |
          (
            cd apps/web
            npx vite --mode fallback --host 127.0.0.1 --port 4179 --strictPort
          ) > "$GITHUB_WORKSPACE/$RECOVERY_ARTIFACT_DIR/server.log" 2>&1 &
          echo $! > "$RECOVERY_ARTIFACT_DIR/server.pid"
          for attempt in $(seq 1 120); do
            if curl --silent --fail "$RECOVERY_BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$RECOVERY_ARTIFACT_DIR/server.log"
          exit 1

      - name: Run strict visual journey
        shell: bash
        run: |
          set -o pipefail
          node scripts/recovery-empty-workspace-visual.mjs | tee "$RECOVERY_ARTIFACT_DIR/audit.json"

      - name: Stop recovery application
        if: always()
        shell: bash
        run: |
          if test -f "$RECOVERY_ARTIFACT_DIR/server.pid"; then
            kill "$(cat "$RECOVERY_ARTIFACT_DIR/server.pid")" 2>/dev/null || true
          fi

      - name: Upload validation evidence and production bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-9-5-empty-workspace-${{ github.sha }}
          path: |
            artifacts/recovery-empty-workspace
            apps/web/dist
          retention-days: 21
          if-no-files-found: error
