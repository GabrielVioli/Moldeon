name: Recovery 9.5 Empty Workspace

on:
  push:
    branches:
      - "recovery/9.5-03-empty-workspace"
    paths:
      - "scripts/recovery-empty-workspace-visual.mjs"
      - ".github/workflows/recovery-zero-workspace.yml"

permissions:
  contents: write

concurrency:
  group: recovery-9-5-empty-workspace-final-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apply-ghost-fix:
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      applied: ${{ steps.result.outputs.applied }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0

      - name: Detect pending scoped fix
        id: detect
        shell: bash
        run: |
          if test -f apps/web/src/editor/canvasRenderState.ts; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply scoped Canvas fix
        if: steps.detect.outputs.needed == 'true'
        run: python3 scripts/apply-recovery-ghost-geometry.py

      - name: Setup Node.js
        if: steps.detect.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.needed == 'true'
        run: npm ci

      - name: Typecheck patched tree
        if: steps.detect.outputs.needed == 'true'
        run: npm run typecheck

      - name: Unit tests on patched tree
        if: steps.detect.outputs.needed == 'true'
        run: npm test

      - name: Production build of patched tree
        if: steps.detect.outputs.needed == 'true'
        run: npm run build

      - name: Commit validated fix to current branch
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/App.tsx \
            apps/web/src/editor/PatternCanvas.tsx \
            apps/web/src/editor/canvasRenderState.ts \
            apps/web/src/editor/canvasRenderState.test.ts \
            scripts/recovery-empty-workspace-visual.mjs \
            docs/progress/RECOVERY_9_5_DEFERRED_ISSUES.md
          git commit -m "fix: remove ghost canvas geometry after zoom"
          git push origin HEAD:recovery/9.5-03-empty-workspace

      - name: Publish apply result
        id: result
        shell: bash
        run: |
          echo "applied=${{ steps.detect.outputs.needed }}" >> "$GITHUB_OUTPUT"

  validate:
    needs: apply-ghost-fix
    if: needs.apply-ghost-fix.outputs.applied != 'true'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      RECOVERY_BASE_URL: http://127.0.0.1:4179
      RECOVERY_ARTIFACT_DIR: artifacts/recovery-empty-workspace
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0

      - name: Record and verify exact commit
        shell: bash
        run: |
          mkdir -p "$RECOVERY_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD | tee "$RECOVERY_ARTIFACT_DIR/commit.txt"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install browser controller and Chromium
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Start recovery application
        shell: bash
        run: |
          (
            cd apps/web
            npx vite --mode fallback --host 127.0.0.1 --port 4179 --strictPort
          ) > "$GITHUB_WORKSPACE/$RECOVERY_ARTIFACT_DIR/server.log" 2>&1 &
          echo $! > "$RECOVERY_ARTIFACT_DIR/server.pid"
          for attempt in $(seq 1 120); do
            if curl --silent --fail "$RECOVERY_BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$RECOVERY_ARTIFACT_DIR/server.log"
          exit 1

      - name: Run strict visual journey
        shell: bash
        run: |
          set -o pipefail
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node scripts/recovery-empty-workspace-visual.mjs | tee "$RECOVERY_ARTIFACT_DIR/audit.json"

      - name: Stop recovery application
        if: always()
        shell: bash
        run: |
          if test -f "$RECOVERY_ARTIFACT_DIR/server.pid"; then
            kill "$(cat "$RECOVERY_ARTIFACT_DIR/server.pid")" 2>/dev/null || true
          fi

      - name: Upload validation evidence and production bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-9-5-empty-workspace-${{ github.sha }}
          path: |
            artifacts/recovery-empty-workspace
            apps/web/dist
          retention-days: 21
          if-no-files-found: error
