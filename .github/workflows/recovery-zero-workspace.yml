name: Recovery 11.0.1 Mesh CFL Audit

on:
  push:
    branches:
      - recovery/11.0.1-body-collision-stabilization
    paths:
      - .github/workflows/recovery-zero-workspace.yml
      - artifacts/recovery-11-0-1-trigger.txt

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.1-body-collision-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Measure mesh CFL stabilization
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/patch.log 2>&1
          from pathlib import Path
          path = Path("scripts/apply-prompt11-0-1-stabilization.py")
          text = path.read_text(encoding="utf-8")
          old = '''    "function selectInstanceSupportVertices(",\n    "export function xpbdInitializationTransferables",\n    "export function xpbdInitializationTransferables",\n)'''
          new = '''    "function selectInstanceSupportVertices(",\n    "function appendEdge(",\n    "",\n)'''
          if text.count(old) != 1:
              raise RuntimeError(f"adapter helper boundary mismatch: {text.count(old)}")
          text = text.replace(old, new, 1)
          old_condition = '''    && correspondences.every((pair) => (pair.region === "hip" || pair.region === "waist") && pair.neutralPlacement)'''
          new_condition = '''    && correspondences.every((pair) => pair.region === "hip" || pair.region === "waist")'''
          if text.count(old_condition) != 1:
              raise RuntimeError(f"lower-shell condition mismatch: {text.count(old_condition)}")
          path.write_text(text.replace(old_condition, new_condition, 1), encoding="utf-8")
          PY
          FIX=$?
          if [ "$FIX" -eq 0 ]; then
            python3 scripts/apply-prompt11-0-1-stabilization.py >> /tmp/patch.log 2>&1; PATCH=$?
            python3 scripts/apply-prompt11-0-1-friction.py >> /tmp/patch.log 2>&1; FRICTION=$?
            python3 scripts/apply-prompt11-0-1-inelastic.py >> /tmp/patch.log 2>&1; INELASTIC=$?
            python3 scripts/apply-prompt11-0-1-phase-switch.py >> /tmp/patch.log 2>&1; PHASE=$?
            python3 scripts/apply-prompt11-0-1-post-body-structural.py >> /tmp/patch.log 2>&1; POSTSTRUCT=$?
            python3 scripts/apply-prompt11-0-1-cfl-velocity.py >> /tmp/patch.log 2>&1; CFL=$?
          else
            PATCH=99; FRICTION=99; INELASTIC=99; PHASE=99; POSTSTRUCT=99; CFL=99
          fi
          if [ "$PATCH" -eq 0 ] && [ "$FRICTION" -eq 0 ] && [ "$INELASTIC" -eq 0 ] && [ "$PHASE" -eq 0 ] && [ "$POSTSTRUCT" -eq 0 ] && [ "$CFL" -eq 0 ]; then
            npm run typecheck > /tmp/type.log 2>&1; TYPE=$?
            npx vitest run apps/web/src/physics/bodyCollisionStagedDressingAudit.test.ts apps/web/src/physics/xpbdBodyCollisionCanonical.test.ts apps/web/src/physics/bodyCollision.test.ts --reporter=verbose > /tmp/audit.log 2>&1; STATUS=$?
          else
            TYPE=99; STATUS=99
            : > /tmp/type.log; : > /tmp/audit.log
          fi
          set -e
          mkdir -p artifacts
          {
            echo "HEAD=$(git rev-parse HEAD) FIX=$FIX PATCH=$PATCH FRICTION=$FRICTION INELASTIC=$INELASTIC PHASE=$PHASE POSTSTRUCT=$POSTSTRUCT CFL=$CFL TYPE=$TYPE STATUS=$STATUS"
            echo "--- patch ---"; cat /tmp/patch.log
            echo "--- typecheck ---"; cat /tmp/type.log
            echo "--- audit ---"; cat /tmp/audit.log
          } > artifacts/recovery-11-0-1-cfl-audit.txt
          cat artifacts/recovery-11-0-1-cfl-audit.txt
          git restore \
            apps/web/src/physics/BodyCollisionRegistration.ts \
            apps/web/src/physics/GarmentXpbdAdapter.ts \
            apps/web/src/physics/bodyCollision.ts \
            apps/web/src/physics/xpbd.ts \
            apps/web/src/viewport/GlobalThreeViewport.ts \
            scripts/apply-prompt11-0-1-stabilization.py
          git config user.name "Moldeon Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/recovery-11-0-1-cfl-audit.txt
          git commit -m "chore: record Prompt 11.0.1 mesh CFL audit" || true
          git push origin HEAD:recovery/11.0.1-body-collision-stabilization
          if [ "$TYPE" -ne 0 ] || [ "$STATUS" -ne 0 ]; then exit 1; fi
