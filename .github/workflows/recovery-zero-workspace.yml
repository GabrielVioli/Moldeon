name: Recovery 11.0.1 Final Candidate

on:
  push:
    branches:
      - recovery/11.0.1-body-collision-stabilization
    paths:
      - .github/workflows/recovery-zero-workspace.yml
      - artifacts/recovery-11-0-1-trigger.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.1-body-collision-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply final runtime candidate
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-prompt11-0-1-stabilization.py")
          text = path.read_text(encoding="utf-8")
          old = '''    "function selectInstanceSupportVertices(",\n    "export function xpbdInitializationTransferables",\n    "export function xpbdInitializationTransferables",\n)'''
          new = '''    "function selectInstanceSupportVertices(",\n    "function appendEdge(",\n    "",\n)'''
          if text.count(old) != 1:
              raise RuntimeError(f"adapter helper boundary mismatch: {text.count(old)}")
          text = text.replace(old, new, 1)
          old_condition = '''    && correspondences.every((pair) => (pair.region === "hip" || pair.region === "waist") && pair.neutralPlacement)'''
          new_condition = '''    && correspondences.every((pair) => pair.region === "hip" || pair.region === "waist")'''
          if text.count(old_condition) != 1:
              raise RuntimeError(f"lower-shell condition mismatch: {text.count(old_condition)}")
          path.write_text(text.replace(old_condition, new_condition, 1), encoding="utf-8")
          PY
          python3 scripts/apply-prompt11-0-1-stabilization.py
          python3 scripts/apply-prompt11-0-1-friction.py
          python3 scripts/apply-prompt11-0-1-inelastic.py
          python3 scripts/apply-prompt11-0-1-phase-switch.py
          python3 scripts/apply-prompt11-0-1-post-body-structural.py
          python3 scripts/apply-prompt11-0-1-cfl-velocity.py
          python3 scripts/apply-prompt11-0-1-auto-dressing.py
          python3 scripts/apply-prompt11-0-1-body-profile.py
      - name: Typecheck
        run: npm run typecheck
      - name: Focused physics validation
        run: >-
          npx vitest run
          apps/web/src/physics/bodyCollision.test.ts
          apps/web/src/physics/bodyCollisionRegistration.test.ts
          apps/web/src/physics/XpbdWorkerState.test.ts
          apps/web/src/physics/xpbdBodyCollisionCanonical.test.ts
          apps/web/src/physics/bodyCollisionStabilizationFinal.test.ts
          --reporter=verbose
      - name: Diff check
        run: git diff --check
      - name: Record candidate
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "--- runtime diff stat ---"
            git diff --stat
            echo "--- runtime diff ---"
            git diff -- apps/web/src/physics/BodyCollisionRegistration.ts apps/web/src/physics/GarmentXpbdAdapter.ts apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/viewport/GlobalThreeViewport.ts apps/web/src/viewport/GarmentViewport.tsx
          } > artifacts/recovery-11-0-1-final-candidate.txt
          git config user.name "Moldeon Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/recovery-11-0-1-final-candidate.txt
          git commit -m "chore: record Prompt 11.0.1 final candidate" || true
          git push origin HEAD:recovery/11.0.1-body-collision-stabilization
