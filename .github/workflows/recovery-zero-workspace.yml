name: Recovery 11.0.1 Browser Smoke Diagnostic

on:
  push:
    branches:
      - recovery/11.0.1-body-collision-stabilization
    paths:
      - .github/workflows/recovery-zero-workspace.yml
      - artifacts/recovery-11-0-1-trigger.txt

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.1-body-collision-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply already-validated final candidate
        run: |
          python3 scripts/apply-prompt11-0-1-final.py
          python3 scripts/apply-prompt11-0-1-final-tests.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser diagnostic
        shell: bash
        run: |
          set +e
          cat > /tmp/browser-diagnostic.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', error => pageErrors.push(String(error)));
            await page.goto('http://127.0.0.1:5173', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2500);
            const physics = page.locator('aside[aria-label="Diagnóstico físico DEV"]');
            const physicsCount = await physics.count();
            if (physicsCount) await physics.first().waitFor({ state: 'visible', timeout: 30000 });
            const pauseCountBefore = await page.getByRole('button', { name: 'Pausar' }).count();
            const continueCountBefore = await page.getByRole('button', { name: 'Continuar' }).count();
            if (pauseCountBefore) {
              await page.getByRole('button', { name: 'Pausar' }).first().click();
              await page.waitForTimeout(700);
            }
            const pauseCountAfter = await page.getByRole('button', { name: 'Pausar' }).count();
            const continueCountAfter = await page.getByRole('button', { name: 'Continuar' }).count();
            const metricKeys = ['physicsStep','Body contacts','Max penetration mm','Max body correction mm','Friction contacts','seamMeanErrorMm','seamMaxErrorMm'];
            async function readMetrics() {
              if (!physicsCount) return {};
              return await physics.first().evaluate((root, keys) => {
                const result = {};
                for (const dt of [...root.querySelectorAll('dt')]) {
                  const name = (dt.textContent || '').trim();
                  if (!keys.includes(name)) continue;
                  result[name] = (dt.nextElementSibling?.textContent || '').trim();
                }
                return result;
              }, metricKeys);
            }
            const before = await readMetrics();
            const toggle = physicsCount ? physics.first().getByLabel('Show body colliders') : null;
            const toggleCount = toggle ? await toggle.count() : 0;
            let initialChecked = null;
            let after = before;
            if (toggleCount === 1) {
              initialChecked = await toggle.isChecked();
              await toggle.setChecked(!initialChecked);
              await page.waitForTimeout(700);
              after = await readMetrics();
            }
            const result = {
              physicsCount,
              pauseCountBefore,
              continueCountBefore,
              pauseCountAfter,
              continueCountAfter,
              toggleCount,
              initialChecked,
              before,
              after,
              invariant: JSON.stringify(before) === JSON.stringify(after),
              consoleErrors,
              pageErrors,
              bodyTextLength: (await page.locator('body').innerText()).length,
            };
            console.log('P1101_BROWSER_DIAGNOSTIC ' + JSON.stringify(result));
            await browser.close();
          })().catch(error => {
            console.error('P1101_BROWSER_DIAGNOSTIC_ERROR', error);
            process.exit(2);
          });
          NODE
          npm run dev:fallback -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          VITE_PID=$!
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" = "1" ]; then
            node /tmp/browser-diagnostic.cjs > /tmp/browser.log 2>&1
            BROWSER=$?
          else
            BROWSER=3
            echo "vite-not-ready" > /tmp/browser.log
          fi
          kill $VITE_PID 2>/dev/null || true
          wait $VITE_PID 2>/dev/null || true
          git restore package-lock.json package.json 2>/dev/null || true
          git diff --check > /tmp/diff.log 2>&1
          DIFF=$?
          set -e
          mkdir -p artifacts
          {
            echo "HEAD=$(git rev-parse HEAD) READY=$READY BROWSER_EXIT=$BROWSER DIFF_EXIT=$DIFF"
            echo "--- browser ---"; cat /tmp/browser.log
            echo "--- vite ---"; tail -n 120 /tmp/vite.log
            echo "--- diff ---"; cat /tmp/diff.log
          } > artifacts/recovery-11-0-1-browser-diagnostic.txt
          cat artifacts/recovery-11-0-1-browser-diagnostic.txt
          git config user.name "Moldeon Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/recovery-11-0-1-browser-diagnostic.txt
          git commit -m "chore: record Prompt 11.0.1 browser diagnostic"
          git push origin HEAD:recovery/11.0.1-body-collision-stabilization
