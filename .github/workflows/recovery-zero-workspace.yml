name: Recovery 11.0.1 Final Patch Diagnostic

on:
  push:
    branches:
      - recovery/11.0.1-body-collision-stabilization
    paths:
      - .github/workflows/recovery-zero-workspace.yml
      - artifacts/recovery-11-0-1-trigger.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.1-body-collision-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Apply scripts with status capture
        shell: bash
        run: |
          set +e
          : > /tmp/patch.log
          : > /tmp/status.log
          python3 - <<'PY' >> /tmp/patch.log 2>&1
          from pathlib import Path
          path = Path("scripts/apply-prompt11-0-1-stabilization.py")
          text = path.read_text(encoding="utf-8")
          old = '''    "function selectInstanceSupportVertices(",\n    "export function xpbdInitializationTransferables",\n    "export function xpbdInitializationTransferables",\n)'''
          new = '''    "function selectInstanceSupportVertices(",\n    "function appendEdge(",\n    "",\n)'''
          if text.count(old) != 1: raise RuntimeError(f"adapter helper boundary mismatch: {text.count(old)}")
          text = text.replace(old, new, 1)
          old_condition = '''    && correspondences.every((pair) => (pair.region === "hip" || pair.region === "waist") && pair.neutralPlacement)'''
          new_condition = '''    && correspondences.every((pair) => pair.region === "hip" || pair.region === "waist")'''
          if text.count(old_condition) != 1: raise RuntimeError(f"lower-shell condition mismatch: {text.count(old_condition)}")
          path.write_text(text.replace(old_condition, new_condition, 1), encoding="utf-8")

          dressing = Path("scripts/apply-prompt11-0-1-auto-dressing.py")
          dressing_text = dressing.read_text(encoding="utf-8")
          marker = "applyBodyContactVelocities(state.velocities, state.body);"
          if dressing_text.count(marker) != 2:
              raise RuntimeError(f"auto dressing velocity marker mismatch: {dressing_text.count(marker)}")
          dressing.write_text(dressing_text.replace(marker, "applyBodyContactVelocities(state.velocities, state.body, dt);"), encoding="utf-8")
          PY
          FIX=$?
          for entry in \
            "stabilization:scripts/apply-prompt11-0-1-stabilization.py" \
            "friction:scripts/apply-prompt11-0-1-friction.py" \
            "inelastic:scripts/apply-prompt11-0-1-inelastic.py" \
            "phase:scripts/apply-prompt11-0-1-phase-switch.py" \
            "poststruct:scripts/apply-prompt11-0-1-post-body-structural.py" \
            "cfl:scripts/apply-prompt11-0-1-cfl-velocity.py" \
            "dressing:scripts/apply-prompt11-0-1-auto-dressing.py" \
            "profile:scripts/apply-prompt11-0-1-body-profile.py"; do
            NAME="${entry%%:*}"; SCRIPT="${entry#*:}"
            python3 "$SCRIPT" >> /tmp/patch.log 2>&1
            CODE=$?
            echo "$NAME=$CODE" >> /tmp/status.log
            if [ "$CODE" -ne 0 ]; then break; fi
          done
          npm run typecheck > /tmp/type.log 2>&1
          TYPE=$?
          set -e
          mkdir -p artifacts
          {
            echo "HEAD=$(git rev-parse HEAD) FIX=$FIX TYPE=$TYPE"
            cat /tmp/status.log 2>/dev/null || true
            echo "--- patch log ---"; cat /tmp/patch.log
            echo "--- typecheck ---"; cat /tmp/type.log
            echo "--- stat ---"; git diff --stat
          } > artifacts/recovery-11-0-1-final-patch-diagnostic.txt
          cat artifacts/recovery-11-0-1-final-patch-diagnostic.txt
          git restore apps/web/src/physics/BodyCollisionRegistration.ts apps/web/src/physics/GarmentXpbdAdapter.ts apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/viewport/GlobalThreeViewport.ts apps/web/src/viewport/GarmentViewport.tsx scripts/apply-prompt11-0-1-stabilization.py scripts/apply-prompt11-0-1-auto-dressing.py
          git config user.name "Moldeon Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/recovery-11-0-1-final-patch-diagnostic.txt
          git commit -m "chore: record Prompt 11.0.1 final patch diagnostic" || true
          git push origin HEAD:recovery/11.0.1-body-collision-stabilization
          exit 0
