name: Recovery 11.0.1 Lower Shell Fit Audit

on:
  push:
    branches:
      - recovery/11.0.1-body-collision-stabilization
    paths:
      - artifacts/recovery-11-0-1-trigger.txt
      - .github/workflows/recovery-zero-workspace.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.1-body-collision-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Measure lower shell fit
        shell: bash
        run: |
          set +e
          npx vitest run apps/web/src/physics/bodyLowerShellFitAudit.test.ts --reporter=verbose > /tmp/audit.log 2>&1
          STATUS=$?
          set -e
          mkdir -p artifacts
          {
            echo "HEAD=$(git rev-parse HEAD) STATUS=$STATUS"
            cat /tmp/audit.log
          } > artifacts/recovery-11-0-1-fit-audit.txt
          cat artifacts/recovery-11-0-1-fit-audit.txt
          git config user.name "Moldeon Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/recovery-11-0-1-fit-audit.txt
          git commit -m "chore: record Prompt 11.0.1 lower shell fit audit" || true
          git push origin HEAD:recovery/11.0.1-body-collision-stabilization
          exit "$STATUS"
