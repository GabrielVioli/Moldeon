name: recovery-11-0-5-panel-seam-coupling

on:
  push:
    branches:
      - recovery/11.0.5-exact-human-surface-contact

permissions:
  contents: write

jobs:
  candidate:
    if: "github.event.head_commit.message == 'chore(11.0.5): stage rigid panel seam coupling'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.5-exact-human-surface-contact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - name: Build rigid panel seam-coupling candidate
        shell: bash
        run: |
          git show --format= de0d6aaee5cb241e8162462d4872f023a82dba16 -- \
            apps/web/src/physics/bodyCollision.ts \
            apps/web/src/physics/xpbd.ts \
            apps/web/src/physics/bodyCollisionExact.test.ts | git apply -
          python <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/physics/bodyCollision.ts')
          s = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          one(
            '  const rigidPanels = buildInitialRigidPanels(positions.length / 3, clothTriangles);\n  const seamTargets = captureInitialSeamDistances(original, clothSeams);',
            '  const rigidPanels = buildInitialRigidPanels(positions.length / 3, clothTriangles);\n  const panelByParticle = buildInitialPanelIndex(positions.length / 3, rigidPanels);\n  const seamTargets = captureInitialSeamDistances(original, clothSeams);',
            'panel map',
          )
          one(
            '      projectInitialSeams(positions, clothSeams, seamTargets, inverseMasses, sweepCorrectionLimit);\n      projectInitialRigidPanels(original, positions, rigidPanels);',
            '      projectInitialPanelSeams(positions, clothSeams, seamTargets, rigidPanels, panelByParticle, sweepCorrectionLimit);\n      projectInitialRigidPanels(original, positions, rigidPanels);',
            'panel seam call',
          )

          marker = 'function projectInitialSeams(positions: Float32Array, seams: BodyInitialSeamConstraints, targets: Float64Array, inverseMasses: Float32Array | undefined, limit: number): void {'
          helpers = r'''function buildInitialPanelIndex(
            particleCount: number,
            panels: readonly (readonly number[])[],
          ): Int32Array {
            const panelByParticle = new Int32Array(particleCount);
            panelByParticle.fill(-1);
            for (let panel = 0; panel < panels.length; panel += 1) {
              for (const particle of panels[panel]) {
                if (particle < particleCount) panelByParticle[particle] = panel;
              }
            }
            return panelByParticle;
          }

          function initialSeamSidePanel(
            seams: BodyInitialSeamConstraints,
            seam: number,
            side: 0 | 1,
            panelByParticle: Int32Array,
          ): number {
            const base = seam * 4 + side * 2;
            let panel = -1;
            for (let slot = 0; slot < 2; slot += 1) {
              const particle = seams.indices[base + slot];
              if (particle === INITIAL_SEAM_MISSING_PARTICLE || particle >= panelByParticle.length) continue;
              const candidate = panelByParticle[particle];
              if (candidate < 0) continue;
              if (panel < 0) panel = candidate;
              else if (panel !== candidate) return -1;
            }
            return panel;
          }

          function projectInitialPanelSeams(
            positions: Float32Array,
            seams: BodyInitialSeamConstraints,
            targets: Float64Array,
            panels: readonly (readonly number[])[],
            panelByParticle: Int32Array,
            limit: number,
          ): void {
            const corrections = new Float64Array(panels.length * 3);
            const correctionWeights = new Float64Array(panels.length);
            for (let seam = 0; seam < targets.length; seam += 1) {
              const panelA = initialSeamSidePanel(seams, seam, 0, panelByParticle);
              const panelB = initialSeamSidePanel(seams, seam, 1, panelByParticle);
              if (panelA < 0 || panelB < 0 || panelA === panelB) continue;
              const anchors = initialSeamAnchors(positions, seams, seam);
              const dx = anchors.b[0] - anchors.a[0];
              const dy = anchors.b[1] - anchors.a[1];
              const dz = anchors.b[2] - anchors.a[2];
              const length = Math.hypot(dx, dy, dz);
              if (length <= EPSILON) continue;
              const error = length - targets[seam];
              if (Math.abs(error) <= INITIAL_DEPENETRATION_EPSILON_M) continue;
              const correctionM = Math.min(limit * 2, Math.abs(error)) * 0.5 * Math.sign(error);
              const nx = dx / length;
              const ny = dy / length;
              const nz = dz / length;
              const a = panelA * 3;
              const b = panelB * 3;
              corrections[a] += nx * correctionM;
              corrections[a + 1] += ny * correctionM;
              corrections[a + 2] += nz * correctionM;
              corrections[b] -= nx * correctionM;
              corrections[b + 1] -= ny * correctionM;
              corrections[b + 2] -= nz * correctionM;
              correctionWeights[panelA] += 1;
              correctionWeights[panelB] += 1;
            }
            for (let panel = 0; panel < panels.length; panel += 1) {
              const weight = correctionWeights[panel];
              if (weight <= 0) continue;
              const base = panel * 3;
              let dx = corrections[base] / weight;
              let dy = corrections[base + 1] / weight;
              let dz = corrections[base + 2] / weight;
              const magnitude = Math.hypot(dx, dy, dz);
              if (magnitude <= INITIAL_DEPENETRATION_EPSILON_M) continue;
              if (magnitude > limit) {
                const scale = limit / magnitude;
                dx *= scale; dy *= scale; dz *= scale;
              }
              for (const particle of panels[panel]) {
                const offset = particle * 3;
                positions[offset] += dx;
                positions[offset + 1] += dy;
                positions[offset + 2] += dz;
              }
            }
          }

          '''
          one(marker, helpers + marker, 'panel seam helpers')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff --stat
      - name: Publish WIP candidate
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/physics/bodyCollisionExact.test.ts
          git rm -- .github/workflows/recovery-11-0-5-panel-seam-coupling.yml
          git commit -m "wip(11.0.5): couple sewn panels as rigid bodies"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
      - name: Focused tests
        id: focused
        continue-on-error: true
        run: npm run test --workspace @moldeon/web -- bodyCollisionExact.test.ts XpbdWorkerState.test.ts exactBodyGarmentGate.test.ts
      - name: Clean failed candidate
        if: steps.focused.outcome != 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-commit "${{ steps.publish.outputs.candidate_sha }}"
          git rm -f --ignore-unmatch -- .github/workflows/recovery-11-0-5-panel-seam-coupling.yml
          git diff --cached --check
          git commit -m "revert(11.0.5): restore pre-rigid-seam-coupling state"
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
          exit 1
      - name: Typecheck
        if: steps.focused.outcome == 'success'
        run: npm run typecheck --workspace @moldeon/web
      - name: Build
        if: steps.focused.outcome == 'success'
        run: npm run build --workspace @moldeon/web
