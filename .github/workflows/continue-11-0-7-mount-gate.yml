name: Continue 11.0.7 Mount Gate
on:
  push:
    branches: [automation/11-0-7-mount-gate]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.7-canonical-3d-arrangement-workspace
          fetch-depth: 0
      - name: Apply scoped patch and inspect controls
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c91b816a5bb8eee0cdbd56fafd55a5be114ce632
          git fetch origin automation/11-0-7-mount-gate
          git show origin/automation/11-0-7-mount-gate:apps/web/src/avatar/BodySurfaceQuery.ts > apps/web/src/avatar/BodySurfaceQuery.ts
          git show origin/automation/11-0-7-mount-gate:scripts/apply-11-0-7-mount-patch.py > /tmp/patch.py
          sed -i 's/function createArrangementCandidateMarker(): THREE.Mesh {/function createArrangementCandidateMarker(): THREE.Group {/' apps/web/src/viewport/GlobalThreeViewport.ts
          python /tmp/patch.py
          sed -i 's/function createArrangementCandidateMarker(): THREE.Group {/function createArrangementCandidateMarker(): THREE.Mesh {/' apps/web/src/viewport/GlobalThreeViewport.ts
          python - <<'PY'
          from pathlib import Path
          p = Path("apps/web/src/viewport/ArrangementWorkspace.ts")
          s = p.read_text(); old = "const correction = surface.addScaledVector(normal, clearanceM).sub(desired);"; new = "const signedAtCrossing = desired.clone().sub(surface).dot(normal);\n              const correction = normal.clone().multiplyScalar(clearanceM - signedAtCrossing);"; assert s.count(old) == 1; p.write_text(s.replace(old,new))
          p = Path("apps/web/src/App.tsx"); s=p.read_text(); old="  useEffect(() => {\n    const handleShortcut = (event: KeyboardEvent) => {\n  useEffect(() => {\n    const handleShortcut = (event: KeyboardEvent) => {"; new="  useEffect(() => {\n    const handleShortcut = (event: KeyboardEvent) => {"; assert s.count(old)==1; p.write_text(s.replace(old,new))
          p=Path("apps/web/src/viewport/GarmentViewport.tsx"); s=p.read_text(); old='{displayMode === "full-fitting" ? <div className="viewport-simulation-controls"      {displayMode === "full-fitting" ? <div className="viewport-simulation-controls" aria-label="Controles da simulação">'; new='{displayMode === "full-fitting" ? <div className="viewport-simulation-controls" aria-label="Controles da simulação">'; assert s.count(old)==1; p.write_text(s.replace(old,new))
          PY
          echo '--- arrangement control JSX ---'
          grep -n -A120 -B20 'viewport-arrangement-controls' apps/web/src/viewport/GarmentViewport.tsx
          echo '--- arrangement-related class names ---'
          grep -nE 'axis|gizmo|arrangement-' apps/web/src/viewport/GarmentViewport.tsx | head -120
