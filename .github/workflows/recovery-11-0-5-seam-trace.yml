name: recovery-11-0-5 seam trace

on:
  push:
    branches:
      - recovery/11.0.5-exact-human-surface-contact

permissions:
  contents: write

jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.5-exact-human-surface-contact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - run: npm ci
      - name: Instrument pre-step seam state in runner only
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/src/physics/exactBodyGarmentGate.test.ts')
          text = path.read_text(encoding='utf-8')
          old = '''      for (let step = 0; step < 8 && !state.invalid; step += 1) stepXpbd(state);\n      const diagnostics = measureXpbdDiagnostics(state);\n'''
          new = '''      const preStepDiagnostics = measureXpbdDiagnostics(state);\n      console.log("P1105_PRE_STEP", JSON.stringify({\n        template,\n        seamErrorAverage: preStepDiagnostics.seamErrorAverage,\n        seamErrorMaximum: preStepDiagnostics.seamErrorMaximum,\n        stretchMax: preStepDiagnostics.structuralStretchMaxRatio,\n        compressionMin: preStepDiagnostics.structuralCompressionMinRatio,\n        areaMin: preStepDiagnostics.triangleAreaMinRatio,\n        areaMax: preStepDiagnostics.triangleAreaMaxRatio,\n        deepOverlapCount: preStepDiagnostics.bodyDeepOverlapCount,\n        initialIntersectionCount: preStepDiagnostics.bodyInitialIntersectionCount,\n        initialDepenetrationPasses: state.body.initialDepenetrationPasses,\n        initialDepenetrationMaximumTranslationM: state.body.initialDepenetrationMaximumTranslationM,\n        initialOverlapUnresolved: state.body.initialOverlapUnresolved,\n      }));\n      for (let step = 0; step < 8 && !state.invalid; step += 1) stepXpbd(state);\n      const diagnostics = measureXpbdDiagnostics(state);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one gate loop, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
      - name: Run real garment diagnostic
        continue-on-error: true
        run: npm run test --workspace @moldeon/web -- exactBodyGarmentGate.test.ts
      - name: Remove temporary workflow
        if: always()
        run: |
          git restore -- apps/web/src/physics/exactBodyGarmentGate.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/recovery-11-0-5-seam-trace.yml
          git commit -m "chore(11.0.5): clean seam trace"
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
