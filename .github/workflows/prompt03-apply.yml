name: Prompt 03 Apply

on:
  push:
    paths:
      - scripts/prompt03-apply.mjs
      - .github/workflows/prompt03-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare verified patch runner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/prompt03-apply.mjs")
          source = path.read_text(encoding="utf-8")

          guard = '''  if (source.indexOf(before, index + before.length) >= 0) {
              throw new Error(`Trecho ambíguo: ${label}`);
            }
          '''
          if guard not in source:
              raise SystemExit("Ambiguity guard not found")
          source = source.replace(guard, "", 1)

          marker = "seam.name ?? `"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("Nested seam-name literal not found")
          end = source.find("`}</strong>", start)
          if end < 0:
              raise SystemExit("Nested seam-name literal end not found")
          replacement = 'seam.name ?? ((firstPiece?.name ?? \\"Peça ausente\\") + \\" ↔ \\" + (secondPiece?.name ?? \\"Peça ausente\\"))'
          source = source[:start] + replacement + source[end + 1:]

          dismiss_old = 'dismissKey={`${activeTool}:${mobileView}:${workspaceMode}`}'
          if dismiss_old not in source:
              raise SystemExit("Nested dismissKey literal not found")
          source = source.replace(
              dismiss_old,
              'dismissKey={activeTool + \":\" + mobileView + \":\" + workspaceMode}',
              1,
          )

          path.write_text(source, encoding="utf-8")
          PY

      - name: Apply verified patch
        run: node scripts/prompt03-apply.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit integration
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src
          git commit -m "feat: stabilize 2D editor interactions"
          git push origin main
