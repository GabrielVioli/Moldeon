name: Prompt 03 Apply

on:
  push:
    paths:
      - scripts/prompt03-apply.mjs
      - .github/workflows/prompt03-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Apply verified patch
        run: node scripts/prompt03-apply.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit integration
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src
          git commit -m "feat: stabilize 2D editor interactions"
          git push origin main
