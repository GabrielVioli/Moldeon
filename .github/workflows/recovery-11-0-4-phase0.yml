name: recovery-11.0.4-phase0

on:
  push:
    branches:
      - recovery/11.0.4-human-body-placement-scale
  pull_request:
    branches:
      - recovery/11.0.3-material-physics-integrity

permissions:
  contents: write

jobs:
  phase0-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Consolidate proven structural-island decomposition
        run: |
          if ! grep -q 'attachmentGroupIds: Set<string>' apps/web/src/garment3d/IsometricSurfaceAssembly.ts; then
            python3 scripts/recovery11_0_4_phase0_patch.py
          fi

      - name: Commit structural-island source
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- apps/web/src/garment3d/IsometricSurfaceAssembly.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/garment3d/IsometricSurfaceAssembly.ts
            git commit -m "fix(assembly): isolate attachment structural islands"
            git push origin HEAD:recovery/11.0.4-human-body-placement-scale
          fi

      - name: Diff check
        run: git diff --check origin/recovery/11.0.3-material-physics-integrity...HEAD && git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Phase 0 focused assembly and physics gates
        env:
          MOLDEON_PHASE_A_REPORT: "1"
        run: >-
          npm run test --workspace @moldeon/web --
          src/physics/phase0BandAttachmentInvariant.test.ts
          src/physics/zeroEnergyInitialDressPose.test.ts
          src/physics/canonicalStraightSkirtGate.test.ts
          src/garment3d/CoarseAssemblyDartFrame.test.ts
          src/garment3d/CoarseSeamConstraints.test.ts
          src/domain/templateAssemblySeams.test.ts
          src/patterns/canonicalSkirtDartGeometry.test.ts
