name: Prompt 6 Base Patterns

on:
  push:
    paths:
      - scripts/prompt06-apply.py
      - scripts/prompt06-audit.mjs
      - scripts/prompt06-progress.py
      - .github/workflows/prompt06-base-patterns.yml

permissions:
  contents: write

concurrency:
  group: prompt06-base-patterns-main
  cancel-in-progress: true

jobs:
  implement-test-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PROMPT06_ARTIFACT_DIR: artifacts/prompt06-base-patterns
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply implementation
        run: python scripts/prompt06-apply.py
      - name: Install dependencies
        run: npm install
      - name: Check patch
        run: git diff --check
      - name: Typecheck
        run: npm run typecheck
      - name: Generate golden snapshots
        run: npm test -- --update
      - name: Test golden snapshots and full suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium for 2D audit
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Functional and visual 2D audit
        run: |
          npm run dev:fallback --workspace @moldeon/web -- --host 127.0.0.1 --port 5190 --strictPort > /tmp/moldeon-prompt06.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 120); do
            curl --fail --silent http://127.0.0.1:5190/ >/dev/null && break
            sleep 0.5
          done
          PROMPT06_BASE_URL=http://127.0.0.1:5190 node scripts/prompt06-audit.mjs
      - name: Commit implementation and evidence
        run: |
          mkdir -p docs/evidence/prompt06-base-patterns
          cp -f artifacts/prompt06-base-patterns/* docs/evidence/prompt06-base-patterns/
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src docs/evidence/prompt06-base-patterns
          git commit -m "feat: rebuild upper-body and skirt base patterns"
          echo "IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Document research and validation
        run: |
          python scripts/prompt06-progress.py
          git add README.md docs/PATTERN_LIBRARY.md docs/progress/PROMPT_06_BASE_PATTERNS.md
          git commit -m "docs: document prompt 6 pattern construction"
      - name: Remove temporary delivery automation
        run: |
          git rm -f scripts/prompt06-apply.py scripts/prompt06-audit.mjs scripts/prompt06-progress.py .github/workflows/prompt06-base-patterns.yml
          git commit -m "chore: remove prompt 6 delivery automation"
          git push origin main
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt06-base-patterns-${{ github.sha }}
          path: artifacts/prompt06-base-patterns
          retention-days: 21
          if-no-files-found: warn
