name: Avatar Clearance Final

on:
  push:
    paths:
      - .github/workflows/avatar-clearance-final.yml

permissions:
  contents: write

concurrency:
  group: avatar-clearance-final-main
  cancel-in-progress: true

jobs:
  validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AUDIT_DIR: artifacts/avatar-clearance-final
      BASE_URL: http://127.0.0.1:4179
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Increase semantic anchor clearance and test it
        run: |
          python - <<'PY'
          from pathlib import Path
          model = Path('apps/web/src/avatar/AvatarParametricModel.ts')
          text = model.read_text(encoding='utf-8')
          replacements = {
            'horizontal, 0.014),\n    make("torso-back"': 'horizontal, 0.028),\n    make("torso-back"',
            '[-1, 0, 0], 0.014),\n    make("shoulder-left"': '[-1, 0, 0], 0.028),\n    make("shoulder-left"',
            'leftArmAxis, front, 0.012),\n    make("shoulder-right"': 'leftArmAxis, front, 0.02),\n    make("shoulder-right"',
            'rightArmAxis, front, 0.012),\n    make("arm-left"': 'rightArmAxis, front, 0.02),\n    make("arm-left"',
            'leftArmAxis, front, 0.012),\n    make("arm-right"': 'leftArmAxis, front, 0.022),\n    make("arm-right"',
            'rightArmAxis, front, 0.012),\n    make("waist-front"': 'rightArmAxis, front, 0.022),\n    make("waist-front"',
            'horizontal, 0.012),\n    make("waist-back"': 'horizontal, 0.024),\n    make("waist-back"',
            '[-1, 0, 0], 0.012),\n    make("hip-front"': '[-1, 0, 0], 0.024),\n    make("hip-front"',
            'horizontal, 0.014),\n    make("hip-back"': 'horizontal, 0.028),\n    make("hip-back"',
            '[-1, 0, 0], 0.014),\n    make("leg-left"': '[-1, 0, 0], 0.028),\n    make("leg-left"',
            'leftLegAxis, front, 0.012),\n    make("leg-right"': 'leftLegAxis, front, 0.026),\n    make("leg-right"',
            'rightLegAxis, front, 0.012),\n    make("neck"': 'rightLegAxis, front, 0.026),\n    make("neck"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Anchor replacement not found: {old}')
              text = text.replace(old, new, 1)
          model.write_text(text, encoding='utf-8')

          test = Path('apps/web/src/avatar/AvatarParametricModel.test.ts')
          test_text = test.read_text(encoding='utf-8')
          needle = '    expect(collision.proxies.length).toBeGreaterThanOrEqual(12);\n'
          addition = '''    const garmentAnchors = model.anchors.filter((anchor) => ["torso", "arm", "waist", "hip", "leg"].includes(anchor.region));\n    expect(Math.min(...garmentAnchors.map((anchor) => anchor.initialMarginM))).toBeGreaterThanOrEqual(0.022);\n'''
          if addition not in test_text:
              if needle not in test_text:
                  raise SystemExit('Avatar margin test insertion point not found')
              test_text = test_text.replace(needle, needle + addition, 1)
              test.write_text(test_text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/avatar/AvatarParametricModel.ts apps/web/src/avatar/AvatarParametricModel.test.ts
          git commit -m "fix: keep arranged garments clear of avatar surface"

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

      - name: Install temporary browser controller
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Capture final desktop and mobile dressed scenes
        run: |
          mkdir -p "$AUDIT_DIR"
          (
            cd apps/web
            npx vite --mode fallback --host 127.0.0.1 --port 4179 --strictPort
          ) > "$AUDIT_DIR/server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if curl --silent --fail "$BASE_URL" >/dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat "$AUDIT_DIR/server.log"; exit 1; fi
            sleep 0.25
          done
          curl --silent --fail "$BASE_URL" >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome', headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage', '--enable-webgl', '--ignore-gpu-blocklist', '--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
          const output = process.env.AUDIT_DIR;
          const baseURL = process.env.BASE_URL;

          async function open(page, template, mobile) {
            const errors = [];
            page.on('console', (message) => message.type() === 'error' && errors.push(message.text()));
            page.on('pageerror', (error) => errors.push(error.message));
            await page.goto(baseURL, { waitUntil: 'networkidle' });
            await page.getByRole('button', { name: 'Moldes' }).click();
            const card = page.getByRole('button', { name: template, exact: false }).first();
            await card.waitFor({ state: 'visible' });
            await card.evaluate((element) => element.click());
            await page.locator('.pattern-library-dialog').waitFor({ state: 'detached' });
            if (mobile) {
              const tab = page.getByRole('tab', { name: 'Manequim 3D' });
              await tab.waitFor({ state: 'visible' });
              await tab.evaluate((element) => element.click());
            } else {
              const dress = page.getByRole('button', { name: 'Vestir no manequim' });
              await dress.waitFor({ state: 'visible' });
              await dress.evaluate((element) => element.click());
            }
            const canvas = page.locator('canvas.three-canvas');
            await canvas.waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForTimeout(1800);
            const host = await page.locator('[data-testid="dressed-avatar-viewport"]').evaluate((element) => ({ ...element.dataset }));
            if (host.avatarVisible !== 'true' || Number(host.arrangementErrorCount ?? 0) !== 0 || errors.length) throw new Error(`${template}: invalid scene ${JSON.stringify({ host, errors })}`);
            return { canvas, host, errors };
          }

          const desktopContext = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          const desktop = await desktopContext.newPage();
          const tshirt = await open(desktop, 'Camiseta básica', false);
          await tshirt.canvas.screenshot({ path: path.join(output, 'desktop-tshirt-canvas.png') });
          await desktop.screenshot({ path: path.join(output, 'desktop-tshirt.png'), fullPage: true });
          await desktopContext.close();

          const mobileContext = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          const mobile = await mobileContext.newPage();
          const trousers = await open(mobile, 'Calça reta', true);
          const box = await trousers.canvas.boundingBox();
          if (!box || box.height < 550) throw new Error(`Calça mobile: viewport recortado ${JSON.stringify(box)}`);
          await trousers.canvas.screenshot({ path: path.join(output, 'mobile-trousers-canvas.png') });
          await mobile.screenshot({ path: path.join(output, 'mobile-trousers.png'), fullPage: true });
          await mobileContext.close();

          await browser.close();
          await fs.writeFile(path.join(output, 'audit.json'), JSON.stringify({ tshirt: tshirt.host, trousers: trousers.host, mobileBox: box }, null, 2));
          NODE
          cleanup
          trap - EXIT

      - name: Record final clearance evidence
        run: |
          mkdir -p docs/evidence/avatar-clearance-final
          cp -f "$AUDIT_DIR"/* docs/evidence/avatar-clearance-final/
          git add docs/evidence/avatar-clearance-final
          git commit -m "test: record avatar clearance evidence"

      - name: Remove temporary workflow and push
        run: |
          git rm -f .github/workflows/avatar-clearance-final.yml
          git commit -m "chore: remove avatar clearance workflow"
          git push origin main

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-clearance-final-${{ github.sha }}
          path: artifacts/avatar-clearance-final
          retention-days: 21
          if-no-files-found: warn
