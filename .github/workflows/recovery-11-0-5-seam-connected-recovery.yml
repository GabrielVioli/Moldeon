name: recovery-11-0-5 seam connected recovery

on:
  push:
    branches:
      - recovery/11.0.5-exact-human-surface-contact

permissions:
  contents: write

jobs:
  focused-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.5-exact-human-surface-contact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - run: npm ci

      - name: Make rigid recovery seam-aware
        shell: python
        run: |
          from pathlib import Path

          body_path = Path('apps/web/src/physics/bodyCollision.ts')
          body = body_path.read_text(encoding='utf-8')

          old_signature = '''export function initializeBodyDressing(\n  body: BodyCollisionRuntimeState,\n  positions: Float32Array,\n  maximumCorrectionM: number,\n  clothTriangles?: Uint32Array,\n  inverseMasses?: Float32Array,\n): void {'''
          new_signature = '''export function initializeBodyDressing(\n  body: BodyCollisionRuntimeState,\n  positions: Float32Array,\n  maximumCorrectionM: number,\n  clothTriangles?: Uint32Array,\n  inverseMasses?: Float32Array,\n  clothSeamIndices?: Uint32Array,\n): void {'''
          if body.count(old_signature) != 1:
              raise SystemExit(f'initializeBodyDressing signature count={body.count(old_signature)}')
          body = body.replace(old_signature, new_signature)

          old_recover_call = '''        clothTriangles,\n        inverseMasses,\n      );'''
          new_recover_call = '''        clothTriangles,\n        inverseMasses,\n        clothSeamIndices,\n      );'''
          if body.count(old_recover_call) != 1:
              raise SystemExit(f'recover call count={body.count(old_recover_call)}')
          body = body.replace(old_recover_call, new_recover_call)

          old_recover_signature = '''  clothTriangles: Uint32Array | undefined,\n  inverseMasses: Float32Array | undefined,\n): boolean {\n  const components = buildClothConnectedComponents(positions.length / 3, clothTriangles);'''
          new_recover_signature = '''  clothTriangles: Uint32Array | undefined,\n  inverseMasses: Float32Array | undefined,\n  clothSeamIndices: Uint32Array | undefined,\n): boolean {\n  const components = buildClothConnectedComponents(positions.length / 3, clothTriangles, clothSeamIndices);'''
          if body.count(old_recover_signature) != 1:
              raise SystemExit(f'recover signature count={body.count(old_recover_signature)}')
          body = body.replace(old_recover_signature, new_recover_signature)

          old_components_signature = '''function buildClothConnectedComponents(particleCount: number, triangles: Uint32Array | undefined): number[][] {'''
          new_components_signature = '''function buildClothConnectedComponents(\n  particleCount: number,\n  triangles: Uint32Array | undefined,\n  seamIndices: Uint32Array | undefined,\n): number[][] {'''
          if body.count(old_components_signature) != 1:
              raise SystemExit(f'components signature count={body.count(old_components_signature)}')
          body = body.replace(old_components_signature, new_components_signature)

          triangle_block = '''  if (triangles) {\n    for (let offset = 0; offset < triangles.length; offset += 3) {\n      const a = triangles[offset];\n      const b = triangles[offset + 1];\n      const c = triangles[offset + 2];\n      if (a >= particleCount || b >= particleCount || c >= particleCount) continue;\n      union(a, b);\n      union(b, c);\n    }\n  }\n  const byRoot = new Map<number, number[]>();'''
          seam_block = '''  if (triangles) {\n    for (let offset = 0; offset < triangles.length; offset += 3) {\n      const a = triangles[offset];\n      const b = triangles[offset + 1];\n      const c = triangles[offset + 2];\n      if (a >= particleCount || b >= particleCount || c >= particleCount) continue;\n      union(a, b);\n      union(b, c);\n    }\n  }\n  // Sewing constraints make separate triangulated panels one physical cloth\n  // component. STEP-0 rigid recovery must preserve those authored joins;\n  // moving each panel independently keeps its local edge metric but tears the\n  // seams and forces the dynamic XPBD solve to buy closure with stretch.\n  if (seamIndices) {\n    for (let offset = 0; offset < seamIndices.length; offset += 4) {\n      let firstParticle = -1;\n      for (let slot = 0; slot < 4 && offset + slot < seamIndices.length; slot += 1) {\n        const particle = seamIndices[offset + slot];\n        if (particle >= particleCount) continue;\n        if (firstParticle < 0) firstParticle = particle;\n        else union(firstParticle, particle);\n      }\n    }\n  }\n  const byRoot = new Map<number, number[]>();'''
          if body.count(triangle_block) != 1:
              raise SystemExit(f'triangle union block count={body.count(triangle_block)}')
          body = body.replace(triangle_block, seam_block)
          body_path.write_text(body, encoding='utf-8', newline='\n')

          xpbd_path = Path('apps/web/src/physics/xpbd.ts')
          xpbd = xpbd_path.read_text(encoding='utf-8')
          old_call = 'initializeBodyDressing(body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses);'
          new_call = 'initializeBodyDressing(body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses, state.seams.indices);'
          if xpbd.count(old_call) != 1:
              raise SystemExit(f'create-state init call count={xpbd.count(old_call)}')
          xpbd = xpbd.replace(old_call, new_call)
          old_reset = 'initializeBodyDressing(state.body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses);'
          new_reset = 'initializeBodyDressing(state.body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses, state.seams.indices);'
          if xpbd.count(old_reset) != 1:
              raise SystemExit(f'reset init call count={xpbd.count(old_reset)}')
          xpbd = xpbd.replace(old_reset, new_reset)
          xpbd_path.write_text(xpbd, encoding='utf-8', newline='\n')

          test_path = Path('apps/web/src/physics/bodyCollisionExact.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '''  it("does not propagate a deep STEP-0 overlap into a connected six-ring collision hole", () => {'''
          regression = '''  it("keeps sewn triangulated panels in one rigid STEP-0 recovery component", () => {\n    const body = runtime(6, 0, 0.00005);\n    const positions = Float32Array.from([\n      0, 0.98, -0.1,\n      0.1, 0.98, -0.1,\n      0, 0.98, 0.1,\n      0, 1.05, -0.1,\n      0.1, 1.05, -0.1,\n      0, 1.05, 0.1,\n    ]);\n    const triangles = Uint32Array.from([0, 2, 1, 3, 4, 5]);\n    const seams = Uint32Array.from([0, 1, 3, 4]);\n    const inverseMasses = new Float32Array(6).fill(1);\n    const seamDistanceBefore = Math.hypot(\n      positions[9] - positions[0],\n      positions[10] - positions[1],\n      positions[11] - positions[2],\n    );\n\n    initializeBodyDressing(body, positions, 0.035, triangles, inverseMasses, seams);\n\n    const seamDistanceAfter = Math.hypot(\n      positions[9] - positions[0],\n      positions[10] - positions[1],\n      positions[11] - positions[2],\n    );\n    expect(body.initialOverlapUnresolved).toBe(false);\n    expect(body.initialDepenetrationPasses).toBeGreaterThan(0);\n    expect(Math.abs(seamDistanceAfter - seamDistanceBefore)).toBeLessThan(2e-6);\n    expect([...body.initialOverlapGuardMask].every((value) => value === 0)).toBe(true);\n  });\n\n'''
          if test.count(marker) != 1:
              raise SystemExit(f'test marker count={test.count(marker)}')
          test = test.replace(marker, regression + marker)
          test_path.write_text(test, encoding='utf-8', newline='\n')

      - name: Diff check
        run: |
          git diff --check
          git diff --stat
          git diff -- apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/physics/bodyCollisionExact.test.ts

      - name: Focused tests
        id: focused
        continue-on-error: true
        run: npm run test --workspace @moldeon/web -- bodyCollisionExact.test.ts XpbdWorkerState.test.ts exactBodyGarmentGate.test.ts

      - name: Typecheck passing candidate
        id: typecheck
        if: steps.focused.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Publish passing fix or clean up failed experiment
        if: always()
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$FOCUSED_OUTCOME" = "success" ] && [ "$TYPECHECK_OUTCOME" = "success" ]; then
            git add -- apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/physics/bodyCollisionExact.test.ts
            git rm -- .github/workflows/recovery-11-0-5-seam-connected-recovery.yml
            git commit -m "fix(11.0.5): preserve sewn components in initial recovery"
          else
            git restore -- apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/physics/bodyCollisionExact.test.ts
            git rm -- .github/workflows/recovery-11-0-5-seam-connected-recovery.yml
            git commit -m "chore(11.0.5): clean failed seam-connected experiment"
          fi
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
          if [ "$FOCUSED_OUTCOME" != "success" ] || [ "$TYPECHECK_OUTCOME" != "success" ]; then exit 1; fi
