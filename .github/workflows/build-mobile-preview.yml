name: Build mobile preview artifact

on:
  push:
    branches:
      - "deploy/11.0.6-mobile-preview"
    paths:
      - ".github/workflows/build-mobile-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "deploy/11.0.6-mobile-preview"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Publish static preview files on temp deploy branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf preview-dist
          mkdir -p preview-dist
          cp -a apps/web/dist/. preview-dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-dist
          if git diff --cached --quiet; then
            echo "preview-dist already current"
            exit 0
          fi
          git commit -m "chore(deploy): publish mobile preview dist"
          git push origin HEAD:deploy/11.0.6-mobile-preview
