name: recovery-11-0-5 sewn fallback

on:
  push:
    branches:
      - recovery/11.0.5-exact-human-surface-contact

permissions:
  contents: write

jobs:
  focused-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.5-exact-human-surface-contact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - run: npm ci

      - name: Add seam-aware rigid attempt with constrained XPBD fallback
        shell: python
        run: |
          from pathlib import Path

          body_path = Path('apps/web/src/physics/bodyCollision.ts')
          body = body_path.read_text(encoding='utf-8')
          body = body.replace(
          '''  clothTriangles?: Uint32Array,\n  inverseMasses?: Float32Array,\n): void {''',
          '''  clothTriangles?: Uint32Array,\n  inverseMasses?: Float32Array,\n  clothSeamIndices?: Uint32Array,\n): void {''', 1)
          body = body.replace(
          '''        clothTriangles,\n        inverseMasses,\n      );''',
          '''        clothTriangles,\n        inverseMasses,\n        clothSeamIndices,\n      );''', 1)
          old_failure = '''      if (!recovered) {\n        body.structuralContactDeferred = true;\n        return;\n      }'''
          new_failure = '''      if (!recovered) {\n        // A sewn assembly can be impossible to clear by one world-space\n        // translation even though it is recoverable by the material-preserving\n        // XPBD constraints. recoverDeepInitialExactOverlap restored STEP-0, so\n        // keep every seam intact and enter the bounded zero-gravity dressing\n        // phase with ordinary exact contact active instead of installing a hole.\n        if (clothSeamIndices && clothSeamIndices.length > 0) {\n          body.initialOverlapUnresolved = false;\n        } else {\n          body.structuralContactDeferred = true;\n          return;\n        }\n      }'''
          if body.count(old_failure) != 1:
              raise SystemExit(f'failure block count={body.count(old_failure)}')
          body = body.replace(old_failure, new_failure)
          body = body.replace(
          '''  clothTriangles: Uint32Array | undefined,\n  inverseMasses: Float32Array | undefined,\n): boolean {\n  const components = buildClothConnectedComponents(positions.length / 3, clothTriangles);''',
          '''  clothTriangles: Uint32Array | undefined,\n  inverseMasses: Float32Array | undefined,\n  clothSeamIndices: Uint32Array | undefined,\n): boolean {\n  const components = buildClothConnectedComponents(positions.length / 3, clothTriangles, clothSeamIndices);''', 1)
          body = body.replace(
          'function buildClothConnectedComponents(particleCount: number, triangles: Uint32Array | undefined): number[][] {',
          '''function buildClothConnectedComponents(\n  particleCount: number,\n  triangles: Uint32Array | undefined,\n  seamIndices: Uint32Array | undefined,\n): number[][] {''', 1)
          triangle_tail = '''  if (triangles) {\n    for (let offset = 0; offset < triangles.length; offset += 3) {\n      const a = triangles[offset];\n      const b = triangles[offset + 1];\n      const c = triangles[offset + 2];\n      if (a >= particleCount || b >= particleCount || c >= particleCount) continue;\n      union(a, b);\n      union(b, c);\n    }\n  }\n  const byRoot = new Map<number, number[]>();'''
          seam_tail = '''  if (triangles) {\n    for (let offset = 0; offset < triangles.length; offset += 3) {\n      const a = triangles[offset];\n      const b = triangles[offset + 1];\n      const c = triangles[offset + 2];\n      if (a >= particleCount || b >= particleCount || c >= particleCount) continue;\n      union(a, b);\n      union(b, c);\n    }\n  }\n  if (seamIndices) {\n    for (let offset = 0; offset < seamIndices.length; offset += 4) {\n      let firstParticle = -1;\n      for (let slot = 0; slot < 4 && offset + slot < seamIndices.length; slot += 1) {\n        const particle = seamIndices[offset + slot];\n        if (particle >= particleCount) continue;\n        if (firstParticle < 0) firstParticle = particle;\n        else union(firstParticle, particle);\n      }\n    }\n  }\n  const byRoot = new Map<number, number[]>();'''
          if body.count(triangle_tail) != 1:
              raise SystemExit(f'triangle tail count={body.count(triangle_tail)}')
          body = body.replace(triangle_tail, seam_tail)
          body_path.write_text(body, encoding='utf-8', newline='\n')

          xpbd_path = Path('apps/web/src/physics/xpbd.ts')
          xpbd = xpbd_path.read_text(encoding='utf-8')
          create_call = 'initializeBodyDressing(body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses);'
          reset_call = 'initializeBodyDressing(state.body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses);'
          if xpbd.count(create_call) != 1 or xpbd.count(reset_call) != 1:
              raise SystemExit('unexpected initializeBodyDressing call count in xpbd')
          xpbd = xpbd.replace(create_call, 'initializeBodyDressing(body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses, state.seams.indices);')
          xpbd = xpbd.replace(reset_call, 'initializeBodyDressing(state.body, state.positions, state.config.maximumCorrection, state.triangles, state.inverseMasses, state.seams.indices);')
          xpbd_path.write_text(xpbd, encoding='utf-8', newline='\n')

          test_path = Path('apps/web/src/physics/bodyCollisionExact.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '  it("does not propagate a deep STEP-0 overlap into a connected six-ring collision hole", () => {'
          regression = '''  it("preserves a seam when rigid STEP-0 recovery spans triangulated panels", () => {\n    const body = runtime(6, 0, 0.00005);\n    const positions = Float32Array.from([\n      0, 0.98, -0.1, 0.1, 0.98, -0.1, 0, 0.98, 0.1,\n      0, 1.05, -0.1, 0.1, 1.05, -0.1, 0, 1.05, 0.1,\n    ]);\n    const triangles = Uint32Array.from([0, 2, 1, 3, 4, 5]);\n    const seams = Uint32Array.from([0, 1, 3, 4]);\n    const inverseMasses = new Float32Array(6).fill(1);\n    const before = Math.hypot(positions[9] - positions[0], positions[10] - positions[1], positions[11] - positions[2]);\n    initializeBodyDressing(body, positions, 0.035, triangles, inverseMasses, seams);\n    const after = Math.hypot(positions[9] - positions[0], positions[10] - positions[1], positions[11] - positions[2]);\n    expect(body.initialOverlapUnresolved).toBe(false);\n    expect(body.initialDepenetrationPasses).toBeGreaterThan(0);\n    expect(Math.abs(after - before)).toBeLessThan(2e-6);\n    expect([...body.initialOverlapGuardMask].every((value) => value === 0)).toBe(true);\n  });\n\n'''
          if test.count(marker) != 1:
              raise SystemExit(f'test marker count={test.count(marker)}')
          test = test.replace(marker, regression + marker)
          test_path.write_text(test, encoding='utf-8', newline='\n')

      - name: Diff check
        run: |
          git diff --check
          git diff --stat

      - name: Focused tests
        id: focused
        continue-on-error: true
        run: npm run test --workspace @moldeon/web -- bodyCollisionExact.test.ts XpbdWorkerState.test.ts exactBodyGarmentGate.test.ts

      - name: Typecheck passing candidate
        id: typecheck
        if: steps.focused.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Publish passing fix or clean up failed experiment
        if: always()
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$FOCUSED_OUTCOME" = "success" ] && [ "$TYPECHECK_OUTCOME" = "success" ]; then
            git add -- apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/physics/bodyCollisionExact.test.ts
            git rm -- .github/workflows/recovery-11-0-5-sewn-fallback.yml
            git commit -m "fix(11.0.5): preserve seams during initial recovery"
          else
            git restore -- apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/physics/bodyCollisionExact.test.ts
            git rm -- .github/workflows/recovery-11-0-5-sewn-fallback.yml
            git commit -m "chore(11.0.5): clean failed sewn fallback experiment"
          fi
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
          if [ "$FOCUSED_OUTCOME" != "success" ] || [ "$TYPECHECK_OUTCOME" != "success" ]; then exit 1; fi
