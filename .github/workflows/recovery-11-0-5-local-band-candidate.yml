name: recovery-11-0-5-local-band-candidate

on:
  push:
    branches:
      - recovery/11.0.5-exact-human-surface-contact

permissions:
  contents: write

jobs:
  candidate:
    if: "github.event.head_commit.message == 'chore(11.0.5): stage local-band isometric candidate'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.5-exact-human-surface-contact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - name: Reapply isometric recovery into local contact band
        shell: bash
        run: |
          git show --format= 1b06c6bd8c40a4ba95e8257068052717d0fc1816 -- \
            apps/web/src/physics/bodyCollision.ts \
            apps/web/src/physics/xpbd.ts \
            apps/web/src/physics/bodyCollisionExact.test.ts | git apply -
          python <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/physics/bodyCollision.ts')
          s = p.read_text(encoding='utf-8')
          old = 'const INITIAL_ISOMETRIC_TARGET_PENETRATION_M = 0.00025;'
          new = 'const INITIAL_ISOMETRIC_TARGET_PENETRATION_M = 0.0045;'
          if s.count(old) != 1:
              raise SystemExit(f'target constant count={s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff --stat
      - name: Publish WIP candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/physics/bodyCollisionExact.test.ts
          git rm -- .github/workflows/recovery-11-0-5-local-band-candidate.yml
          git commit -m "wip(11.0.5): recover isometrically into local contact band"
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
      - name: Add diagnostic logging for focused run
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/physics/exactBodyGarmentGate.test.ts')
          s = p.read_text(encoding='utf-8')
          old = '        invalid: diagnostics.invalid,\n        contacts: diagnostics.bodyContactCount,'
          new = '        invalid: diagnostics.invalid,\n        initialOverlapUnresolved: diagnostics.bodyInitialOverlapUnresolved,\n        initialDepenetrationPasses: diagnostics.bodyInitialDepenetrationPasses,\n        initialDepenetrationMaxTranslationMm: diagnostics.bodyInitialDepenetrationMaxTranslationMm,\n        deepOverlapCount: diagnostics.bodyDeepOverlapCount,\n        initialIntersectionCount: diagnostics.bodyInitialIntersectionCount,\n        contacts: diagnostics.bodyContactCount,'
          if s.count(old) != 1:
              raise SystemExit(f'diagnostic marker count={s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='\n')
          PY
      - name: Focused tests
        run: npm run test --workspace @moldeon/web -- bodyCollisionExact.test.ts XpbdWorkerState.test.ts exactBodyGarmentGate.test.ts
