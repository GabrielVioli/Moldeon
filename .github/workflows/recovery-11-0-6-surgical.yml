name: Recovery 11.0.6 surgical stabilization

on:
  push:
    branches:
      - "recovery/11.0.6-canonical-arrangement-2d-body"
    paths:
      - ".github/workflows/recovery-11-0-6-surgical.yml"
      - ".github/recovery-11-0-6-patch.b64"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recovery-11-0-6-surgical
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: "recovery/11.0.6-canonical-arrangement-2d-body"
          fetch-depth: 0

      - name: Verify expected surgical base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4d72a1a0b30b1b9ffdaf9a483342801380c8384a HEAD
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Apply scoped stabilization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import zlib
          from pathlib import Path
          payload = Path('.github/recovery-11-0-6-patch.b64').read_text().strip()
          Path('/tmp/apply-11-0-6.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          python3 /tmp/apply-11-0-6.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/BodyReference2D.tsx')
          text = path.read_text()
          broken = '\n**()\n * Presentation-only origin for the canonical body projection.'
          fixed = '\n/**\n * Presentation-only origin for the canonical body projection.'
          if broken not in text:
              raise SystemExit('Expected BodyReference2D comment marker was not found')
          path.write_text(text.replace(broken, fixed, 1))
          PY
          git diff --check
          if git diff --name-only | grep -E '^(apps/web/src/physics/|apps/web/src/garment3d/bodyCollision\.ts$|apps/web/src/garment3d/exactBodySurface\.ts$|apps/web/src/garment3d/xpbd\.ts$)'; then
            echo 'Forbidden physics change detected.' >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused regression tests
        run: npm test --workspace @moldeon/web -- src/domain/canonicalArrangement.test.ts src/avatar/BodyProjection2D.test.ts src/garment3d/ResolvedAssemblyInput.test.ts src/domain/assemblyHistory.test.ts

      - name: Typecheck web
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

      - name: Browser arrangement gate
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/web && npm run dev:fallback -- --host 127.0.0.1 --port 4186) >/tmp/moldeon-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4186/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/moldeon-vite.log
            exit 1
          fi
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo 'Chrome/Chromium was not found on the runner.' >&2
            exit 1
          fi
          MOLDEON_CHROME_PATH="$CHROME_PATH" MOLDEON_VERIFY_URL="http://127.0.0.1:4186/" node scripts/verify-11-0-6.mjs

      - name: Verify scope and finalize commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --name-only | grep -E '^(apps/web/src/physics/|apps/web/src/garment3d/bodyCollision\.ts$|apps/web/src/garment3d/exactBodySurface\.ts$|apps/web/src/garment3d/xpbd\.ts$)'; then
            echo 'Forbidden physics change detected.' >&2
            exit 1
          fi
          rm -f .github/recovery-11-0-6-patch.b64 .github/workflows/recovery-11-0-6-surgical.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          if git diff --cached --name-only | grep -E '^(apps/web/src/physics/|apps/web/src/garment3d/bodyCollision\.ts$|apps/web/src/garment3d/exactBodySurface\.ts$|apps/web/src/garment3d/xpbd\.ts$)'; then
            echo 'Forbidden physics change staged.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "fix(11.0.6): stabilize explicit panel arrangement"
          git push origin HEAD:recovery/11.0.6-canonical-arrangement-2d-body
