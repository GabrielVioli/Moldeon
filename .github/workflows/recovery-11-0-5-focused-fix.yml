name: recovery-11-0-5 focused fix

on:
  push:
    branches:
      - recovery/11.0.5-exact-human-surface-contact

permissions:
  contents: write

concurrency:
  group: recovery-11-0-5-focused-fix
  cancel-in-progress: false

jobs:
  focused-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.5-exact-human-surface-contact
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm

      - run: npm ci

      - name: Separate exact STEP-0 recovery from dynamic contact
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/src/physics/bodyCollision.ts')
          text = path.read_text(encoding='utf-8')
          old = '''  if (maximumPenetrationM <= EPSILON) return;\n\n  // Each gross projection is capped by maximumCorrectionM. Two passes per\n  // theoretical minimum leave room for structural constraints to relax between\n  // depenetrations without a garment-specific staging duration.\n'''
          new = '''  if (maximumPenetrationM <= EPSILON) return;\n\n  // Exact-surface STEP-0 recovery is finished synchronously above. Shallow\n  // residual contact belongs to the ordinary XPBD collision solve, with the\n  // metric guard active. Keeping exact contact in legacy gross-dressing mode\n  // would suspend metric validation while repeated local projections distort\n  // an otherwise rigidly recovered component.\n  if (body.exactSurface) return;\n\n  // Legacy proxy contact still uses bounded gross dressing. Each projection is\n  // capped by maximumCorrectionM; two passes per theoretical minimum leave room\n  // for structural constraints to relax between depenetrations.\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one initializeBodyDressing target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

      - name: Diff check
        run: |
          git diff --check
          git diff -- apps/web/src/physics/bodyCollision.ts

      - name: Focused tests
        id: focused
        continue-on-error: true
        run: npm run test --workspace @moldeon/web -- bodyCollisionExact.test.ts XpbdWorkerState.test.ts exactBodyGarmentGate.test.ts

      - name: Publish passing fix or clean up failed experiment
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$FOCUSED_OUTCOME" = "success" ]; then
            git add -- apps/web/src/physics/bodyCollision.ts
            git rm -- .github/workflows/recovery-11-0-5-focused-fix.yml
            git commit -m "fix(11.0.5): hand exact recovery back to XPBD"
          else
            git restore -- apps/web/src/physics/bodyCollision.ts
            git rm -- .github/workflows/recovery-11-0-5-focused-fix.yml
            git commit -m "chore(11.0.5): clean failed focused experiment"
          fi
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
          if [ "$FOCUSED_OUTCOME" != "success" ]; then exit 1; fi
