name: Prompt 9 Avatar Assembly Finalization

on:
  push:
    paths:
      - scripts/prompt09-mobile-layout.py
      - scripts/prompt09-browser-audit.mjs
      - .github/workflows/prompt09-avatar-assembly.yml

permissions:
  contents: write

concurrency:
  group: prompt09-avatar-main
  cancel-in-progress: true

jobs:
  validate-audit-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROMPT09_ARTIFACT_DIR: artifacts/prompt09-avatar-assembly
      PROMPT09_BASE_URL: http://127.0.0.1:4179
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply mobile viewport correction
        run: python scripts/prompt09-mobile-layout.py
      - name: Install dependencies
        run: npm ci
      - name: Check patch
        run: git diff --check
      - name: Enforce dressed-avatar source policy
        run: |
          if grep -R -n -E 'showBody|setBodyVisible|setExploded|Explodida' \
            apps/web/src/App.tsx \
            apps/web/src/viewport/GarmentViewport.tsx \
            apps/web/src/viewport/GlobalThreeViewport.ts; then
            echo "Forbidden public 3D mode remains"
            exit 1
          fi
          if grep -n -E 'wrapAsTube|placementBasePosition|toLocaleLowerCase' apps/web/src/garment3d/GarmentAssembly.ts; then
            echo "Forbidden generic placement path remains"
            exit 1
          fi
          test ! -e apps/web/src/viewport/ThreeViewport.ts
          test ! -e apps/web/src/viewport/ThreeViewport.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Run frontend suite
        run: npm test
      - name: Build fallback application
        run: npm run build
      - name: Install browser controller
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Audit dressed avatar on desktop and mobile
        run: |
          mkdir -p "$PROMPT09_ARTIFACT_DIR"
          (
            cd apps/web
            npx vite --mode fallback --host 127.0.0.1 --port 4179 --strictPort
          ) > "$PROMPT09_ARTIFACT_DIR/server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if curl --silent --fail "$PROMPT09_BASE_URL" >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$PROMPT09_ARTIFACT_DIR/server.log"
              exit 1
            fi
            sleep 0.25
          done
          curl --silent --fail "$PROMPT09_BASE_URL" >/dev/null
          node scripts/prompt09-browser-audit.mjs
          cleanup
          trap - EXIT
      - name: Commit mobile layout and visual evidence
        run: |
          mkdir -p docs/evidence/prompt09-avatar-assembly
          cp -f artifacts/prompt09-avatar-assembly/* docs/evidence/prompt09-avatar-assembly/
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/styles.css docs/evidence/prompt09-avatar-assembly
          git commit -m "fix: preserve dressed avatar viewport on mobile"
      - name: Remove temporary Prompt 9 automation and push
        run: |
          git rm -f \
            scripts/prompt09-mobile-layout.py \
            scripts/prompt09-browser-audit.mjs \
            .github/workflows/prompt09-avatar-assembly.yml
          git commit -m "chore: remove prompt 9 finalization automation"
          git push origin main
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt09-avatar-assembly-${{ github.sha }}
          path: artifacts/prompt09-avatar-assembly
          retention-days: 21
          if-no-files-found: warn
