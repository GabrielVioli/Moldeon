name: Prompt 03 Finalize

on:
  push:
    paths:
      - scripts/prompt03-finalize.mjs
      - scripts/prompt03-write-progress.mjs
      - .github/workflows/prompt03-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROMPT03_ARTIFACT_DIR: artifacts/prompt03-editor
      PROMPT03_LABEL: fallback
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Apply final editor patch
        run: node scripts/prompt03-finalize.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run functional and visual audit
        run: |
          npm run dev:fallback --workspace @moldeon/web -- --host 127.0.0.1 --port 5184 --strictPort > /tmp/moldeon-prompt03-final.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 120); do
            curl --fail --silent http://127.0.0.1:5184/ >/dev/null && break
            sleep 0.5
          done
          PROMPT03_BASE_URL=http://127.0.0.1:5184 node scripts/prompt03-interaction-audit.mjs

      - name: Publish progress and screenshots
        run: node scripts/prompt03-write-progress.mjs

      - name: Commit final implementation
        run: |
          git config user.name "Gabriel Vinicius"
          git config user.email "82556581+GabrielVioli@users.noreply.github.com"
          git add apps/web/src/editor/PatternCanvas.tsx apps/web/src/styles.css scripts/prompt03-interaction-audit.mjs README.md docs/progress/PROMPT_03_EDITOR.md docs/evidence/prompt03
          git commit -m "fix: complete reliable 2D editor interactions"
          git push origin main

      - name: Upload complete audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt03-final-${{ github.sha }}
          path: artifacts/prompt03-editor
          retention-days: 21
          if-no-files-found: warn
