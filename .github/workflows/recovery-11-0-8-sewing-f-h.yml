name: Recovery 11.0.8 sewing phases F-H

on:
  workflow_dispatch:
  push:
    branches:
      - "recovery/11.0.8-sewing-2d-3d-authoring"
    paths:
      - "scripts/apply-11-0-8-phases-f-h.py"
      - ".github/workflows/recovery-11-0-8-sewing-f-h.yml"

permissions:
  contents: write

concurrency:
  group: recovery-11-0-8-sewing-f-h
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: "recovery/11.0.8-sewing-2d-3d-authoring"
          fetch-depth: 0

      - name: Verify triggering commit is branch head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Apply phases F-H patch
        run: python3 scripts/apply-11-0-8-phases-f-h.py

      - name: Diff check
        run: git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused sewing tests
        run: npm run test --workspace @moldeon/web -- src/domain/sewingArcLengthAuthoring.test.ts src/state/assemblyHistory.test.ts src/viewport/SewingInteraction.test.ts --reporter=verbose

      - name: Production build
        run: npm run build

      - name: Commit validated phases F-H
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/state/editorStore.ts \
            apps/web/src/editor/PatternCanvasLegacy.tsx \
            apps/web/src/viewport/SewingViewportOverlay.ts \
            apps/web/src/viewport/GlobalThreeViewport.ts \
            apps/web/src/viewport/GarmentViewport.tsx \
            apps/web/src/components/AssemblyPanel.tsx \
            apps/web/src/components/Toolbar.tsx \
            apps/web/src/styles.css \
            apps/web/src/state/assemblyHistory.test.ts \
            apps/web/src/domain/sewingArcLengthAuthoring.test.ts \
            docs/modifications-11.0.8.md
          git commit -m "feat(sewing): add partial free and chain authoring"
          git push origin HEAD:recovery/11.0.8-sewing-2d-3d-authoring
