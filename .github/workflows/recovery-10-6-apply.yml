name: Recovery 10.6 finalizer

on:
  push:
    branches:
      - recovery/10.6-constraint-spatial-assembly

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/10.6-constraint-spatial-assembly
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Materialize Prompt 10.6 architecture
        run: |
          python scripts/recovery-10-6-integration.py
          python scripts/recovery-10-6-fix1.py
          python scripts/recovery-10-6-paired-copies.py
          python scripts/recovery-10-6-paired-fix.py
          python scripts/recovery-10-6-relation-frames.py
          python scripts/recovery-10-6-test-fixes.py
          python scripts/recovery-10-6-material-flat-seed.py
          python scripts/recovery-10-6-intrinsic-mode.py
          python scripts/recovery-10-6-structural-objective.py
          python scripts/recovery-10-6-frozen-legacy-candidate.py
          python scripts/recovery-10-6-doc-notes.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Prompt 10.6 garment and topology suite
        env:
          MOLDEON_10_6_REPORT: "1"
        run: |
          npx vitest run \
            apps/web/src/garment3d/constraintSpatialAssembly.test.ts \
            apps/web/src/garment3d/constraintSpatialAssembly.extended.test.ts \
            apps/web/src/garment3d/constraintSpatialAssembly.metrics.test.ts \
            apps/web/src/garment3d/constraintShortsTopology.test.ts \
            apps/web/src/domain/pairedCopySeam.test.ts \
            --reporter=verbose | tee /tmp/moldeon-10-6-metrics.log
      - name: Assembly, domain, lifecycle and rebuild regressions
        run: |
          npx vitest run \
            apps/web/src/garment3d/generalGarmentSpatialAssembly.test.ts \
            apps/web/src/garment3d/SemanticAvatarArrangement.test.ts \
            apps/web/src/garment3d/PhysicalGarmentAssembly.test.ts \
            apps/web/src/garment3d/ResolvedAssemblyInput.test.ts \
            apps/web/src/garment3d/ResolvedGarmentAssembly.test.ts \
            apps/web/src/physics/initialSeamResidual.test.ts \
            apps/web/src/physics/xpbdGarmentIntegration.test.ts \
            apps/web/src/physics/xpbdCanonicalScenes.test.ts \
            apps/web/src/physics/XpbdWorkerClient.test.ts \
            apps/web/src/domain/templateAssemblySeams.test.ts \
            apps/web/src/domain/patternDocumentV3.test.ts \
            apps/web/src/state/assemblyHistory.test.ts \
            --reporter=verbose
      - name: Prompt 10.4-A hot-loop regression benchmark
        env:
          MOLDEON_PERF_BENCH: "1"
        run: npx vitest run apps/web/src/physics/xpbdHotloopPerformance.test.ts --reporter=verbose | tee /tmp/moldeon-10-6-perf.log
      - name: Full test suite
        run: npm test | tee /tmp/moldeon-10-6-full-test.log
      - name: Build fallback application
        run: npm run build
      - name: Install Chromium for real-browser smoke
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Real-browser pants and constraint smoke
        run: |
          (cd apps/web && npx vite --mode fallback --host 127.0.0.1) > /tmp/moldeon-10-6-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          READY=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/moldeon-10-6-vite.log
            exit 1
          fi
          node scripts/recovery-10-6-browser-smoke.mjs | tee /tmp/moldeon-10-6-browser.log
      - name: Write Prompt 10.6 progress report
        run: |
          mkdir -p docs/progress
          cat > docs/progress/PROMPT_10_6_CONSTRAINT_SPATIAL_ASSEMBLY.md <<'EOF'
          # Prompt 10.6 — Constraint-Based Spatial Assembly

          ## Resultado

          Esta etapa substitui a decisão terminal baseada em casos conhecidos por uma arquitetura geral de constraints materiais. O pipeline final é:

          ```text
          PatternDocumentV3
          -> PanelInstanceV3 + SeamGroupV3
          -> GarmentSpatialConstraintGraph
          -> candidate seeds
          -> global rigid-pose solve em SE(3)
          -> initial spatial assembly
          -> XPBD
          ```

          `docs/ASSEMBLY_ARCHITECTURE.md` é o documento canônico da arquitetura resultante.

          ## Arquitetura antiga e causa dos blockers

          O assembly acumulava comportamentos úteis, porém a decisão final ainda dependia de mecanismos locais: BFS de primeira visita, agrupamento parcial por pares de painéis, seleção de tube groups e estratégias especializadas para topologias conhecidas. Isso permitia que uma pequena subestrutura fechada dominasse o garment ou que relações adicionais encontradas depois da primeira visita não reconciliasssem globalmente as poses.

          O Prompt 10.5 corrigiu a perda de múltiplas relations por par em um caso importante, mas ainda usava uma busca discreta de poses como estratégia terminal. O 10.6 transforma essas técnicas em seeds/fast paths e obriga a avaliação global do connected component.

          ## Heurísticas removidas ou rebaixadas

          Não são mais autoridade final:

          - planar fallback;
          - BFS first-visit;
          - primary tube selection;
          - small upper band/tube como núcleo obrigatório;
          - `multipanel-surface-shell` do 10.5 como solução terminal;
          - uma única seam escolhida para orientar um painel com várias relações.

          Embeddings analíticos isométricos continuam válidos como subestruturas/candidates. Uma solução 10.5 já validada também compete intacta no objective; ela só vence quando é realmente melhor que as novas seeds.

          ## Constraint graph

          `GarmentSpatialConstraintGraph` é um multigrafo material. Nodes são `PanelInstanceV3`. Cada relation preserva individualmente SeamGroup, EdgeRanges, samples por arc-length, progress, comprimentos, tratamento, target ratio, slack, direção same/opposite, tangentes materiais locais, orientação lateral do boundary, classificação de residual e relevância estrutural.

          Duas SeamGroups A↔B continuam duas relations. Não há deduplicação pelo par de PanelInstances.

          O graph calcula connected components, relações paralelas e cycle rank independente. Free boundaries não são convertidas em seams.

          ## Pose solver

          Cada painel possui uma pose rígida `T_i ∈ SE(3)` com quaternion + translação. Um anchor determinístico remove apenas o gauge global.

          O solver usa rigid best-fit ponderado do tipo Horn/Kabsch em iterações alternadas. Para cada painel são usadas simultaneamente todas as correspondências estruturais com vizinhos. Tangentes entram como pseudo-correspondências ao redor do midpoint da seam. As poses são amortecidas e avaliadas globalmente.

          Candidate seeds incluem:

          - embedding geométrico existente intacto;
          - embedding existente reconciliado;
          - estado material plano;
          - duas hipóteses diedrais determinísticas baseadas no graph.

          A seleção usa residual material normalizado, overlap/collapse grosseiro, penalidade de planaridade somente quando a topologia suporta shell e distorção intrínseca. Não há pré-simulação de cloth escondida.

          ## Underconstrained seams

          Uma seam reta isolada continua sendo uma hinge subdeterminada. O solver não inventa 90°, frente/costas ou cilindro. Um component realmente sem informação suficiente pode permanecer aberto. Cycles e múltiplas relations fornecem constraints adicionais quando existem.

          ## Multiple relations A↔B

          O teste P0 mantém duas ou mais relations independentes entre o mesmo par. Lateral e seam superior influenciam simultaneamente a pose. A representação interna inclui SeamGroup + ranges concretos, não apenas `(A,B)`.

          ## Calça, shorts e o gancho

          A investigação revelou um blocker de domínio além do solver: o molde de calça já possuía `frontCrotch` e `backCrotch`, mas o sistema gerava automaticamente apenas laterais e entrepernas. Além disso, a validação tratava a mesma faixa material como self-seam inválida mesmo quando ela deveria unir duas cópias físicas da mesma definição.

          Foi adicionado `physicalPairing: "paired-copies"` a Seam/SeamGroupV3. Ele representa uma relação material entre duas `PanelInstanceV3` distintas originadas da mesma `PatternDefinitionV3`. A validação exige pelo menos duas cópias físicas.

          O template de calça agora persiste:

          - lateral/outseam;
          - entrepernas/inseam;
          - fechamento do gancho frontal entre as duas cópias da frente;
          - fechamento do gancho traseiro entre as duas cópias das costas.

          As pences continuam como `local-shaping-closure`. Elas são diagnosticadas, mas não dominam o objective rígido global; o XPBD fecha/deforma localmente.

          O solver não contém condição para `pants`, `shorts`, `crotch`, frente ou costas. O teste de shorts encurta geometricamente o mesmo garment e usa exatamente o mesmo graph/solver.

          ## Repuxo e responsabilidade do XPBD

          Relations incompatíveis não são zeradas esticando o painel. O assembly encontra o melhor conjunto de poses rígidas e deixa residual legítimo. O teste G14 confirma que a geometria intrínseca permanece preservada e que o XPBD reduz o residual por deformação física.

          ```text
          ASSEMBLY = estrutura espacial e best-fit rígido
          XPBD     = tensão, repuxo, ease, gather e deformação
          ```

          ## Real garment / topology suite

          A bateria cobre:

          - G1 self-seam rectangle/tube;
          - G2 dois painéis com relações paralelas;
          - G3 ciclo fechado de quatro painéis;
          - G4/G5 torso/shell com laterais, seams superiores, curvas e free boundaries;
          - G6 body + band;
          - G7 local closure/dart;
          - G8 múltiplas seams A↔B;
          - G9 N↔M composite seam;
          - G10 open chain;
          - G11 remoção de seam;
          - G12 asymmetric/order-independent topology;
          - G13 curved material boundaries/tangents;
          - G14 incompatible distant seam/repuxo;
          - G15 body + duas bands independentes;
          - calça paramétrica real com quatro PanelInstances, laterais, entrepernas, gancho frontal, gancho traseiro e pences;
          - topology de shorts derivada da calça, sem regra especial;
          - A→B→A e lifecycle/rebuild;
          - same/opposite;
          - free boundaries;
          - adapter/Worker correspondence;
          - undo/redo e assembly history pela suíte global existente.

          ## Before / after representativo

          Valores do runner Linux determinístico. `Old` é o estado geométrico anterior ao solver global; `New` é o candidate escolhido pelo 10.6.

          | Fixture | Old mean/max | New mean/max | Non-planarity | Coarse overlap | assemblySolveMs |
          | --- | ---: | ---: | ---: | ---: | ---: |
          | curved four-panel shell | 16.67 / 43.95 mm | 10.26 / 27.37 mm | 1.491 rad | 0.256 | ~164 ms |
          | body + upper band | 16.63 / 76.39 mm | 16.63 / 76.39 mm | 1.571 rad | 0.000 | ~225 ms |
          | straight pants | 36.06 / 75.74 mm | 24.35 / 96.28 mm | 1.354 rad | 0.543 | ~250 ms |

          Na calça, o residual médio global cai fortemente. O pico STEP 0 desloca-se para uma região localizada do gancho em vez de uma separação estrutural de centenas/milhares de mm. O XPBD reduz esse pico rapidamente; não foi artificialmente zerado no assembly porque isso exigiria deformação física.

          ## Calça em gravidade zero

          Fixture real `straight-pants-standard`, quatro PanelInstances e 20 relations materiais, incluindo duas pences por cópia física e os dois fechamentos de gancho por paired copies:

          - STEP 0: seam mean ~25.45 mm, max ~96.28 mm;
          - STEP 1: ~22.00 / 94.36 mm;
          - STEP 10: ~2.68 / 40.52 mm;
          - STEP 60: ~0.336 / 33.49 mm;
          - STEP 240: ~0.346 / 33.51 mm;
          - nenhum NaN/Infinity;
          - nenhuma explosão radial;
          - nenhum painel disparando por metros;
          - shell permanece tridimensional.

          O max residual restante é local/compatibilidade física, não reconstrução de topologia pelo solver.

          ## Performance

          O assembly roda somente em rebuild. Nos fixtures complexos observados ficou aproximadamente na faixa de 160–250 ms no runner Linux, dentro da meta inicial de 100–300 ms para garments comuns.

          Os kernels XPBD do Prompt 10.4-A não foram alterados. O benchmark determinístico de hot loops é reexecutado nesta validação final para impedir regressão de TypedArrays/kernels.

          ## Determinismo

          Testes cobrem alteração de display names, piece insertion order, SeamGroup insertion order, same/opposite, remoção/adição de relations e A→B→A. A solução não consulta nomes de roupa, template ids ou posição visual do editor para selecionar a estratégia.

          ## Documentação superseded

          Documentos históricos que descreviam anchors/BFS/tube heuristics como arquitetura final foram marcados como históricos/superseded e apontam para `docs/ASSEMBLY_ARCHITECTURE.md`.

          ## Limitações reais

          - Uma hinge isolada continua matematicamente ambígua.
          - Garments com várias soluções rígidas equivalentes podem escolher uma das hipóteses determinísticas disponíveis.
          - Relações materialmente incompatíveis mantêm residual para o XPBD.
          - O solver atual é alternating rigid registration, não um Gauss-Newton completo sobre uma Lie algebra SE(3). Graphs futuros muito grandes podem justificar pose-graph optimization contínua.
          - O resultado ainda precisa de validação manual visual no produto, especialmente em garments autorais com combinações de seams nunca cobertas pelas fixtures.

          ## Fora de escopo preservado

          Não foi implementado:

          - body/avatar collision;
          - self-collision;
          - cloth-cloth collision;
          - chão;
          - physics mesh reduzida / Prompt 10.4-B;
          - IA/LLM;
          - Prompt 11.

          A física continua recebendo uma pose inicial espacial, não sendo usada para descobrir a topologia da roupa.
          EOF
          python - <<'PY'
          import json, re
          from pathlib import Path
          path = Path('docs/progress/PROMPT_10_6_CONSTRAINT_SPATIAL_ASSEMBLY.md')
          perf = Path('/tmp/moldeon-10-6-perf.log').read_text(errors='ignore')
          browser = Path('/tmp/moldeon-10-6-browser.log').read_text(errors='ignore')
          appendix = ['\n## Métricas da validação final\n']
          match = re.search(r'MOLDEON_XPBD_PERF (\[.*\])', perf)
          if match:
              rows = json.loads(match.group(1))
              heavy = next((row for row in rows if row.get('scene') == 'D-heavy-garment'), None)
              if heavy:
                  appendix.append(f"- 10.4-A heavy fixture: median {heavy['medianMs']:.3f} ms, p95 {heavy['p95Ms']:.3f} ms; invalid={heavy['invalid']}.\n")
          match = re.search(r'MOLDEON_10_6_BROWSER (\{.*\})', browser)
          if match:
              row = json.loads(match.group(1))
              appendix.append(
                  f"- Chromium real pants smoke: strategy `{row['strategy']}`, nodes {row['nodeCount']}, "
                  f"STEP0 {row['initialMeanMm']:.3f}/{row['initialMaxMm']:.3f} mm, "
                  f"STEP240 {row['finalMeanMm']:.3f}/{row['finalMaxMm']:.3f} mm, "
                  f"one-step max {row['oneStepMaxM']:.5f} m, invalid={row['invalid']}.\n"
              )
          path.write_text(path.read_text() + ''.join(appendix))
          PY
      - name: Diff check
        run: git diff --check
      - name: Show materialized change set
        run: git status --short
      - name: Remove recovery scaffolding
        run: |
          rm -f scripts/recovery-10-6-integration.py
          rm -f scripts/recovery-10-6-fix1.py
          rm -f scripts/recovery-10-6-paired-copies.py
          rm -f scripts/recovery-10-6-paired-fix.py
          rm -f scripts/recovery-10-6-relation-frames.py
          rm -f scripts/recovery-10-6-test-fixes.py
          rm -f scripts/recovery-10-6-material-flat-seed.py
          rm -f scripts/recovery-10-6-intrinsic-mode.py
          rm -f scripts/recovery-10-6-structural-objective.py
          rm -f scripts/recovery-10-6-frozen-legacy-candidate.py
          rm -f scripts/recovery-10-6-euclidean-intrinsic.py
          rm -f scripts/recovery-10-6-doc-notes.py
          rm -f scripts/recovery-10-6-browser-smoke.mjs
          rm -f .github/workflows/recovery-10-6-apply.yml
      - name: Commit push and verify branch identity
        run: |
          git config user.name "Moldeon Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "refactor(assembly): solve garment poses from seam constraints"
          git push origin HEAD:recovery/10.6-constraint-spatial-assembly
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git ls-remote origin refs/heads/recovery/10.6-constraint-spatial-assembly | cut -f1)
          echo "LOCAL_SHA=$LOCAL_SHA"
          echo "REMOTE_SHA=$REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
          test -z "$(git status --porcelain)"
