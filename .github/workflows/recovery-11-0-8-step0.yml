name: Recovery 11.0.8 geometric STEP-0

on:
  workflow_dispatch:
  push:
    branches:
      - "recovery/11.0.8-sewing-2d-3d-authoring"
    paths:
      - "scripts/apply-11-0-8-step0.py"
      - ".github/workflows/recovery-11-0-8-step0.yml"

permissions:
  contents: write

concurrency:
  group: recovery-11-0-8-step0
  cancel-in-progress: false

jobs:
  step0:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: "recovery/11.0.8-sewing-2d-3d-authoring"
          fetch-depth: 0

      - name: Verify triggering commit is branch head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Apply geometric STEP-0 gate
        run: python3 scripts/apply-11-0-8-step0.py

      - name: Diff check
        run: git diff --check

      - name: Guard architecture
        shell: bash
        run: |
          if git diff --name-only | grep -q '^apps/web/src/physics/'; then
            echo 'physics/** must remain untouched' >&2
            exit 1
          fi
          if git diff -- apps/web/src/viewport/GlobalThreeViewport.ts | grep -E '^\+.*\.(dress|start|resume)\('; then
            echo 'STEP-0 must not start simulation/dress' >&2
            exit 1
          fi
          grep -q 'mode: "step0"' apps/web/src/viewport/GlobalThreeViewport.ts
          grep -q 'simulation.pause()' apps/web/src/viewport/GlobalThreeViewport.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused STEP-0 and sewing tests
        run: npm run test --workspace @moldeon/web -- src/viewport/SewingStep0.test.ts src/garment3d/AssemblyWorkerClient.test.ts src/garment3d/IsometricSurfaceAssembly.test.ts src/garment3d/CoarseAssemblyPipeline.test.ts src/viewport/SewingInteraction.test.ts src/viewport/SewingVisualPairing.test.ts src/viewport/ArrangementWorkspace.test.ts src/state/assemblyHistory.test.ts --reporter=verbose

      - name: Production build
        run: npm run build

      - name: Commit validated STEP-0 and remove temporary helpers
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/garment3d/AssemblyWorkerProtocol.ts \
            apps/web/src/garment3d/AssemblyWorkerClient.ts \
            apps/web/src/garment3d/AssemblyWorkerClient.test.ts \
            apps/web/src/viewport/GlobalThreeViewport.ts \
            apps/web/src/viewport/GarmentViewport.tsx \
            apps/web/src/viewport/SewingStep0.ts \
            apps/web/src/viewport/SewingStep0.test.ts \
            apps/web/src/styles.css \
            docs/modifications-11.0.8.md
          git rm -f scripts/apply-11-0-8-step0.py .github/workflows/recovery-11-0-8-step0.yml
          git commit -m "feat(sewing): add geometric step0 assembly gate"
          git push origin HEAD:recovery/11.0.8-sewing-2d-3d-authoring
