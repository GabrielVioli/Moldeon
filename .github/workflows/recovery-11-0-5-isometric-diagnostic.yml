name: recovery-11-0-5-isometric-diagnostic

on:
  push:
    branches:
      - recovery/11.0.5-exact-human-surface-contact

permissions:
  contents: write

jobs:
  diagnose-and-clean:
    if: "github.event.head_commit.message == 'chore(11.0.5): diagnose failed local-band recovery'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.5-exact-human-surface-contact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - name: Instrument isometric pass residuals
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/physics/bodyCollision.ts')
          s = p.read_text(encoding='utf-8')
          old = '''      const penetrationM = maximumInitialExactPenetration(body, positions);\n      const edgeError = maximumInitialEdgeRelativeError(positions, edges);\n      const seamErrorM = maximumInitialSeamDistanceError(positions, clothSeams, seamTargets);\n      if (Number.isFinite(penetrationM)'''
          new = '''      const penetrationM = maximumInitialExactPenetration(body, positions);\n      const edgeError = maximumInitialEdgeRelativeError(positions, edges);\n      const seamErrorM = maximumInitialSeamDistanceError(positions, clothSeams, seamTargets);\n      console.log("P1105_ISOMETRIC_PASS", JSON.stringify({ pass: pass + 1, penetrationMm: penetrationM * 1000, edgeRelativeError: edgeError, seamErrorMm: seamErrorM * 1000, displacementMm: displacementM * 1000 }));\n      if (Number.isFinite(penetrationM)'''
          if s.count(old) != 1:
              raise SystemExit(f'instrumentation marker count={s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='\n')
          PY
      - name: Run straight-skirt diagnostic
        id: diagnostic
        continue-on-error: true
        run: npm run test --workspace @moldeon/web -- exactBodyGarmentGate.test.ts
      - name: Restore failed candidate only
        shell: bash
        run: |
          git restore -- apps/web/src/physics/bodyCollision.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-commit 8e0e511433b4a558d9958154f502eb71a5ca2d36
          git rm -f --ignore-unmatch -- .github/workflows/recovery-11-0-5-local-band-candidate.yml .github/workflows/recovery-11-0-5-isometric-diagnostic.yml
          git diff --cached --check
          git commit -m "revert(11.0.5): restore pre-local-band recovery state"
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
