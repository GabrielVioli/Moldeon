name: recovery-11-0-5-isometric-runner

on:
  push:
    branches:
      - recovery/11.0.5-exact-human-surface-contact

permissions:
  contents: write

jobs:
  candidate:
    if: "github.event.head_commit.message == 'chore(11.0.5): run isometric recovery candidate'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.5-exact-human-surface-contact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - name: Extract and apply candidate
        shell: bash
        run: |
          python <<'PYEXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/recovery-11-0-5-isometric-candidate.yml').read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          lines = block.splitlines()
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_candidate.py').write_text(block, encoding='utf-8')
          PYEXTRACT
          python /tmp/apply_candidate.py
      - name: Preflight diff
        run: |
          git diff --check
          git diff --stat
      - name: Publish WIP candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/physics/bodyCollisionExact.test.ts
          git rm -- .github/workflows/recovery-11-0-5-isometric-candidate.yml .github/workflows/recovery-11-0-5-isometric-runner.yml
          git commit -m "wip(11.0.5): isometric multi-panel STEP-0 recovery"
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
      - name: Focused tests
        run: npm run test --workspace @moldeon/web -- bodyCollisionExact.test.ts XpbdWorkerState.test.ts exactBodyGarmentGate.test.ts
