name: Temporary mobile preview artifact

on:
  push:
    branches:
      - feat/11.0.7a-mobile-touch-portrait-landscape

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: moldeon-mobile-preview-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1
