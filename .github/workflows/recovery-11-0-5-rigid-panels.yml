name: recovery-11-0-5-rigid-panels

on:
  push:
    branches:
      - recovery/11.0.5-exact-human-surface-contact

permissions:
  contents: write

jobs:
  candidate:
    if: "github.event.head_commit.message == 'chore(11.0.5): stage rigid-panel recovery candidate'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/11.0.5-exact-human-surface-contact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - name: Build rigid-panel shape-matching candidate
        shell: bash
        run: |
          git show --format= 1b06c6bd8c40a4ba95e8257068052717d0fc1816 -- \
            apps/web/src/physics/bodyCollision.ts \
            apps/web/src/physics/xpbd.ts \
            apps/web/src/physics/bodyCollisionExact.test.ts | git apply -
          python <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/physics/bodyCollision.ts')
          s = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          one('const INITIAL_ISOMETRIC_TARGET_PENETRATION_M = 0.00025;',
              'const INITIAL_ISOMETRIC_TARGET_PENETRATION_M = 0.0045;', 'target')
          one('const INITIAL_ISOMETRIC_PROJECTION_SWEEPS = 16;',
              'const INITIAL_ISOMETRIC_PROJECTION_SWEEPS = 32;', 'sweeps')
          one('  const edges = buildInitialEdgeConstraints(original, clothTriangles);\n  const seamTargets = captureInitialSeamDistances(original, clothSeams);',
              '  const edges = buildInitialEdgeConstraints(original, clothTriangles);\n  const rigidPanels = buildInitialRigidPanels(positions.length / 3, clothTriangles);\n  const seamTargets = captureInitialSeamDistances(original, clothSeams);', 'panels init')
          one('''  body.initialOverlapGuardMask.set(body.deepInitialOverlapMask);\n  for (let pass = 0; pass < INITIAL_DEPENETRATION_MAX_PASSES; pass += 1) {''',
              '''  body.initialOverlapGuardMask.set(body.deepInitialOverlapMask);\n  if (inverseMasses && rigidPanels.some((panel) =>\n    panel.some((particle) => body.deepInitialOverlapMask[particle] !== 0)\n      && panel.some((particle) => inverseMasses[particle] <= 0))) {\n    body.initialOverlapGuardMask.fill(0);\n    body.initialOverlapUnresolved = true;\n    return false;\n  }\n  for (let pass = 0; pass < INITIAL_DEPENETRATION_MAX_PASSES; pass += 1) {''', 'fixed guard')
          one('''    for (let sweep = 0; sweep < INITIAL_ISOMETRIC_PROJECTION_SWEEPS; sweep += 1) {\n      if (sweep % 2 === 1) projectInitialSeams(positions, clothSeams, seamTargets, inverseMasses, correctionLimit);\n      projectInitialTriangleEdges(positions, edges, inverseMasses, correctionLimit);\n      if (sweep % 2 === 0) projectInitialSeams(positions, clothSeams, seamTargets, inverseMasses, correctionLimit);\n      clampInitialRecoveryDisplacements(original, positions, INITIAL_DEPENETRATION_MAX_TOTAL_TRANSLATION_M);\n    }''',
              '''    for (let sweep = 0; sweep < INITIAL_ISOMETRIC_PROJECTION_SWEEPS; sweep += 1) {\n      projectInitialSeams(positions, clothSeams, seamTargets, inverseMasses, correctionLimit);\n      projectInitialRigidPanels(original, positions, rigidPanels);\n    }''', 'projection loop')
          one('''    const displacementM = maximumInitialParticleDisplacement(original, positions);\n    if (!Number.isFinite(displacementM)) break;\n    maximumDisplacementM = Math.max(maximumDisplacementM, displacementM);''',
              '''    const displacementM = maximumInitialParticleDisplacement(original, positions);\n    if (!Number.isFinite(displacementM) || displacementM > INITIAL_DEPENETRATION_MAX_TOTAL_TRANSLATION_M + INITIAL_DEPENETRATION_EPSILON_M) break;\n    maximumDisplacementM = Math.max(maximumDisplacementM, displacementM);''', 'bounded displacement')

          marker = 'function projectInitialTriangleEdges(positions: Float32Array, edges: readonly InitialEdgeConstraint[], inverseMasses: Float32Array | undefined, limit: number): void {'
          helpers = r'''function buildInitialRigidPanels(particleCount: number, triangles: Uint32Array): number[][] {
            const used = new Uint8Array(particleCount);
            for (const particle of triangles) if (particle < particleCount) used[particle] = 1;
            return buildClothConnectedComponents(particleCount, triangles)
              .filter((component) => component.some((particle) => used[particle] !== 0));
          }

          function projectInitialRigidPanels(
            original: Float32Array,
            positions: Float32Array,
            panels: readonly (readonly number[])[],
          ): void {
            for (const panel of panels) projectInitialRigidPanel(original, positions, panel);
          }

          function projectInitialRigidPanel(
            original: Float32Array,
            positions: Float32Array,
            particles: readonly number[],
          ): void {
            if (particles.length === 0) return;
            let sourceX = 0, sourceY = 0, sourceZ = 0;
            let targetX = 0, targetY = 0, targetZ = 0;
            for (const particle of particles) {
              const offset = particle * 3;
              sourceX += original[offset]; sourceY += original[offset + 1]; sourceZ += original[offset + 2];
              targetX += positions[offset]; targetY += positions[offset + 1]; targetZ += positions[offset + 2];
            }
            const inverseCount = 1 / particles.length;
            sourceX *= inverseCount; sourceY *= inverseCount; sourceZ *= inverseCount;
            targetX *= inverseCount; targetY *= inverseCount; targetZ *= inverseCount;
            if (particles.length === 1) {
              const offset = particles[0] * 3;
              positions[offset] = targetX; positions[offset + 1] = targetY; positions[offset + 2] = targetZ;
              return;
            }

            let sxx = 0, sxy = 0, sxz = 0;
            let syx = 0, syy = 0, syz = 0;
            let szx = 0, szy = 0, szz = 0;
            for (const particle of particles) {
              const offset = particle * 3;
              const ax = original[offset] - sourceX;
              const ay = original[offset + 1] - sourceY;
              const az = original[offset + 2] - sourceZ;
              const bx = positions[offset] - targetX;
              const by = positions[offset + 1] - targetY;
              const bz = positions[offset + 2] - targetZ;
              sxx += ax * bx; sxy += ax * by; sxz += ax * bz;
              syx += ay * bx; syy += ay * by; syz += ay * bz;
              szx += az * bx; szy += az * by; szz += az * bz;
            }
            const horn = [
              sxx + syy + szz, syz - szy, szx - sxz, sxy - syx,
              syz - szy, sxx - syy - szz, sxy + syx, szx + sxz,
              szx - sxz, sxy + syx, -sxx + syy - szz, syz + szy,
              sxy - syx, szx + sxz, syz + szy, -sxx - syy + szz,
            ];
            let shift = 0;
            for (let row = 0; row < 4; row += 1) {
              let rowMagnitude = 0;
              for (let column = 0; column < 4; column += 1) rowMagnitude += Math.abs(horn[row * 4 + column]);
              shift = Math.max(shift, rowMagnitude);
            }
            shift += 1e-12;
            let qw = 1, qx = 0, qy = 0, qz = 0;
            for (let iteration = 0; iteration < 24; iteration += 1) {
              const q = [qw, qx, qy, qz];
              const next = [0, 0, 0, 0];
              for (let row = 0; row < 4; row += 1) {
                for (let column = 0; column < 4; column += 1) {
                  next[row] += (horn[row * 4 + column] + (row === column ? shift : 0)) * q[column];
                }
              }
              const length = Math.hypot(next[0], next[1], next[2], next[3]);
              if (length <= EPSILON) break;
              qw = next[0] / length; qx = next[1] / length; qy = next[2] / length; qz = next[3] / length;
              if (qw < 0) { qw = -qw; qx = -qx; qy = -qy; qz = -qz; }
            }
            const xx = qx * qx, yy = qy * qy, zz = qz * qz;
            const xy = qx * qy, xz = qx * qz, yz = qy * qz;
            const wx = qw * qx, wy = qw * qy, wz = qw * qz;
            const r00 = 1 - 2 * (yy + zz), r01 = 2 * (xy - wz), r02 = 2 * (xz + wy);
            const r10 = 2 * (xy + wz), r11 = 1 - 2 * (xx + zz), r12 = 2 * (yz - wx);
            const r20 = 2 * (xz - wy), r21 = 2 * (yz + wx), r22 = 1 - 2 * (xx + yy);
            for (const particle of particles) {
              const offset = particle * 3;
              const x = original[offset] - sourceX;
              const y = original[offset + 1] - sourceY;
              const z = original[offset + 2] - sourceZ;
              positions[offset] = targetX + r00 * x + r01 * y + r02 * z;
              positions[offset + 1] = targetY + r10 * x + r11 * y + r12 * z;
              positions[offset + 2] = targetZ + r20 * x + r21 * y + r22 * z;
            }
          }

          '''
          one(marker, helpers + marker, 'shape helpers')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff --stat
      - name: Publish WIP candidate
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/physics/bodyCollision.ts apps/web/src/physics/xpbd.ts apps/web/src/physics/bodyCollisionExact.test.ts
          git rm -- .github/workflows/recovery-11-0-5-rigid-panels.yml
          git commit -m "wip(11.0.5): rigid-panel shape matching recovery"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
      - name: Focused tests
        id: focused
        continue-on-error: true
        run: npm run test --workspace @moldeon/web -- bodyCollisionExact.test.ts XpbdWorkerState.test.ts exactBodyGarmentGate.test.ts
      - name: Clean failed candidate
        if: steps.focused.outcome != 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-commit "${{ steps.publish.outputs.candidate_sha }}"
          git rm -f --ignore-unmatch -- .github/workflows/recovery-11-0-5-rigid-panels.yml
          git diff --cached --check
          git commit -m "revert(11.0.5): restore pre-rigid-panel recovery state"
          git push origin HEAD:recovery/11.0.5-exact-human-surface-contact
          exit 1
      - name: Typecheck
        if: steps.focused.outcome == 'success'
        run: npm run typecheck --workspace @moldeon/web
      - name: Build
        if: steps.focused.outcome == 'success'
        run: npm run build --workspace @moldeon/web
